        // ==========================================
        const IDB_NAME = "MBMStudioPro_MediaDB_v1";
        const IDB_STORE = "active_media";

        const openVideoDB = () => {
            return new Promise((resolve) => {
                if (!window.indexedDB) {
                    console.warn("IndexedDB tidak didukung pada browser ini.");
                    return resolve(null);
                }
                const req = indexedDB.open(IDB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) {
                        db.createObjectStore(IDB_STORE);
                    }
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = () => resolve(null);
            });
        };

        const storeVideoInIDB = async (file, projId = 1) => {
            try {
                const db = await openVideoDB();
                if (!db) return false;
                return new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE, "readwrite");
                    const store = tx.objectStore(IDB_STORE);
                    store.put(file, `video_project_${projId}`);
                    store.put(file, "current_video_file");
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) {
                console.warn("Gagal menyimpan video ke IndexedDB:", e);
                return false;
            }
        };

        const loadVideoFromIDB = async (projId = 1) => {
            try {
                const db = await openVideoDB();
                if (!db) return null;
                return new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE, "readonly");
                    const store = tx.objectStore(IDB_STORE);
                    const getReq = store.get(`video_project_${projId}`);
                    getReq.onsuccess = () => {
                        if (getReq.result) return resolve(getReq.result);
                        const fallbackReq = store.get("current_video_file");
                        fallbackReq.onsuccess = () => resolve(fallbackReq.result || null);
                        fallbackReq.onerror = () => resolve(null);
                    };
                    getReq.onerror = () => resolve(null);
                });
            } catch (e) {
                console.warn("Gagal memuat video dari IndexedDB:", e);
                return null;
            }
        };

        const removeVideoFromIDB = async (projId = 1) => {
            try {
                const db = await openVideoDB();
                if (!db) return false;
                return new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE, "readwrite");
                    const store = tx.objectStore(IDB_STORE);
                    store.delete(`video_project_${projId}`);
                    store.delete("current_video_file");
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) {
                console.warn("Gagal menghapus video dari IndexedDB:", e);
                return false;
            }
        };

        const clearAllVideosFromIDB = async () => {

                    const tx = db.transaction(IDB_STORE, "readwrite");
                    const store = tx.objectStore(IDB_STORE);
                    store.clear();
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) {
                console.warn("Gagal membersihkan seluruh media di IndexedDB:", e);
                return false;

            const [historyStack, setHistoryStack] = useState([]);

            const [lang, setLang] = useState(() => {

            const [showRatingChart, setShowRatingChart] = useState(true);

            const [showChartDelta, setShowChartDelta] = useState(true);
            const [showAnalyticsDrawer, setShowAnalyticsDrawer] = useState(false);
            const mbmListRef = useRef(null);

            // Deteksi Baris MBM yang Sedang Berjalan (Active Row) Berdasarkan currentTime Video
            const activeRowId = React.useMemo(() => {

            // Auto-scroll tabel MBM agar baris yang sedang tayang selalu terlihat di layar
            useEffect(() => {

            }, [activeRowId, isPlaying, isAutoScrollMbm]);

            // Hitung Metrik Ringkasan Rating TV (Avg TVR, Peak TVR, Avg Share, Peak Share)
            const ratingStats = React.useMemo(() => {
                const validRows = mbmRows.filter(r => r.tvr !== undefined && r.tvr !== null && !isNaN(Number(r.tvr)));
                if (validRows.length === 0) return null;
                
                let sumTvr = 0;
                let maxTvr = -Infinity;
                let peakTvrRow = null;
                let sumShare = 0;
                let maxShare = -Infinity;
                let peakShareRow = null;
                let countShare = 0;

                validRows.forEach(r => {
                    const tvrVal = Number(r.tvr);
                    sumTvr += tvrVal;
                    if (tvrVal > maxTvr) {
                        maxTvr = tvrVal;

                    if (r.share !== undefined && r.share !== null && !isNaN(Number(r.share))) {
                        const shareVal = Number(r.share);
                        sumShare += shareVal;
                        countShare++;
                        if (shareVal > maxShare) {

                    }
                });

                return {
                    avgTvr: (sumTvr / validRows.length).toFixed(2),
                    peakTvr: maxTvr > -Infinity ? maxTvr.toFixed(2) : "0.00",
                    peakTvrTime: peakTvrRow ? peakTvrRow.rentangWaktu : "-",
                    avgShare: countShare > 0 ? (sumShare / countShare).toFixed(1) : "0.0",
                    peakShare: maxShare > -Infinity ? maxShare.toFixed(1) : "0.0",
                    peakShareTime: peakShareRow ? peakShareRow.rentangWaktu : "-",
                    totalPoints: validRows.length
                };
            }, [mbmRows]);

            // Helper Pendeteksi Emosi & Pacing Konten Siaran (Automated Broadcast Content Classifier)
            const detectRowAnalytics = (row, idx = 0) => {
                let pacing = row.pacing;
                let emosi = row.emosi;

                const desc = String(row.deskripsi || "").toLowerCase();
                const unit = String(row.unit || "").toLowerCase();

                if (!emosi) {
                    if (unit.includes('iklan') || unit.includes('break') || unit.includes('ads') || desc.includes('transisi dan iklan') || desc.includes('iklan')) {
                        emosi = 'Netral';
                    } else if (desc.includes('konflik') || desc.includes('marah') || desc.includes('kesal') || desc.includes('debat') || desc.includes('ribut') || desc.includes('adu') || desc.includes('penyadapan') || desc.includes('ancam') || desc.includes('khianat') || desc.includes('fitnah') || desc.includes('panik')) {
                        emosi = 'Konflik';
                    } else if (desc.includes('menangis') || desc.includes('tangis') || desc.includes('sedih') || desc.includes('curhat') || desc.includes('mencurahkan') || desc.includes('kecewa') || desc.includes('gelisah') || desc.includes('maaf')) {
                        emosi = 'Sedih';
                    } else if (desc.includes('bahagia') || desc.includes('senang') || desc.includes('tertawa') || desc.includes('tawa') || desc.includes('canda') || desc.includes('ceria') || desc.includes('joget') || desc.includes('lagu') || desc.includes('pesta') || desc.includes('ulang tahun') || desc.includes('lucu') || desc.includes('makan')) {
                        emosi = 'Happy';
                    } else if (desc.includes('tegang') || desc.includes('misi') || desc.includes('waspada') || desc.includes('polisi') || desc.includes('ancaman')) {
                        emosi = 'Tegang';
                    } else {
                        const defaults = ['Konflik', 'Sedih', 'Happy', 'Netral', 'Tegang'];
                        emosi = defaults[idx % defaults.length];
                    }
                }

                if (!pacing) {
                    if (unit.includes('iklan') || unit.includes('break') || desc.includes('iklan') || emosi === 'Konflik') {
                        pacing = 'Cepat';
                    } else if (emosi === 'Sedih' || desc.includes('mencurahkan') || desc.includes('hening')) {
                        pacing = 'Lambat';
                    } else {
                        pacing = 'Sedang';
                    }
                }

                return { pacing, emosi };
            };

            // Hitung Analisis Statistik Lanjutan, Bentuk Kurva & Korelasi Emosi Konten
            const statisticalAnalytics = React.useMemo(() => {
                const validRows = mbmRows.filter(r => r.tvr !== undefined && r.tvr !== null && !isNaN(Number(r.tvr)));
                if (validRows.length === 0) return null;

                const N = validRows.length;
                const tvrValues = validRows.map(r => Number(r.tvr));
                const meanTvr = tvrValues.reduce((a, b) => a + b, 0) / N;

                // 1. Regresi Linear Slope (Beta) & Korelasi Pearson (r)
                let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;
                validRows.forEach((r, i) => {
                    const x = i;
                    const y = Number(r.tvr);
                    sumX += x;
                    sumY += y;
                    sumXY += x * y;
                    sumX2 += x * x;
                    sumY2 += y * y;
                });
                const denom = (N * sumX2 - sumX * sumX);
                const slopeBeta = denom !== 0 ? ((N * sumXY - sumX * sumY) / denom) : 0;
                const denomR = Math.sqrt((N * sumX2 - sumX * sumX) * (N * sumY2 - sumY * sumY));
                const pearsonR = denomR !== 0 ? ((N * sumXY - sumX * sumY) / denomR) : 0;

                // 2. Volatilitas Audiens (Standar Deviasi Sigma)
                const variance = tvrValues.reduce((acc, val) => acc + Math.pow(val - meanTvr, 2), 0) / N;
                const stdDev = Math.sqrt(variance);

                // 3. Tipologi Bentuk Kurva Penyiaran (Broadcast Curve Typology)
                let curveTypology = {
                    name: "Plateau / Retensi Stabil",
                    icon: "fa-grip-lines",
                    color: "text-sky-300",
                    badge: "Retensi Audiens Loyal",
                    desc: "Fluktuasi TVR stabil tanpa penurunan signifikan, basis penonton sangat loyal."
                };
                if (slopeBeta >= 0.035) {
                    curveTypology = {
                        name: "Ascending Hook (Tangga Naik)",
                        icon: "fa-arrow-trend-up",
                        color: "text-neon",
                        badge: "Daya Tarik Meningkat",
                        desc: `TVR bertumbuh +${slopeBeta.toFixed(2)} poin per segmen. Cerita berhasil menarik penonton baru masuk.`
                    };
                } else if (slopeBeta <= -0.035) {
                    curveTypology = {
                        name: "Descending Churn (Pelepasan Audiens)",
                        icon: "fa-arrow-trend-down",
                        color: "text-rose-400",
                        badge: "Risiko Pindah Channel",
                        desc: `TVR mengalami penurunan rata-rata ${Math.abs(slopeBeta).toFixed(2)} poin per segmen.`
                    };
                }

                // 4. Retensi Iklan & Pemulihan (Bounce-Back Ratio)
                const adRows = validRows.filter(r => {
                    const u = String(r.unit || "").toLowerCase();
                    return u.includes('iklan') || u.includes('break') || u.includes('ads');
                });
                const progRows = validRows.filter(r => {
                    const u = String(r.unit || "").toLowerCase();
                    return !u.includes('iklan') && !u.includes('break') && !u.includes('ads');
                });
                const avgProgTvr = progRows.length > 0 ? (progRows.reduce((a, b) => a + Number(b.tvr), 0) / progRows.length) : meanTvr;
                const avgAdTvr = adRows.length > 0 ? (adRows.reduce((a, b) => a + Number(b.tvr), 0) / adRows.length) : (meanTvr * 0.6);
                const bounceBackPct = avgProgTvr > 0 ? ((avgAdTvr / avgProgTvr) * 100) : 100;

                // 5. Analisis Emosi Konten vs Rating
                const emotionMap = {
                    'Konflik': { count: 0, sumTvr: 0, maxTvr: 0, label: 'Konflik / Marah', icon: '😡', color: '#f43f5e' },
                    'Sedih': { count: 0, sumTvr: 0, maxTvr: 0, label: 'Sedih / Melankolis', icon: '😢', color: '#60a5fa' },
                    'Happy': { count: 0, sumTvr: 0, maxTvr: 0, label: 'Ceria / Romantis', icon: '😊', color: '#34d399' },
                    'Tegang': { count: 0, sumTvr: 0, maxTvr: 0, label: 'Tegang / Suspense', icon: '😱', color: '#fb923c' },
                    'Netral': { count: 0, sumTvr: 0, maxTvr: 0, label: 'Netral / Transisi', icon: 'ℹ️', color: '#94a3b8' }
                };

                // 6. Analisis Pacing Konten
                const pacingMap = {
                    'Cepat': { count: 0, sumTvr: 0, label: 'Cepat (Fast)', icon: '⚡', color: '#f59e0b' },
                    'Sedang': { count: 0, sumTvr: 0, label: 'Sedang (Normal)', icon: '⏱️', color: '#94a3b8' },
                    'Lambat': { count: 0, sumTvr: 0, label: 'Lambat (Dragging)', icon: '⏳', color: '#c084fc' }
                };

                validRows.forEach((r, idx) => {
                    const a = detectRowAnalytics(r, idx);
                    const em = a.emosi || 'Netral';
                    const pc = a.pacing || 'Sedang';
                    const val = Number(r.tvr);

                    if (emotionMap[em]) {
                        emotionMap[em].count++;
                        emotionMap[em].sumTvr += val;
                        if (val > emotionMap[em].maxTvr) emotionMap[em].maxTvr = val;
                    }
                    if (pacingMap[pc]) {
                        pacingMap[pc].count++;
                        pacingMap[pc].sumTvr += val;
                    }
                });

                const emotionStats = Object.keys(emotionMap).map(k => ({
                    key: k,
                    ...emotionMap[k],
                    avgTvr: emotionMap[k].count > 0 ? (emotionMap[k].sumTvr / emotionMap[k].count).toFixed(2) : "0.00",
                    pctOfTotal: ((emotionMap[k].count / N) * 100).toFixed(0)
                })).sort((a, b) => Number(b.avgTvr) - Number(a.avgTvr));

                const pacingStats = Object.keys(pacingMap).map(k => ({
                    key: k,
                    ...pacingMap[k],
                    avgTvr: pacingMap[k].count > 0 ? (pacingMap[k].sumTvr / pacingMap[k].count).toFixed(2) : "0.00",
                    pctOfTotal: ((pacingMap[k].count / N) * 100).toFixed(0)
                }));

                const topEmotion = emotionStats.find(e => e.count > 0);
                const draggingRisks = validRows.filter((r, i) => {
                    const a = detectRowAnalytics(r, i);
                    const prev = i > 0 ? Number(validRows[i - 1].tvr) : Number(r.tvr);
                    return a.pacing === 'Lambat' && (Number(r.tvr) - prev) < -0.3;
                });

                return {
                    N,
                    meanTvr: meanTvr.toFixed(2),
                    slopeBeta: slopeBeta.toFixed(3),
                    pearsonR: pearsonR.toFixed(2),
                    stdDev: stdDev.toFixed(2),
                    curveTypology,
                    avgProgTvr: avgProgTvr.toFixed(2),
                    avgAdTvr: avgAdTvr.toFixed(2),
                    bounceBackPct: Math.round(bounceBackPct),
                    emotionStats,
                    pacingStats,
                    topEmotion,
                    draggingRisks
                };
            }, [mbmRows]);

            // Parser Cepat untuk Tempel Data Rating Nielsen (Fitur C)
            const parseAndApplyRatingData = (text) => {
                if (!text || !text.trim()) {
                    notify("Harap tempelkan data teks rating terlebih dahulu.");
                    return;
                }

                const lines = text.trim().split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                if (lines.length === 0) return;

                let appliedCount = 0;
                const newRows = [...mbmRows];

                lines.forEach((line, lineIdx) => {
                    let tokens = line.split('\t').map(t => t.trim()).filter(Boolean);
                    if (tokens.length <= 1) {
                        tokens = line.split(/,\s*/).map(t => t.trim()).filter(Boolean);
                    }
                    if (tokens.length <= 1) {
                        tokens = line.split(/\s{2,}/).map(t => t.trim()).filter(Boolean);
                    }

                    let timeVal = null;
                    let tvrVal = null;
                    let shareVal = null;
                    let unitVal = null;

                    tokens.forEach(tok => {
                        if (/^\d{1,2}:\d{2}/.test(tok) || (tok.includes('-') && /\d/.test(tok))) {
                            timeVal = tok;
                        } else if (!isNaN(Number(tok.replace('%', '')))) {
                            const num = Number(tok.replace('%', ''));
                            if (tvrVal === null) {
                                tvrVal = num;
                            } else if (shareVal === null) {
                                shareVal = num;
                            }
                        } else {
                            unitVal = tok;
                        }
                    });

                    if (lineIdx < newRows.length) {
                        newRows[lineIdx] = {
                            ...newRows[lineIdx],
                            ...(timeVal ? { rentangWaktu: timeVal } : {}),
                            ...(tvrVal !== null ? { tvr: tvrVal } : {}),
                            ...(shareVal !== null ? { share: shareVal } : {}),
                            ...(unitVal ? { unit: unitVal } : {})
                        };
                        appliedCount++;
                    } else {
                        const lastStart = lineIdx * (intervalMinutes * 60);
                        const lastEnd = (lineIdx + 1) * (intervalMinutes * 60);
                        newRows.push({
                            id: Date.now() + lineIdx,
                            rentangWaktu: timeVal || `${formatTime(lastStart)} - ${formatTime(lastEnd)}`,
                            deskripsi: `Segmen tayangan menit ke-${lineIdx + 1}`,
                            tvr: tvrVal !== null ? tvrVal : 2.5,
                            share: shareVal !== null ? shareVal : 13.0,
                            unit: unitVal || "Segmen"
                        });
                        appliedCount++;
                    }
                });

                setMbmRows(newRows);
                localStorage.setItem('mbm_rows_v3', JSON.stringify(newRows));
                setShowRatingChart(true);
                setShowRatingModal(false);
                setPastedRatingText("");
                notify(`Berhasil menerapkan data performa rating pada ${appliedCount} menit MBM!`);
            };

            // ==========================================
            // STATE AREA LAYAR: MASKING MERAH (ABAIKAN) & FOKUS HIJAU (HEADLINE / LOWER THIRD)
            // ==========================================
            const defaultMaskPresets = [
                { id: 1, name: "Lower Third (Headline)", mode: "focus", x: 2, y: 64, width: 48, height: 26 },
                { id: 2, name: "QR Code", mode: "exclusion", x: 84, y: 72, width: 14, height: 26 },
                { id: 3, name: "Logo / Jam TV", mode: "exclusion", x: 2, y: 2, width: 32, height: 16 }

                                ...m,
                                mode: m.mode || (m.name && (m.name.toLowerCase().includes('fokus') || m.name.toLowerCase().includes('headline') || m.name.toLowerCase().includes('lower third') || m.name.toLowerCase().includes('narasumber')) ? 'focus' : 'exclusion'),
                                name: m.name ? m.name.replace(/\s*kiri\s*atas\s*/gi, '').trim() : m.name
                            }));
                        }
                    } catch(e) {}
                }

            });
            const [showMasks, setShowMasks] = useState(() => {
                const saved = localStorage.getItem('mbm_show_masks');
                return saved !== null ? saved === 'true' : true;
            });

            const addMask = (type, explicitMode = null) => {
                let newMask = null;
                const newId = Date.now();
                if (type === 'lowerthird') {
                    newMask = { id: newId, name: "Lower Third (Headline)", mode: "focus", x: 2, y: 64, width: 48, height: 26 };
                } else if (type === 'narasumber') {
                    newMask = { id: newId, name: "Nama Narasumber", mode: "focus", x: 2, y: 72, width: 38, height: 18 };
                } else if (type === 'focus_custom') {

                    newMask = { id: newId, name: `Kotak Fokus #${count}`, mode: "focus", x: 28, y: 60, width: 44, height: 24 };
                } else if (type === 'chyron') {
                    newMask = { id: newId, name: "Chyron Penutup", mode: "exclusion", x: 2, y: 56, width: 22, height: 40 };
                } else if (type === 'qrcode') {
                    newMask = { id: newId, name: "QR Code", mode: "exclusion", x: 84, y: 72, width: 14, height: 26 };
                } else if (type === 'logo') {
                    newMask = { id: newId, name: "Logo / Jam TV", mode: "exclusion", x: 2, y: 2, width: 32, height: 16 };
                } else if (type === 'promo') {
                    newMask = { id: newId, name: "Promo Program", mode: "exclusion", x: 68, y: 2, width: 30, height: 16 };
                } else {
                    const mode = explicitMode || (type === 'focus' ? 'focus' : 'exclusion');
                    const count = masks.filter(m => m.mode === mode).length + 1;
                    newMask = { 
                        id: newId, 
                        name: mode === 'focus' ? `Kotak Fokus #${count}` : `Penutup #${count}`, 
                        mode: mode, 
                        x: 35, 
                        y: 35, 
                        width: 28, 
                        height: 20 
                    };
                }

            // Fungsi Toggle Fullscreen / Zoom Video Player (Container Utama + Floating MBM)

                const handleKeyDown = (e) => {

                        if (showApiKeyModal) { e.preventDefault(); setShowApiKeyModal(false); return; }
                    }

                    // Abaikan shortcut jika salah satu modal sedang aktif
                    if (editingRow || showRatingModal || showApiKeyModal) return;

                    // Abaikan shortcut jika sedang mengetik di input, textarea, atau elemen yang bisa diedit
                    if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) {
                        return;
                    }

                    // Tombol Spasi (Spacebar) untuk Pause & Run (Play) Video saat Fullscreen Zoom
                    if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
                        if (isVideoZoomed || document.fullscreenElement) {
                            e.preventDefault();
                            if (videoRef.current) {
                                if (videoRef.current.paused) {
                                    videoRef.current.play().catch(() => {});
                                    setIsPlaying(true);

                                    videoRef.current.pause();
                                    setIsPlaying(false);
                                    notify("Video Dijeda ⏸");
                                }
                            }
                        }
                    }

                    // Tombol 'f' atau 'F' untuk toggle fullscreen
                    if (e.key === 'f' || e.key === 'F') {

                    if (e.key === 'Escape' && isVideoZoomed) {

                    const deltaX = curX - startX;
                    const deltaY = curY - startY;

                    let newW = initialW;
                    let newH = initialH;

                    if (direction.includes('left')) {
                        newW = Math.max(300, Math.min(window.innerWidth - 60, initialW - deltaX));
                    } else if (direction.includes('right')) {
                        newW = Math.max(300, Math.min(window.innerWidth - 60, initialW + deltaX));

                const s = Math.floor(secs % 60);
                if (h > 0) {

            // Interpolasi Spline Bezier Halus (Persis Grafik Penyiaran Nielsen Attachment 2)
            function getSmoothSvgPath(pts, yKey) {
                if (!pts || pts.length === 0) return "";
                if (pts.length === 1) return `M ${pts[0].x.toFixed(1)} ${pts[0][yKey].toFixed(1)}`;
                let d = `M ${pts[0].x.toFixed(1)} ${pts[0][yKey].toFixed(1)}`;
                for (let i = 0; i < pts.length - 1; i++) {
                    const p0 = pts[i === 0 ? 0 : i - 1];
                    const p1 = pts[i];
                    const p2 = pts[i + 1];
                    const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];
                    
                    const cp1x = p1.x + (p2.x - p0.x) / 6;
                    const cp1y = p1[yKey] + (p2[yKey] - p0[yKey]) / 6;
                    const cp2x = p2.x - (p3.x - p1.x) / 6;
                    const cp2y = p2[yKey] - (p3[yKey] - p1[yKey]) / 6;
                    
                    d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2[yKey].toFixed(1)}`;
                }
                return d;

                            canvas.height = Math.round((videoEl.videoHeight || 292) * scale);

                            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

                                        ctx.strokeStyle = "#ef4444";
                                        ctx.lineWidth = 2;
                                        ctx.strokeRect(mx, my, mw, mh);

            const writeStringHelper = (view, offset, string) => {

            const encodeWavBase64 = (samples, sampleRate = 12000) => {
                const buffer = new ArrayBuffer(44 + samples.length * 2);
                const view = new DataView(buffer);

                writeStringHelper(view, 0, 'RIFF');
                view.setUint32(4, 36 + samples.length * 2, true);
                writeStringHelper(view, 8, 'WAVE');

                writeStringHelper(view, 12, 'fmt ');
                view.setUint32(16, 16, true); // PCM
                view.setUint16(20, 1, true); // Mono
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true);
                view.setUint16(32, 2, true);
                view.setUint16(34, 16, true);

                writeStringHelper(view, 36, 'data');
                view.setUint32(40, samples.length * 2, true);

                let offset = 44;
                for (let i = 0; i < samples.length; i++, offset += 2) {
                    const s = Math.max(-1, Math.min(1, samples[i]));
                    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                }

                let binary = '';
                const bytes = new Uint8Array(buffer);
                const len = bytes.byteLength;
                const chunkSize = 8192;
                for (let i = 0; i < len; i += chunkSize) {

                    const decoded = await audioCtx.decodeAudioData(arrayBuffer);
                    cachedDecodedAudio = decoded;

            const extractSegmentWav = (audioBuffer, startSec, endSec, targetRate = 16000) => {

                    const srcRate = audioBuffer.sampleRate;
                    const startSample = Math.max(0, Math.floor(startSec * srcRate));
                    // Batasi durasi klip audio maksimal 30 detik per segmen agar dialog terdengar utuh & presisi
                    const clipDuration = Math.min(Math.max(0, endSec - startSec), 30);
                    const endSample = Math.min(audioBuffer.length, startSample + Math.floor(clipDuration * srcRate));
                    const numSamples = endSample - startSample;
                    if (numSamples <= 0) return null;

                    // Campur channel ke mono
                    const numChannels = audioBuffer.numberOfChannels;
                    const monoData = new Float32Array(numSamples);
                    for (let c = 0; c < numChannels; c++) {
                        const channelData = audioBuffer.getChannelData(c);
                        for (let i = 0; i < numSamples; i++) {
                            monoData[i] += channelData[startSample + i] / numChannels;
                        }
                    }

                    // Resample ke targetRate (16000Hz standar speech recognition AI Gemini/Whisper)
                    let finalSamples = monoData;
                    let finalRate = srcRate;
                    if (srcRate !== targetRate) {
                        const ratio = srcRate / targetRate;
                        const newLength = Math.round(numSamples / ratio);
                        finalSamples = new Float32Array(newLength);
                        for (let i = 0; i < newLength; i++) {
                            const srcIdx = Math.floor(i * ratio);
                            finalSamples[i] = monoData[srcIdx] || 0;
                        }
                        finalRate = targetRate;
                    }

                    return encodeWavBase64(finalSamples, finalRate);

                    await new Promise(r => setTimeout(r, 120));

                    const presetIdx = Math.min(Math.floor((i / segments.length) * demoDialogPresets.length), demoDialogPresets.length - 1);
                    const preset = demoDialogPresets[presetIdx];
                    const fullDesc = preset.headline ? `${preset.visual}\n${preset.headline}\n${preset.dialog}` : `${preset.visual}\n${preset.dialog}`;

                    generatedLogs.push({
                        id: Date.now() + i,
                        rentangWaktu: seg.timeCode,
                        pacing: preset.pacing || "Sedang",
                        emosi: preset.emosi || "Netral",
                        deskripsi: fullDesc
                    });

                    setProgress(Math.round(((i + 1) / segments.length) * 100));
                }

                setMbmRows(generatedLogs);
                setSynopsis(generatedSynopsis);
                notify(`Log MBM berhasil dibuat sesuai video "${baseName}"!`);
            };

            const updateRow = (id, field, value) => {
                setMbmRows(prev => prev.map(row => row.id === id ? { ...row, [field]: value } : row));
            };

            const addManualRow = () => {
                setHistoryStack(prev => [...prev, { rows: [...mbmRows], synopsis }]);
                const lastRow = mbmRows[mbmRows.length - 1];
                let newStart = 0;
                if (lastRow) {
                    const parts = lastRow.rentangWaktu.split('-');
                    if (parts.length > 1) newStart = parseTimeToSeconds(parts[1]);
                }
                const newEnd = newStart + (intervalMinutes * 60);
                const newRow = {
                    id: Date.now(),
                    rentangWaktu: `${formatTime(newStart)} - ${formatTime(newEnd)}`,
                    deskripsi: "Deskripsi adegan baru..."
                };
                setMbmRows([...mbmRows, newRow]);
                notify("Baris adegan MBM baru ditambahkan");
            };

            const deleteRow = (id) => {
                setHistoryStack(prev => [...prev, { rows: [...mbmRows], synopsis }]);
                setMbmRows(prev => prev.filter(row => row.id !== id));
                notify("Baris dihapus");
            };

            const copyAllToClipboard = () => {
                let text = "RENTANG WAKTU\tDESKRIPSI ADEGAN\n";
                text += mbmRows.map(r => `${r.rentangWaktu}\t${r.deskripsi}`).join("\n");
                text += `\n\nSINOPSIS / RINGKASAN:\n${synopsis}`;
                navigator.clipboard.writeText(text);
                notify("Seluruh tabel MBM disalin ke clipboard!");
            };

            const filteredRows = mbmRows.filter(r => 
                r.rentangWaktu.toLowerCase().includes(searchTerm.toLowerCase()) ||
                r.deskripsi.toLowerCase().includes(searchTerm.toLowerCase())

            // Pilihan Interval: 1 Menit, 5 Menit, 10 Menit, 30 Menit, 1 Jam
            const intervalOptions = [
                { label: "1m", value: 1, desc: "1 Menit" },
                { label: "5m", value: 5, desc: "5 Menit" },
                { label: "10m", value: 10, desc: "10 Menit" },
                { label: "30m", value: 30, desc: "30 Menit" },
                { label: "1 Jam", value: 60, desc: "1 Jam" }
            ];

            const isAnyBoxMoved = (boxPositions.preview?.x !== 0 || boxPositions.preview?.y !== 0) ||
                                  (boxPositions.tools?.x !== 0 || boxPositions.tools?.y !== 0) ||
                                  (boxPositions.mbm?.x !== 0 || boxPositions.mbm?.y !== 0) ||
                                  (boxPositions.floatingMbm?.x !== 0 || boxPositions.floatingMbm?.y !== 0);

                    >
                        <div

                        >
                            <div className="flex items-center justify-between border-b border-slate-100 pb-3">

                                        #{editingRow.index}
                                    </span>
                                    <h3 className="font-black text-base text-slate-900">Menu Edit Segmen MBM</h3>
                                </div>
                                <button 
                                    type="button"
                                    onClick={() => setEditingRow(null)}
                                    className="text-slate-400 hover:text-slate-700 p-1 text-sm rounded-lg hover:bg-slate-100 transition-colors"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>

                            <div className="space-y-3">
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            Rentang Waktu (Timecode)
                                        </label>
                                        <input 
                                            type="text"
                                            value={editingRow.rentangWaktu}
                                            onChange={(e) => setEditingRow({ ...editingRow, rentangWaktu: e.target.value })}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-mono font-bold text-slate-800 outline-none focus:bg-white focus:border-slate-400"
                                            placeholder="00:00 - 01:00"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            Unit / Segmen
                                        </label>
                                        <input 
                                            type="text"
                                            value={editingRow.unit || ""}
                                            onChange={(e) => setEditingRow({ ...editingRow, unit: e.target.value })}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-800 outline-none focus:bg-white focus:border-slate-400"
                                            placeholder="Segmen 1 / Break Iklan"
                                        />
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            TVR (Rating Point)
                                        </label>
                                        <input 
                                            type="number"
                                            step="0.1"
                                            value={editingRow.tvr !== undefined && editingRow.tvr !== null ? editingRow.tvr : ""}
                                            onChange={(e) => setEditingRow({ ...editingRow, tvr: e.target.value })}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-mono font-black text-slate-900 outline-none focus:bg-white focus:border-slate-400"
                                            placeholder="2.8"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            Audience Share (%)
                                        </label>
                                        <input 
                                            type="number"
                                            step="0.1"
                                            value={editingRow.share !== undefined && editingRow.share !== null ? editingRow.share : ""}
                                            onChange={(e) => setEditingRow({ ...editingRow, share: e.target.value })}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-mono font-black text-slate-900 outline-none focus:bg-white focus:border-slate-400"
                                            placeholder="14.5"
                                        />
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            Pacing / Ritme Adegan
                                        </label>
                                        <select
                                            value={editingRow.pacing || "Sedang"}
                                            onChange={(e) => setEditingRow({ ...editingRow, pacing: e.target.value })}

                                        >
                                            <option value="Cepat">⚡ Cepat (Fast-Paced)</option>
                                            <option value="Sedang">⏱️ Sedang (Moderate)</option>
                                            <option value="Lambat">⏳ Lambat (Slow/Dragging)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            Emosi Dominan Konten
                                        </label>
                                        <select
                                            value={editingRow.emosi || "Konflik"}
                                            onChange={(e) => setEditingRow({ ...editingRow, emosi: e.target.value })}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 outline-none focus:bg-white focus:border-slate-400"
                                        >
                                            <option value="Konflik">😡 Konflik / Marah</option>
                                            <option value="Sedih">😢 Sedih / Melankolis</option>
                                            <option value="Happy">😊 Ceria / Romantis</option>
                                            <option value="Tegang">😱 Tegang / Suspense</option>
                                            <option value="Netral">ℹ️ Netral / Transisi</option>
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                        Deskripsi Adegan
                                    </label>
                                    <textarea 
                                        value={editingRow.deskripsi}
                                        onChange={(e) => setEditingRow({ ...editingRow, deskripsi: e.target.value })}

                                        className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800 outline-none focus:bg-white focus:border-slate-400 leading-relaxed resize-y"
                                        placeholder="Tuliskan deskripsi adegan..."
                                    />
                                </div>
                            </div>

                            <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                                <button 
                                    type="button"
                                    onClick={() => setEditingRow(null)}
                                    className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-all"
                                >
                                    Batal
                                </button>
                                <button 
                                    type="button"
                                    onClick={() => {
                                        setHistoryStack(prev => [...prev, { rows: [...mbmRows], synopsis }]);
                                        setMbmRows(prev => prev.map(row => {
                                            if (row.id === editingRow.id) {
                                                return {
                                                    ...row,
                                                    rentangWaktu: editingRow.rentangWaktu,
                                                    deskripsi: editingRow.deskripsi,
                                                    tvr: editingRow.tvr !== "" && editingRow.tvr !== null && editingRow.tvr !== undefined ? Number(editingRow.tvr) : null,
                                                    share: editingRow.share !== "" && editingRow.share !== null && editingRow.share !== undefined ? Number(editingRow.share) : null,
                                                    unit: editingRow.unit || null,
                                                    pacing: editingRow.pacing || null,
                                                    emosi: editingRow.emosi || null
                                                };
                                            }
                                            return row;
                                        }));
                                        setEditingRow(null);
                                        notify("Perubahan adegan & rating berhasil disimpan!");
                                    }}
                                    className="px-4 py-2 rounded-xl text-xs font-black bg-obsidian text-neon hover:bg-black transition-all shadow-sm active:scale-95 flex items-center gap-1.5"
                                >
                                    <span>Simpan Perubahan</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // [UNUSED_FIRST_COPY_START]
            const unusedFirstChart = (isOverlay = false) => {
                if (!showRatingChart || !mbmRows || mbmRows.length === 0) return null;

                const chartWidth = 1100;
                const chartHeight = isChartCompact ? 32 : 92;
                const padL = 36;
                const padR = 36;
                const padT = 16;
                const padB = 20;
                const plotW = chartWidth - padL - padR;
                const plotH = chartHeight - padT - padB;

                const maxTvrVal = Math.max(4.0, ...mbmRows.map(r => Number(r.tvr) || 0)) * 1.15;
                const maxShareVal = Math.max(15.0, ...mbmRows.map(r => Number(r.share) || 0)) * 1.15;

                const points = mbmRows.map((r, i) => {
                    const parts = (r.rentangWaktu || "").split('-');
                    const sStart = parts.length > 0 ? parseTimeToSeconds(parts[0]) : i * 60;
                    const sEnd = parts.length > 1 ? parseTimeToSeconds(parts[1]) : (sStart + 60);
                    const sMid = (sStart + sEnd) / 2;
                    const x = padL + (i / Math.max(1, mbmRows.length - 1)) * plotW;

                    const tvrNum = Number(r.tvr) || 0;
                    const shareNum = Number(r.share) || 0;
                    const yTvr = (padT + plotH) - (tvrNum / maxTvrVal) * plotH;
                    const yShare = (padT + plotH) - (shareNum / maxShareVal) * plotH;

                    const prevTvr = i > 0 ? (Number(mbmRows[i - 1].tvr) || 0) : null;
                    let delta = null;
                    let pct = null;
                    if (prevTvr !== null && prevTvr > 0) {
                        delta = tvrNum - prevTvr;
                        pct = (delta / prevTvr) * 100;
                    }

                    return { ...r, sStart, sEnd, sMid, x, yTvr, yShare, tvrNum, shareNum, delta, pct };
                });

                const activeIdx = points.findIndex(p => currentTime >= p.sStart && currentTime < p.sEnd);
                const activePoint = activeIdx !== -1 ? points[activeIdx] : points[0];

                let scrubberX = padL;
                if (activeIdx !== -1) {
                    const p = points[activeIdx];
                    const segDur = Math.max(1, p.sEnd - p.sStart);
                    const segProg = Math.max(0, Math.min(1, (currentTime - p.sStart) / segDur));
                    const nextX = activeIdx < points.length - 1 ? points[activeIdx + 1].x : (padL + plotW);
                    scrubberX = p.x + segProg * (nextX - p.x);
                } else if (points.length > 0) {
                    const totalDur = Math.max(videoDuration || 0, points[points.length - 1].sEnd || 480);
                    scrubberX = padL + Math.min(plotW, Math.max(0, (currentTime / totalDur) * plotW));
                }

                const tvrLinePath = getSmoothSvgPath(points, 'yTvr');
                const shareLinePath = getSmoothSvgPath(points, 'yShare');
                const tvrAreaPath = getSmoothAreaPath(points, 'yTvr', padT + plotH);
                const shareAreaPath = getSmoothAreaPath(points, 'yShare', padT + plotH);

                return (
                    <div 
                        className={
                            isOverlay
                                ? ("absolute left-2 sm:left-4 right-2 sm:right-4 z-30 pointer-events-auto transition-all duration-200 select-none " + (isVideoZoomed ? "bottom-14 sm:bottom-16" : "bottom-12 sm:bottom-14"))
                                : "w-full bg-slate-950 text-white rounded-3xl border border-slate-800 p-3 sm:p-4 shadow-xl transition-all duration-200 select-none mt-3"
                        }
                    >
                        <div className={
                            isOverlay
                                ? ("border border-white/15 bg-slate-950/75 sm:bg-slate-950/80 backdrop-blur-md opacity-85 hover:opacity-100 hover:bg-slate-950/95 hover:border-slate-700/80 rounded-2xl sm:rounded-3xl shadow-2xl text-white transition-all overflow-hidden group/chart " + (isChartCompact ? "px-2.5 py-1.5" : "p-2 sm:p-2.5"))
                                : ("rounded-2xl text-white overflow-hidden " + (isChartCompact ? "p-1" : "space-y-2"))
                        }>
                            {/* Header Bar Ringkas */}
                            <div className={"flex items-center justify-between gap-2 transition-all " + (isChartCompact ? "" : "pb-1.5 mb-1 border-b border-white/10")}>
                                <div className="flex items-center gap-1.5 sm:gap-2 flex-shrink-0 flex-wrap">
                                    <button 
                                        type="button"
                                        onClick={() => setShowChartTvr(!showChartTvr)}
                                        className={"flex items-center gap-1.5 text-[11px] font-bold px-2 py-0.5 rounded-lg transition-all " + (showChartTvr ? "bg-neon/15 text-neon border border-neon/40 shadow-sm" : "opacity-40 text-slate-400 border border-transparent")}
                                        title="Klik untuk tampilkan/sembunyikan data TVR (Rating Poin)"
                                    >
                                        <span className="w-2.5 h-2.5 rounded-full bg-neon border border-black shadow-[0_0_6px_#ccff00]"></span>
                                        <span>TVR (Rating)</span>
                                    </button>

                                    <button 
                                        type="button"
                                        onClick={() => setShowChartShare(!showChartShare)}

                                        title="Klik untuk tampilkan/sembunyikan data Share (%)"
                                    >
                                        <span className="w-2.5 h-2.5 rounded-full bg-sky-400 border border-black shadow-[0_0_6px_#38bdf8]"></span>
                                        <span>Share (%)</span>
                                    </button>

                                        <button 
                                            type="button"
                                            onClick={() => setShowChartDelta(!showChartDelta)}
                                            className={"flex items-center gap-1 text-[10px] font-bold px-1.5 py-0.5 rounded-lg transition-all " + (showChartDelta ? "bg-emerald-500/15 text-emerald-300 border border-emerald-400/30" : "opacity-40 text-slate-400 border border-transparent")}
                                            title="Tampilkan / sembunyikan badge perbandingan delta naik-turun"
                                        >
                                            <i className="fa-solid fa-arrow-up-right-dots text-[9px]"></i>
                                            <span className="hidden sm:inline">Delta (+/-)</span>
                                        </button>
                                    )}

                                    <button 
                                        type="button"
                                        onClick={() => setShowRatingModal(true)}
                                        className="text-[10px] font-bold text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/15 px-2 py-0.5 rounded-lg transition-all flex items-center gap-1"
                                        title="Impor / Tempel Data Rating Baru"
                                    >
                                        <i className="fa-solid fa-file-import text-[9px] text-neon"></i>
                                        <span className="hidden sm:inline">{t("pasteRating")}</span>
                                    </button>

                                    <button 
                                        type="button"
                                        onClick={() => setShowAnalyticsDrawer(!showAnalyticsDrawer)}
                                        className={"text-[10px] font-bold px-2 py-0.5 rounded-lg transition-all flex items-center gap-1.5 " + (showAnalyticsDrawer ? "bg-neon text-obsidian font-black shadow-[0_0_12px_rgba(204,255,0,0.4)] ring-1 ring-neon-dark" : "text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/15")}
                                        title="Buka / Tutup Panel Analisis Statistik, Bentuk Kurva & Emosi Konten"

                                        <span className="hidden sm:inline">Analisis Statistik</span>
                                    </button>
                                </div>

                                {/* Area Tengah: Ketika grafik dilipat (Compact Mode) */}
                                {isChartCompact && (
                                    <div className="flex-1 flex items-center justify-center gap-2 sm:gap-3 px-2 min-w-0 overflow-x-auto no-scrollbar py-0.5">
                                        <div className="flex-shrink-0 flex items-center gap-1.5 px-2.5 py-0.5 rounded-lg bg-white/10 border border-white/20 text-[11px] font-bold text-white shadow-inner">
                                            <span className="w-2 h-2 rounded-full bg-neon animate-pulse shadow-[0_0_8px_#ccff00]"></span>
                                            <span className="text-white/60 text-[10px]">{t("activeMinute")} ({formatTime(currentTime)}):</span>
                                            {showChartTvr && (
                                                <span className="text-neon font-black font-mono">
                                                    TVR {activePoint?.tvrNum !== undefined ? activePoint.tvrNum.toFixed(1) : '-'}

                                            {showChartShare && (
                                                <span className="text-sky-300 font-black font-mono">
                                                    Share {activePoint?.shareNum !== undefined ? activePoint.shareNum + '%' : '-'}
                                                </span>

                                            {activePoint?.unit && (

                                                    {activePoint.unit}

                                        <div className="flex items-center gap-1 sm:gap-1.5 flex-nowrap overflow-x-auto no-scrollbar py-0.5">
                                            {points.map((p, idx) => {
                                                const isActive = activeIdx === idx;
                                                return (
                                                    <button
                                                        key={p.id || idx}
                                                        type="button"
                                                        onClick={() => {
                                                            seekVideo(p.sStart);
                                                        }}
                                                        className={"flex-shrink-0 flex items-center gap-1 px-1.5 py-0.5 rounded-md text-[10px] font-mono transition-all " + (
                                                            isActive 
                                                                ? "bg-neon/20 border border-neon text-white font-black shadow-[0_0_10px_rgba(204,255,0,0.35)] scale-105" 
                                                                : "bg-white/5 hover:bg-white/15 border border-white/10 text-slate-300 hover:text-white"
                                                        )}
                                                        title={`Lompat ke ${p.rentangWaktu || ('Menit ' + (idx + 1))}\nTVR: ${p.tvrNum.toFixed(1)}\nShare: ${p.shareNum}%\nDeskripsi: ${p.deskripsi || '-'}`}

                                                        <span className="text-white/40 text-[9px] font-sans">M{idx + 1}</span>
                                                        {showChartTvr && (
                                                            <span className={isActive ? "text-neon font-black" : "text-neon/90 font-bold"}>
                                                                {p.tvrNum.toFixed(1)}

                                                        {showChartTvr && showChartShare && <span className="text-white/20">/</span>}
                                                        {showChartShare && (
                                                            <span className={isActive ? "text-sky-300 font-black" : "text-sky-400 font-bold"}>
                                                                {p.shareNum}%

                                                    </button>

                                        </div>

                                                    <span>TVR: Avg {ratingStats.avgTvr}</span>

                                                    <span>Peak {ratingStats.peakTvr}</span>

                                            )}

                                                <div className="bg-sky-500/15 border border-sky-400/40 text-sky-300 text-[10px] font-black px-2.5 py-0.5 rounded-full shadow-sm flex items-center gap-1.5">

                                        onClick={() => setIsChartCompact(!isChartCompact)}
                                        className="w-5 h-5 rounded-md bg-white/10 hover:bg-white/20 text-slate-300 hover:text-white flex items-center justify-center text-[10px] transition-all border border-white/10"
                                        title={isChartCompact ? "Buka / perbesar grafik kurva" : "Lipat grafik (tampilkan strip angka performa)"}
                                    >
                                        <i className={"fa-solid " + (isChartCompact ? "fa-up-right-and-down-left-from-center" : "fa-down-left-and-up-right-to-center") + " text-[8px]"}></i>
                                    </button>

                                    <button 
                                        type="button"
                                        onClick={() => setShowRatingChart(false)}
                                        className="w-5 h-5 rounded-md bg-white/10 hover:bg-red-600 text-slate-300 hover:text-white flex items-center justify-center text-[10px] transition-all border border-white/10"
                                        title="Tutup grafik rating"
                                    >
                                        <i className="fa-solid fa-xmark text-[10px]"></i>
                                    </button>
                                </div>
                            </div>

                            {/* Drawer Analisis Statistik */}
                            {showAnalyticsDrawer && statisticalAnalytics && (
                                <div className="mb-2 p-2.5 sm:p-3 rounded-2xl bg-slate-900/95 border border-white/15 backdrop-blur-xl shadow-2xl animate-in fade-in slide-in-from-top-2 duration-200">
                                    <div className="flex items-center justify-between pb-2 mb-2.5 border-b border-white/10">
                                        <div className="flex items-center gap-2">
                                            <span className="flex items-center justify-center w-6 h-6 rounded-lg bg-neon/15 text-neon border border-neon/30 text-xs">
                                                <i className="fa-solid fa-chart-line"></i>
                                            </span>
                                            <div>
                                                <h4 className="text-xs font-black text-white tracking-wide flex items-center gap-2">
                                                    Analisis Statistik & Tipologi Bentuk Kurva Penyiaran
                                                    <span className="text-[10px] font-normal px-2 py-0.5 rounded-full bg-neon/15 text-neon border border-neon/30 font-mono">
                                                        N = {statisticalAnalytics.N} Menit
                                                    </span>
                                                </h4>
                                                <p className="text-[10px] text-slate-400">Hubungan regresi linear, volatilitas audiens, dinamika emosi cerita, dan retensi jeda komersial.</p>
                                            </div>
                                        </div>
                                        <button
                                            type="button"
                                            onClick={() => setShowAnalyticsDrawer(false)}
                                            className="w-5 h-5 rounded-md bg-white/5 hover:bg-white/15 text-slate-400 hover:text-white flex items-center justify-center text-xs"
                                            title="Tutup panel analisis"
                                        >
                                            <i className="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                                        {/* Card 1: Tipologi Bentuk Kurva & Regresi */}
                                        <div className="p-2.5 rounded-xl bg-white/5 border border-white/10 flex flex-col justify-between">
                                            <div>
                                                <div className="flex items-center justify-between mb-1.5">
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Tipologi Kurva</span>
                                                    <span className={"text-[9px] font-black px-2 py-0.5 rounded-full border " + (statisticalAnalytics.slopeBeta >= 0.035 ? "bg-neon/20 text-neon border-neon/40" : statisticalAnalytics.slopeBeta <= -0.035 ? "bg-rose-500/20 text-rose-300 border-rose-400/40" : "bg-sky-500/20 text-sky-300 border-sky-400/40")}>
                                                        {statisticalAnalytics.curveTypology.badge}
                                                    </span>
                                                </div>
                                                <div className="flex items-center gap-2 mb-1">
                                                    <i className={"fa-solid " + statisticalAnalytics.curveTypology.icon + " text-base " + statisticalAnalytics.curveTypology.color}></i>
                                                    <span className="text-xs font-black text-white">{statisticalAnalytics.curveTypology.name}</span>
                                                </div>
                                                <p className="text-[10px] text-slate-300 leading-relaxed mb-2">
                                                    {statisticalAnalytics.curveTypology.desc}
                                                </p>
                                            </div>
                                            <div className="pt-2 border-t border-white/10 grid grid-cols-3 gap-1 text-center font-mono">
                                                <div className="bg-black/30 p-1 rounded border border-white/5">
                                                    <div className="text-[9px] text-slate-400 font-sans">Slope (β)</div>
                                                    <div className={"text-[11px] font-black " + (statisticalAnalytics.slopeBeta >= 0 ? "text-neon" : "text-rose-400")}>
                                                        {statisticalAnalytics.slopeBeta > 0 ? "+" : ""}{statisticalAnalytics.slopeBeta}
                                                    </div>
                                                </div>
                                                <div className="bg-black/30 p-1 rounded border border-white/5">
                                                    <div className="text-[9px] text-slate-400 font-sans">Korelasi (r)</div>
                                                    <div className="text-[11px] font-black text-sky-300">{statisticalAnalytics.pearsonR}</div>
                                                </div>
                                                <div className="bg-black/30 p-1 rounded border border-white/5">
                                                    <div className="text-[9px] text-slate-400 font-sans">Volatilitas (σ)</div>
                                                    <div className="text-[11px] font-black text-amber-300">±{statisticalAnalytics.stdDev}</div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Card 2: Korelasi Emosi Cerita vs Performa Rating */}
                                        <div className="p-2.5 rounded-xl bg-white/5 border border-white/10 flex flex-col justify-between">
                                            <div>
                                                <div className="flex items-center justify-between mb-1.5">
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Korelasi Emosi vs Rating</span>
                                                    {statisticalAnalytics.topEmotion && (
                                                        <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                                                            Peak: {statisticalAnalytics.topEmotion.icon} {statisticalAnalytics.topEmotion.key}
                                                        </span>
                                                    )}
                                                </div>
                                                <div className="space-y-1 mb-2">
                                                    {statisticalAnalytics.emotionStats.map(em => (
                                                        <div key={em.key} className="flex items-center justify-between text-[10px] px-1.5 py-0.5 rounded bg-black/20 hover:bg-black/40 transition-colors">
                                                            <div className="flex items-center gap-1.5">
                                                                <span className="text-xs">{em.icon}</span>
                                                                <span className="text-slate-300 font-medium">{em.key}</span>
                                                                <span className="text-white/40 text-[9px]">({em.count}m • {em.pctOfTotal}%)</span>
                                                            </div>
                                                            <div className="flex items-center gap-1.5 font-mono">
                                                                <span className="text-[9px] text-slate-400">Avg TVR:</span>
                                                                <span className="font-bold text-neon">{em.avgTvr}</span>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="text-[9px] text-slate-400 pt-1.5 border-t border-white/10 flex items-center justify-between">
                                                <span>Target Hook: Konflik & Tegang</span>
                                                <span className="text-slate-300 font-mono">Mean: {statisticalAnalytics.meanTvr} TVR</span>
                                            </div>
                                        </div>

                                        {/* Card 3: Dinamika Pacing & Retensi Jeda Iklan */}
                                        <div className="p-2.5 rounded-xl bg-white/5 border border-white/10 flex flex-col justify-between">
                                            <div>
                                                <div className="flex items-center justify-between mb-1.5">
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Pacing & Retensi Iklan</span>
                                                    <span className={"text-[9px] font-black px-2 py-0.5 rounded-full border " + (statisticalAnalytics.bounceBackPct >= 70 ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/30" : "bg-amber-500/20 text-amber-300 border-amber-500/30")}>
                                                        Retensi {statisticalAnalytics.bounceBackPct}%
                                                    </span>
                                                </div>
                                                <div className="grid grid-cols-2 gap-1.5 mb-2">
                                                    <div className="p-1.5 rounded bg-black/30 border border-white/5">
                                                        <div className="text-[9px] text-slate-400">TVR Rata-rata Program</div>
                                                        <div className="text-xs font-black text-neon font-mono">{statisticalAnalytics.avgProgTvr}</div>
                                                    </div>
                                                    <div className="p-1.5 rounded bg-black/30 border border-white/5">
                                                        <div className="text-[9px] text-slate-400">TVR Rata-rata Iklan</div>
                                                        <div className="text-xs font-black text-sky-300 font-mono">{statisticalAnalytics.avgAdTvr}</div>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-1.5 mb-2">
                                                    {statisticalAnalytics.pacingStats.map(pc => (
                                                        <div key={pc.key} className="flex-1 p-1 rounded bg-black/20 text-center border border-white/5">
                                                            <div className="text-[9px] text-slate-400">{pc.icon} {pc.key}</div>
                                                            <div className="text-[10px] font-bold text-white font-mono">{pc.count}m <span className="text-white/40 text-[8px]">({pc.pctOfTotal}%)</span></div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            {statisticalAnalytics.draggingRisks && statisticalAnalytics.draggingRisks.length > 0 ? (
                                                <div className="p-1.5 rounded bg-rose-500/15 border border-rose-500/30 text-[9px] text-rose-200 flex items-center gap-1.5">
                                                    <i className="fa-solid fa-triangle-exclamation text-rose-400"></i>
                                                    <span>Terdeteksi {statisticalAnalytics.draggingRisks.length} segmen lambat yang menurunkan TVR tajam (&gt; -0.3). Evaluasi durasi.</span>
                                                </div>
                                            ) : (
                                                <div className="p-1.5 rounded bg-emerald-500/10 border border-emerald-500/20 text-[9px] text-emerald-300 flex items-center gap-1.5">
                                                    <i className="fa-solid fa-circle-check text-emerald-400"></i>
                                                    <span>Ritme penayangan (pacing) sehat, tidak ada pelepasan audiens abnormal.</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Chart Canvas Area (Tinggi 1/2 Lebih Pendek, Ultra Wide) */}
                            {!isChartCompact && (
                                <div className="relative">
                                    <svg 
                                        viewBox={"0 0 " + chartWidth + " " + chartHeight}
                                        className="w-full h-auto cursor-crosshair overflow-visible"
                                        onClick={(e) => {
                                            const rect = e.currentTarget.getBoundingClientRect();
                                            const clickX = e.clientX - rect.left;
                                            const scaleX = chartWidth / rect.width;
                                            const svgX = clickX * scaleX;
                                            const normX = Math.max(0, Math.min(1, (svgX - padL) / plotW));
                                            const targetIdx = Math.round(normX * (points.length - 1));
                                            const targetTime = points[targetIdx]?.sStart || 0;
                                            if (videoRef && videoRef.current) {
                                                videoRef.current.currentTime = targetTime;
                                                setCurrentTime(targetTime);
                                                notify("Melompat ke menit " + formatTime(targetTime));
                                            }
                                        }}
                                    >
                                        <defs>
                                            <linearGradient id="transLimeArea" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="0%" stopColor="#ccff00" stopOpacity="0.38" />
                                                <stop offset="100%" stopColor="#ccff00" stopOpacity="0.03" />
                                            </linearGradient>
                                            <linearGradient id="transDarkArea" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.28" />
                                                <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.02" />
                                            </linearGradient>
                                            <filter id="neonGlowWide" x="-20%" y="-20%" width="140%" height="140%">
                                                <feDropShadow dx="0" dy="0" stdDeviation="2" floodColor="#ccff00" floodOpacity="0.5" />
                                            </filter>
                                        </defs>

                                        {/* Grid Horizontal & Ticks Sumbu Y */}
                                        {[0, 0.5, 1].map((pct, idx) => {
                                            const y = padT + plotH * pct;
                                            const tvrVal = ((1 - pct) * maxTvrVal).toFixed(1);
                                            const shareVal = Math.round((1 - pct) * maxShareVal);
                                            return (
                                                <g key={idx}>
                                                    <line x1={padL} y1={y} x2={padL + plotW} y2={y} stroke="rgba(255,255,255,0.08)" strokeDasharray="3,3" />
                                                    <text x={padL - 5} y={y + 2.5} fill="#94a3b8" fontSize="7.5" fontFamily="monospace" fontWeight="bold" textAnchor="end">{tvrVal}</text>
                                                    {showChartShare && (
                                                        <text x={padL + plotW + 5} y={y + 2.5} fill="#38bdf8" fontSize="7.5" fontFamily="monospace" fontWeight="bold" textAnchor="start">{shareVal}%</text>
                                                    )}
                                                </g>
                                            );
                                        })}

                                        {/* Area Fill Di Bawah Kurva */}
                                        {showChartShare && shareAreaPath && (
                                            <path d={shareAreaPath} fill="url(#transDarkArea)" />
                                        )}
                                        {showChartTvr && tvrAreaPath && (
