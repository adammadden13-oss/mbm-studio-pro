        const IDB_NAME = "MBMStudioPro_MediaDB_v1";
        const IDB_STORE = "active_media";

        const openVideoDB = () => {
            return new Promise((resolve) => {
                if (!window.indexedDB) {
                    console.warn("IndexedDB tidak didukung pada browser ini.");
                    return resolve(null);
                }
                const req = indexedDB.open(IDB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) {
                        db.createObjectStore(IDB_STORE);
                    }
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = () => resolve(null);
            });
        };

        const storeVideoInIDB = async (file) => {
            try {
                const db = await openVideoDB();
                if (!db) return false;
                return new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE, "readwrite");
                    const store = tx.objectStore(IDB_STORE);
                    store.put(file, "current_video_file");
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) {
                console.warn("Gagal menyimpan video ke IndexedDB:", e);
                return false;
            }
        };

        const loadVideoFromIDB = async () => {
            try {
                const db = await openVideoDB();
                if (!db) return null;
                return new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE, "readonly");
                    const store = tx.objectStore(IDB_STORE);
                    const getReq = store.get("current_video_file");
                    getReq.onsuccess = () => resolve(getReq.result || null);
                    getReq.onerror = () => resolve(null);
                });
            } catch (e) {
                console.warn("Gagal memuat video dari IndexedDB:", e);
                return null;
            }
        };

        const removeVideoFromIDB = async () => {
            try {
                const db = await openVideoDB();
                if (!db) return false;
                return new Promise((resolve) => {
                    const tx = db.transaction(IDB_STORE, "readwrite");
                    const store = tx.objectStore(IDB_STORE);
                    store.delete("current_video_file");
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                });
            } catch (e) {
                console.warn("Gagal menghapus video dari IndexedDB:", e);

            // Parser Cepat untuk Tempel Data Rating Nielsen (Fitur C)
            const parseAndApplyRatingData = (text) => {
                if (!text || !text.trim()) {
                    notify("Harap tempelkan data teks rating terlebih dahulu.");
                    return;
                }

                const lines = text.trim().split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                if (lines.length === 0) return;

                let appliedCount = 0;
                const newRows = [...mbmRows];

                lines.forEach((line, lineIdx) => {
                    let tokens = line.split('\t').map(t => t.trim()).filter(Boolean);
                    if (tokens.length <= 1) {
                        tokens = line.split(/,\s*/).map(t => t.trim()).filter(Boolean);
                    }
                    if (tokens.length <= 1) {
                        tokens = line.split(/\s{2,}/).map(t => t.trim()).filter(Boolean);
                    }

                    let timeVal = null;
                    let tvrVal = null;
                    let shareVal = null;
                    let unitVal = null;

                    tokens.forEach(tok => {
                        if (/^\d{1,2}:\d{2}/.test(tok) || (tok.includes('-') && /\d/.test(tok))) {
                            timeVal = tok;
                        } else if (!isNaN(Number(tok.replace('%', '')))) {
                            const num = Number(tok.replace('%', ''));
                            if (tvrVal === null) {
                                tvrVal = num;
                            } else if (shareVal === null) {
                                shareVal = num;
                            }
                        } else {
                            unitVal = tok;
                        }
                    });

                    if (lineIdx < newRows.length) {
                        newRows[lineIdx] = {
                            ...newRows[lineIdx],
                            ...(timeVal ? { rentangWaktu: timeVal } : {}),
                            ...(tvrVal !== null ? { tvr: tvrVal } : {}),
                            ...(shareVal !== null ? { share: shareVal } : {}),
                            ...(unitVal ? { unit: unitVal } : {})
                        };
                        appliedCount++;
                    } else {
                        const lastStart = lineIdx * (intervalMinutes * 60);
                        const lastEnd = (lineIdx + 1) * (intervalMinutes * 60);
                        newRows.push({
                            id: Date.now() + lineIdx,
                            rentangWaktu: timeVal || `${formatTime(lastStart)} - ${formatTime(lastEnd)}`,
                            deskripsi: `Segmen tayangan menit ke-${lineIdx + 1}`,
                            tvr: tvrVal !== null ? tvrVal : 2.5,
                            share: shareVal !== null ? shareVal : 13.0,
                            unit: unitVal || "Segmen"
                        });
                        appliedCount++;
                    }
                });

                setMbmRows(newRows);
                localStorage.setItem('mbm_rows_v3', JSON.stringify(newRows));
                setShowRatingChart(true);

            function parseTimeToSeconds(str) {
                if (!str) return 0;
                const parts = str.trim().split(':').map(Number);
                if (parts.length === 2) return parts[0] * 60 + parts[1];
                if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
                return 0;
            }

            function formatTime(secs) {
                if (isNaN(secs) || secs === null) return "00:00";
                const h = Math.floor(secs / 3600);
                const m = Math.floor((secs % 3600) / 60);
                const s = Math.floor(secs % 60);
                if (h > 0) {
                    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                }
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }

            // Interpolasi Spline Bezier Halus (Persis Grafik Penyiaran Nielsen Attachment 2)
            function getSmoothSvgPath(pts, yKey) {
                if (!pts || pts.length === 0) return "";
                if (pts.length === 1) return `M ${pts[0].x.toFixed(1)} ${pts[0][yKey].toFixed(1)}`;
                let d = `M ${pts[0].x.toFixed(1)} ${pts[0][yKey].toFixed(1)}`;
                for (let i = 0; i < pts.length - 1; i++) {
                    const p0 = pts[i === 0 ? 0 : i - 1];
                    const p1 = pts[i];
                    const p2 = pts[i + 1];
                    const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];
                    
                    const cp1x = p1.x + (p2.x - p0.x) / 6;
                    const cp1y = p1[yKey] + (p2[yKey] - p0[yKey]) / 6;
                    const cp2x = p2.x - (p3.x - p1.x) / 6;
                    const cp2y = p2[yKey] - (p3[yKey] - p1[yKey]) / 6;
                    
                    d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2[yKey].toFixed(1)}`;
                }
                return d;

            const captureFrameAt = (videoEl, targetTime) => {

            const writeStringHelper = (view, offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            // Encode Float32Array PCM samples ke 16-bit Mono WAV Base64
            const encodeWavBase64 = (samples, sampleRate = 12000) => {
                const buffer = new ArrayBuffer(44 + samples.length * 2);
                const view = new DataView(buffer);

                writeStringHelper(view, 0, 'RIFF');
                view.setUint32(4, 36 + samples.length * 2, true);
                writeStringHelper(view, 8, 'WAVE');

                writeStringHelper(view, 12, 'fmt ');
                view.setUint32(16, 16, true); // PCM
                view.setUint16(20, 1, true); // Mono
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true);
                view.setUint16(32, 2, true);
                view.setUint16(34, 16, true);

                writeStringHelper(view, 36, 'data');
                view.setUint32(40, samples.length * 2, true);

                let offset = 44;
                for (let i = 0; i < samples.length; i++, offset += 2) {
                    const s = Math.max(-1, Math.min(1, samples[i]));
                    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                }

                let binary = '';
                const bytes = new Uint8Array(buffer);
                const len = bytes.byteLength;
                const chunkSize = 8192;
                for (let i = 0; i < len; i += chunkSize) {
                    binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunkSize, len)));
                }
                return btoa(binary);

            // Ekstrak segmen audio tertentu dan ubah ke WAV base64 (12kHz Mono efisien untuk Gemini)
            const extractSegmentWav = (audioBuffer, startSec, endSec, targetRate = 12000) => {
                if (!audioBuffer) return null;
                try {
                    const srcRate = audioBuffer.sampleRate;
                    const startSample = Math.max(0, Math.floor(startSec * srcRate));
                    // Batasi durasi klip audio maksimal 25 detik per segmen agar cepat & hemat payload
                    const clipDuration = Math.min(Math.max(0, endSec - startSec), 25);
                    const endSample = Math.min(audioBuffer.length, startSample + Math.floor(clipDuration * srcRate));
                    const numSamples = endSample - startSample;
                    if (numSamples <= 0) return null;

                    // Campur channel ke mono
                    const numChannels = audioBuffer.numberOfChannels;
                    const monoData = new Float32Array(numSamples);
                    for (let c = 0; c < numChannels; c++) {
                        const channelData = audioBuffer.getChannelData(c);
                        for (let i = 0; i < numSamples; i++) {
                            monoData[i] += channelData[startSample + i] / numChannels;
                        }
                    }

                    // Resample ke targetRate (12000Hz standar speech-to-text ringan)
                    let finalSamples = monoData;
                    let finalRate = srcRate;
                    if (srcRate !== targetRate) {
                        const ratio = srcRate / targetRate;
                        const newLength = Math.round(numSamples / ratio);
                        finalSamples = new Float32Array(newLength);
                        for (let i = 0; i < newLength; i++) {
                            const srcIdx = Math.floor(i * ratio);
                            finalSamples[i] = monoData[srcIdx] || 0;
                        }
                        finalRate = targetRate;
                    }

                    return encodeWavBase64(finalSamples, finalRate);
                } catch (err) {
                    console.error("Gagal ekstrak WAV segmen:", err);

                        const safeParseGeminiJson = (rawText) => {

                            clean = clean.replace(/```(?:json)?/gi, '').replace(/```/g, '').trim();

                            // 2. Coba parse langsung
                            try {
                                const direct = JSON.parse(clean);

                            // 3. Cari batas kurung terluar { ... } atau [ ... ]
                            const firstBrace = clean.indexOf('{');
                            const firstBracket = clean.indexOf('[');
                            let start = -1;
                            let end = -1;

                            if (firstBrace !== -1 && (firstBracket === -1 || firstBrace < firstBracket)) {

                            } else if (firstBracket !== -1) {

                                        for (let i = 0; i < candidate.length; i++) {
                                            const char = candidate[i];
                                            if (char === '"' && !escaped) {
                                                inString = !inString;
                                                fixed += char;
                                            } else if (inString) {
                                                if (char === '\n') {
                                                    fixed += '\\n';
                                                } else if (char === '\r') {
                                                    fixed += '\\r';
                                                } else if (char === '\t') {
                                                    fixed += '\\t';
                                                } else {
                                                    fixed += char;
                                                }
                                            } else {
                                                fixed += char;
                                            }
                                            escaped = (char === '\\' && !escaped);
                                        }
                                        return JSON.parse(fixed);

                                        console.warn("Sanitized JSON parse failed:", e3);

                        // Helper pemanggil API Gemini dengan auto fallback multi-model & response_mime_type
                        const sendGeminiRequest = async (parts, asJson = true) => {

                            frames.forEach((f, idx) => {
                                turboParts.push({ text: `\n--- FRAME SEGMEN ${idx + 1}: Rentang Waktu [${f.timeCode}] ---` });
                                if (f.b64) {
                                    turboParts.push({
                                        inline_data: {
                                            mime_type: "image/jpeg",
                                            data: f.b64
                                        }
                                    });
                                }
                            });

                            turboParts.push({
                                text: `PETUNJUK FORMAT OUTPUT:
Untuk SETIAP segmen waktu [Rentang Waktu] di atas, buatlah catatan dengan format terpadu:
[Visual] Deskripsi visual adegan faktual (orang/tokoh yang tampil, posisi, busana/pakaian, ekspresi, aktivitas fisik, latar tempat).
[Dialog]
• Nama Pembicara / Tokoh: "Kutipan perkiraan dialog, topik percakapan atau suasana percakapan yang sesuai dengan adegan dan konteks siaran..."
(Jika adegan tampak hening, narasi, atau tanpa obrolan, tuliskan: [Dialog] (Tanpa dialog suara / fokus adegan visual))

Selain itu, buatlah satu teks "sinopsis" menyeluruh (2-3 paragraf padat) mengenai alur cerita keseluruhan, topik liputan, konflik/pembahasan, dan pesan tayangan.

KEMBALIKAN OUTPUT HANYA DALAM FORMAT JSON BERIKUT (VALID JSON, TANPA PENJELASAN LAIN):
{
  "sinopsis": "Teks sinopsis global lengkap 2-3 paragraf...",
  "rows": [
    {
      "rentangWaktu": "00:00 - 01:00",
      "deskripsi": "[Visual] ...\\n[Dialog]\\n• ..."
    }
  ]
}`
                            });

                            setProgress(60);
                            setCurrentProcessingSegment(`Gemini ${selectedModel} menganalisis seluruh siaran sekaligus (5–10 detik)...`);
                            const resp = await sendGeminiRequest(turboParts);
                            activeModel = resp.modelUsed;
                            setProgress(90);

                            // Parse JSON hasil Turbo dengan safeParseGeminiJson
                            const parsed = safeParseGeminiJson(resp.text);
                            let rowsArray = Array.isArray(parsed) ? parsed : (parsed?.rows || []);

                            // Fallback jika respons Gemini berbentuk format teks / list dan bukan array JSON murni
                            if (!Array.isArray(rowsArray) || rowsArray.length === 0) {
                                console.warn("JSON rows tidak terdeteksi langsung, menjalankan pemecah segmen teks cerdas...", resp.text);
                                const raw = resp.text || "";
                                rowsArray = segments.map((seg, sIdx) => {
                                    let desc = "";
                                    const tcClean = seg.timeCode.replace(/\s+/g, '\\s*').replace(/-/g, '\\-');
                                    const reg = new RegExp(`(?:${tcClean}|Segmen\\s*${sIdx + 1}|#\\s*${sIdx + 1})[\\s\\S]*?(?=(?:\\d{1,2}:\\d{2}\\s*-\\s*\\d{1,2}:\\d{2}|Segmen\\s*\\d+|#\\s*\\d+|$))`, 'i');
                                    const match = raw.match(reg);
                                    if (match && match[0] && match[0].trim().length > 15) {
                                        desc = match[0].replace(/```/g, '').replace(/---.*?---/g, '').trim();
                                    } else {
                                        desc = `[Visual] Aktivitas siaran pada segmen ${seg.timeCode}.\n[Dialog]\n• Voice-over / Tokoh: Percakapan siaran langsung.`;
                                    }
                                    return {
                                        rentangWaktu: seg.timeCode,
                                        deskripsi: desc
                                    };
                                });
                            }

                            // Sinopsis cerdas dari JSON atau paragraf pengantar
                            let synopsisText = parsed?.sinopsis || "";
                            if (!synopsisText || synopsisText.length < 20) {
                                const paras = (resp.text || "").split('\n\n').map(p => p.replace(/```(?:json)?/gi, '').replace(/```/g, '').trim()).filter(Boolean);
                                const foundPara = paras.find(p => p.length > 50 && !p.includes('00:00') && !p.startsWith('{') && !p.startsWith('['));
                                if (foundPara) {
                                    synopsisText = foundPara;
                                } else {
                                    synopsisText = `Sinopsis tayangan "${uploadedFileName}" (${segments.length} segmen @ ${intervalMinutes}m). Rekapitulasi visual adegan siaran dan kutipan dialog percakapan.`;
                                }
                            }

                            const newRows = rowsArray.map((r, idx) => ({
                                id: Date.now() + idx,
                                rentangWaktu: r.rentangWaktu || segments[idx]?.timeCode || `${idx}:00 - ${idx + 1}:00`,
                                deskripsi: r.deskripsi || (typeof r === 'string' ? r : "Aktivitas adegan siaran.")
                            }));

                            setMbmRows(newRows);
                            setSynopsis(synopsisText.trim());
                            notify(`⚡ Sukses Kilat! ${newRows.length} segmen MBM selesai dalam hitungan detik dengan ${activeModel}.`);

                        } else {
                            // =========================================================================
                            // JALUR 2: 🎙️ MODE AUDIO PARALEL (4 WORKER SERENTAK ~15-25 DETIK)
                            // Ekstraksi audio klip ringan & inferensi secara paralel
                            // =========================================================================
                            let audioBuffer = null;
                            if (includeAudioDialog) {
                                const targetFile = audioFile || videoFile;
                                if (targetFile) {
                                    setCurrentProcessingSegment(`Mendekode buffer audio dari ${targetFile.name}...`);
                                    setProgress(10);
                                    audioBuffer = await decodeAudioFromFile(targetFile);
                                    if (audioBuffer) {
                                        notify("Audio siap diproses dengan 4 Worker Paralel!");
                                    }
                                }
                            }

                            setCurrentProcessingSegment(`Menjalankan 4 Worker Paralel untuk ${segments.length} segmen...`);
                            setProgress(20);

                            const CONCURRENCY = 4;
                            const accumulatedRows = new Array(segments.length);
                            let completedCount = 0;

                            const processSegment = async (index) => {
                                const seg = segments[index];
                                let base64Image = null;
                                if (videoEl && videoUrl) {
                                    base64Image = await captureFrameAt(videoEl, (seg.start + seg.end) / 2);
                                }

                                let base64Audio = null;
                                if (audioBuffer && includeAudioDialog) {
                                    // 12kHz mono audio, maks 25 detik -> ringan & sangat cepat diunggah
                                    base64Audio = extractSegmentWav(audioBuffer, seg.start, seg.end, 12000);
                                }

                                const buildParts = (withAudio) => {
                                    const parts = [];
                                    parts.push({ text: `Rentang Waktu: ${seg.timeCode}. Judul video: "${uploadedFileName}".` });
                                    if (base64Image) {
                                        parts.push({
                                            inline_data: {
                                                mime_type: "image/jpeg",
                                                data: base64Image
                                            }
                                        });
                                    }
                                    if (withAudio && base64Audio) {
                                        parts.push({
                                            inline_data: {
                                                mime_type: "audio/wav",
                                                data: base64Audio
                                            }
                                        });
                                    }
                                    parts.push({
                                        text: `Anda adalah AI Broadcast Logger profesional stasiun MNC Channels / RCTI / Starpro.
Analisis tayangan pada segmen "${seg.timeCode}". Buat catatan log MBM:
[Visual] Deskripsi visual adegan faktual (tokoh, busana, ekspresi, aktivitas fisik, latar tempat). Abaikan area bertanda [DIABAIKAN].
[Dialog]
• Nama Pembicara / Tokoh: "Kutipan percakapan asli bahasa Indonesia yang didengar..."
(Jika pada segmen ini hening atau hanya musik/efek suara, tuliskan: [Dialog] (Hanya musik latar / tanpa dialog suara))

PANDUAN: Dengarkan klip audio yang disertakan untuk menangkap dialog asli dalam bahasa Indonesia.

KEMBALIKAN OUTPUT HANYA DALAM FORMAT JSON:
{
  "rentangWaktu": "${seg.timeCode}",
  "deskripsi": "[Visual] ...\\n[Dialog]\\n• ..."
}`
                                    });
                                    return parts;
                                };

                                let resultText = null;
                                try {
                                    const r = await sendGeminiRequest(buildParts(true));
                                    resultText = r.text;
                                    activeModel = r.modelUsed;
                                } catch (e) {
                                    console.warn(`Segmen ${seg.timeCode} audio fallback ke visual:`, e);
                                    const fallback = await sendGeminiRequest(buildParts(false));
                                    resultText = fallback.text;
                                    activeModel = fallback.modelUsed;
                                }

                                let desc = "Aktivitas adegan siaran.";
                                const parsedSeg = safeParseGeminiJson(resultText);
                                if (parsedSeg && parsedSeg.deskripsi) {
                                    desc = parsedSeg.deskripsi;
                                } else if (parsedSeg && typeof parsedSeg === 'object') {
                                    const val = Object.values(parsedSeg).find(v => typeof v === 'string' && v.trim().length > 10);
                                    if (val) desc = val;
                                } else {
                                    desc = (resultText || "").replace(/```json/gi, '').replace(/```/g, '').trim() || desc;
                                }

                                accumulatedRows[index] = {
                                    id: Date.now() + index,
                                    rentangWaktu: seg.timeCode,
                                    deskripsi: desc
                                };

                                completedCount++;
                                setProgress(Math.round(20 + (completedCount / segments.length) * 70));
                                setCurrentProcessingSegment(`Paralel: ${completedCount}/${segments.length} segmen selesai...`);
                                
                                // Live update baris yang sudah selesai ke UI
                                setMbmRows(accumulatedRows.filter(Boolean));
                            };

                            let queueIndex = 0;
                            const workers = Array(Math.min(CONCURRENCY, segments.length)).fill(0).map(async () => {
                                while (queueIndex < segments.length) {
                                    const idx = queueIndex++;
                                    await processSegment(idx);
                                }
                            });
                            await Promise.all(workers);

                            // Sinopsis Global
                            const validRows = accumulatedRows.filter(Boolean);
                            if (validRows.length > 0) {
                                setCurrentProcessingSegment("Menyusun sinopsis global...");
                                try {
                                    const synPrompt = `Berdasarkan catatan log MBM tayangan "${uploadedFileName}":\n\n` +
                                        validRows.map(r => `${r.rentangWaktu}: ${r.deskripsi}`).slice(0, 15).join('\n\n') +
                                        `\n\nBuat sinopsis global 2-3 paragraf padat mengenai alur cerita utama, konflik/topik, dialog kunci, dan pesan tayangan.`;
                                    const synResp = await sendGeminiRequest([{ text: synPrompt }]);
                                    if (synResp && synResp.text) {
                                        setSynopsis(synResp.text.trim());
                                    }
                                } catch (synErr) {
                                    console.warn("Sinopsis error:", synErr);
                                }
                                notify(`Selesai! ${validRows.length} segmen diproses secara paralel dengan ${activeModel}.`);
                            }
                        }

                        if (videoEl) {
                            videoEl.currentTime = origTime;
                            if (wasPlaying) videoEl.play();
                        }

                        if (activeModel && activeModel !== selectedModel) {
                            setSelectedModel(activeModel);
                            localStorage.setItem('mbm_model', activeModel);
                        }

                        setProgress(100);

                    } catch (err) {
                        console.error("Fatal Gemini Error:", err);
                        notify("Gagal AI Gemini: " + err.message);
                        alert(`Terjadi kendala saat memanggil Gemini API:\n\n${err.message}\n\nSistem beralih ke mode simulasi cerdas.`);
                        // Fallback ke simulasi spesifik file
                        generateSimulatedLogs(segments, duration);
                    }
                } else {
                    // Mode Demo / Simulasi Spesifik File
                    generateSimulatedLogs(segments, duration);
                }

                setIsGenerating(false);
                setCurrentProcessingSegment("");
            };

            const generateSimulatedLogs = async (segments, duration) => {
                const generatedLogs = [];
                const baseName = uploadedFileName.replace(/\.[^/.]+$/, "");

                const demoDialogPresets = [
                    {
                        visual: `[Visual] Sena terlihat berjalan di area depan gedung sambil memeriksa ponselnya, lalu berhenti di samping mobil hitam berpelat F 1387 FBE. Suasana pagi hari cerah dengan latar pepohonan asri.`,
                        dialog: `[Dialog]\n• Sena (telepon): "Halo Mas, berkas rundown acara untuk liputan Go Spot hari ini sudah siap semua kan?"\n• Tim Produksi (telepon): "Sudah aman Sen, ini tim liputan lagi otw ke lokasi wawancara."\n• Voice Over: "Sena bersiap menghadapi liputan investigasi penting pagi ini."`
                    },
                    {
                        visual: `[Visual] Seorang wanita berambut panjang mengenakan kacamata hitam besar tampil di layar dengan ekspresi tersenyum simpul, didampingi manajernya di depan pintu studio.`,
                        dialog: `[Dialog]\n• Davina: "Kalian semua gak usah khawatir, kesalahpahaman kemarin sudah kita selesaikan secara kekeluargaan."\n• Wartawan / Kru: "Lalu bagaimana dengan kelanjutan proyek sinetron barunya nanti?"\n• Davina: "Ditunggu saja ya tanggal mainnya, pasti segera kami umumkan."`
                    },
                    {
                        visual: `[Visual] Dua pria sedang melakukan koreografi tarian atau senam lentur di dalam studio dengan pakaian gelap, dipandu instruktur di barisan depan.`,
                        dialog: `[Dialog]\n• Instruktur: "Satu, dua, tiga... putar badan ke kanan, tahan! Rasakan tempo ketukan lagunya."\n• Dancer: "Lincah amat ya gerakannya, butuh stamina ekstra nih!"\n• Backsound: Alunan musik bertempo cepat disertai tawa canda para peserta latihan.`
                    },
                    {
                        visual: `[Visual] Suasana wawancara eksklusif di dalam ruangan kantor, narasumber duduk di sofa berhadapan dengan presenter membicarakan klarifikasi berita.`,
                        dialog: `[Dialog]\n• Presenter: "Banyak spekulasi yang beredar luas di media sosial belakangan ini, bagaimana tanggapan Anda?"\n• Narasumber: "Saya rasa publik perlu melihat bukti dan fakta hukum yang sebenarnya, jangan langsung percaya kabar burung."`
                    }
                ];

                for (let i = 0; i < segments.length; i++) {
                    const seg = segments[i];
                    setCurrentProcessingSegment(`Membuat log simulasi segmen ${i + 1}/${segments.length} (${seg.timeCode})...`);
                    await new Promise(r => setTimeout(r, 250));

                    const preset = demoDialogPresets[i % demoDialogPresets.length];
                    const fullDesc = `${preset.visual}\n${preset.dialog}`;

                    generatedLogs.push({
                        id: Date.now() + i,
                        rentangWaktu: seg.timeCode,
                        deskripsi: fullDesc
                    });

                    setProgress(Math.round(((i + 1) / segments.length) * 100));
                }

                setMbmRows(generatedLogs);
                setSynopsis(`[MODE DEMO / SIMULASI] Ringkasan tayangan "${baseName}" berdurasi total ${formatTime(duration)} (${segments.length} segmen @ ${intervalMinutes}m). Format MBM kini memadukan catatan visual adegan dan kutipan dialog percakapan secara terpadu. Untuk menganalisis suara dan dialog video asli secara otomatis, silakan aktifkan Gemini API Key Anda.`);
                notify("Selesai (Mode Demo)! MBM kini menampilkan adegan visual + dialog.");
            };

            const updateRow = (id, field, value) => {
                setMbmRows(prev => prev.map(row => row.id === id ? { ...row, [field]: value } : row));
            };

            const addManualRow = () => {
                setHistoryStack(prev => [...prev, { rows: [...mbmRows], synopsis }]);
                const lastRow = mbmRows[mbmRows.length - 1];
                let newStart = 0;
                if (lastRow) {
                    const parts = lastRow.rentangWaktu.split('-');
                    if (parts.length > 1) newStart = parseTimeToSeconds(parts[1]);
                }
                const newEnd = newStart + (intervalMinutes * 60);
                const newRow = {
                    id: Date.now(),
                    rentangWaktu: `${formatTime(newStart)} - ${formatTime(newEnd)}`,
                    deskripsi: "Deskripsi adegan baru..."
                };
                setMbmRows([...mbmRows, newRow]);
                notify("Baris adegan MBM baru ditambahkan");
            };

            const deleteRow = (id) => {
                setHistoryStack(prev => [...prev, { rows: [...mbmRows], synopsis }]);
                setMbmRows(prev => prev.filter(row => row.id !== id));
                notify("Baris dihapus");
            };

            const copyAllToClipboard = () => {
                let text = "RENTANG WAKTU\tDESKRIPSI ADEGAN\n";
                text += mbmRows.map(r => `${r.rentangWaktu}\t${r.deskripsi}`).join("\n");
                text += `\n\nSINOPSIS / RINGKASAN:\n${synopsis}`;
                navigator.clipboard.writeText(text);
                notify("Seluruh tabel MBM disalin ke clipboard!");
            };

            const filteredRows = mbmRows.filter(r => 
                r.rentangWaktu.toLowerCase().includes(searchTerm.toLowerCase()) ||
                r.deskripsi.toLowerCase().includes(searchTerm.toLowerCase())
            );

            // Pilihan Interval: 1 Menit, 5 Menit, 10 Menit, 30 Menit, 1 Jam
            const intervalOptions = [
                { label: "1m", value: 1, desc: "1 Menit" },
                { label: "5m", value: 5, desc: "5 Menit" },
                { label: "10m", value: 10, desc: "10 Menit" },
                { label: "30m", value: 30, desc: "30 Menit" },
                { label: "1 Jam", value: 60, desc: "1 Jam" }
            ];

            const isAnyBoxMoved = (boxPositions.preview?.x !== 0 || boxPositions.preview?.y !== 0) ||
                                  (boxPositions.tools?.x !== 0 || boxPositions.tools?.y !== 0) ||
                                  (boxPositions.mbm?.x !== 0 || boxPositions.mbm?.y !== 0) ||
                                  (boxPositions.floatingMbm?.x !== 0 || boxPositions.floatingMbm?.y !== 0);

            // Render Modal Menu Edit Segmen MBM (Dapat tampil baik di mode normal maupun mode fullscreen)
            const renderEditRowModal = () => {
                if (!editingRow) return null;
                return (
                    <div 
                        className="fixed inset-0 z-[100] flex items-center justify-center bg-black/75 backdrop-blur-sm p-4 animate-fadeIn pointer-events-auto select-text overflow-y-auto"
                        onClick={() => setEditingRow(null)}
                    >
                        <div 
                            className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto my-auto text-slate-900"
                            onClick={(e) => e.stopPropagation()}
                        >
                            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                <div className="flex items-center gap-2">
                                    <span className="w-6 h-6 rounded-lg bg-blue-100 text-blue-700 font-black text-xs flex items-center justify-center">
                                        #{editingRow.index}
                                    </span>
                                    <h3 className="font-black text-base text-slate-900">Menu Edit Segmen MBM</h3>
                                </div>
                                <button 
                                    type="button"
                                    onClick={() => setEditingRow(null)}
                                    className="text-slate-400 hover:text-slate-700 p-1 text-sm rounded-lg hover:bg-slate-100 transition-colors"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>

                            <div className="space-y-3">
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            Rentang Waktu (Timecode)
                                        </label>
                                        <input 
                                            type="text"
                                            value={editingRow.rentangWaktu}
                                            onChange={(e) => setEditingRow({ ...editingRow, rentangWaktu: e.target.value })}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-mono font-bold text-slate-800 outline-none focus:bg-white focus:border-slate-400"
                                            placeholder="00:00 - 01:00"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            Unit / Segmen
                                        </label>
                                        <input 
                                            type="text"
                                            value={editingRow.unit || ""}
                                            onChange={(e) => setEditingRow({ ...editingRow, unit: e.target.value })}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-800 outline-none focus:bg-white focus:border-slate-400"
                                            placeholder="Segmen 1 / Break Iklan"
                                        />
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            TVR (Rating Point)
                                        </label>
                                        <input 
                                            type="number"
                                            step="0.1"
                                            value={editingRow.tvr !== undefined && editingRow.tvr !== null ? editingRow.tvr : ""}
                                            onChange={(e) => setEditingRow({ ...editingRow, tvr: e.target.value })}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-mono font-black text-slate-900 outline-none focus:bg-white focus:border-slate-400"
                                            placeholder="2.8"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            Audience Share (%)
                                        </label>
                                        <input 
                                            type="number"
                                            step="0.1"
                                            value={editingRow.share !== undefined && editingRow.share !== null ? editingRow.share : ""}
                                            onChange={(e) => setEditingRow({ ...editingRow, share: e.target.value })}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-mono font-black text-slate-900 outline-none focus:bg-white focus:border-slate-400"
                                            placeholder="14.5"
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                        Deskripsi Adegan
                                    </label>
                                    <textarea 
                                        value={editingRow.deskripsi}
                                        onChange={(e) => setEditingRow({ ...editingRow, deskripsi: e.target.value })}
                                        rows={5}
                                        className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800 outline-none focus:bg-white focus:border-slate-400 leading-relaxed resize-y"
                                        placeholder="Tuliskan deskripsi adegan..."
                                    />
                                </div>
                            </div>

                            <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                                <button 
                                    type="button"
                                    onClick={() => setEditingRow(null)}
                                    className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-all"
                                >
                                    Batal
                                </button>
                                <button 
                                    type="button"
                                    onClick={() => {
                                        setHistoryStack(prev => [...prev, { rows: [...mbmRows], synopsis }]);
                                        setMbmRows(prev => prev.map(row => {
                                            if (row.id === editingRow.id) {
                                                return {
                                                    ...row,
                                                    rentangWaktu: editingRow.rentangWaktu,
                                                    deskripsi: editingRow.deskripsi,
                                                    tvr: editingRow.tvr !== "" && editingRow.tvr !== null && editingRow.tvr !== undefined ? Number(editingRow.tvr) : null,
                                                    share: editingRow.share !== "" && editingRow.share !== null && editingRow.share !== undefined ? Number(editingRow.share) : null,
                                                    unit: editingRow.unit || null
                                                };
                                            }
                                            return row;
                                        }));
                                        setEditingRow(null);
                                        notify("Perubahan adegan & rating berhasil disimpan!");
                                    }}
                                    className="px-4 py-2 rounded-xl text-xs font-black bg-obsidian text-neon hover:bg-black transition-all shadow-sm active:scale-95 flex items-center gap-1.5"
                                >
                                    <span>Simpan Perubahan</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // Render Modal Nielsen Rating Data (Dapat tampil baik di mode normal maupun mode fullscreen)
            const renderRatingModal = () => {
                if (!showRatingModal) return null;
                return (
                    <div 
                        className="fixed inset-0 z-[100] flex items-center justify-center bg-black/75 backdrop-blur-sm p-4 animate-fadeIn pointer-events-auto select-text overflow-y-auto"
                        onClick={() => setShowRatingModal(false)}
                    >
                        <div 
                            className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto my-auto text-slate-900"
                            onClick={(e) => e.stopPropagation()}
                        >
                            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                <div className="flex items-center gap-2.5">
                                    <div className="w-8 h-8 rounded-xl bg-neon text-obsidian flex items-center justify-center text-sm font-black shadow-sm">
                                        <i className="fa-solid fa-chart-line"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-black text-base text-slate-900">Tempel Data Rating Nielsen (TVR, Share, Unit)</h3>
                                        <p className="text-[11px] text-slate-500 font-medium">Salin langsung kolom dari Excel riset, lalu paste di bawah ini.</p>
                                    </div>
                                </div>
                                <button 
                                    type="button"
                                    onClick={() => setShowRatingModal(false)}
                                    className="text-slate-400 hover:text-slate-700 p-1 text-sm rounded-lg hover:bg-slate-100 transition-colors"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>

                            <div className="space-y-3">
                                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-3 text-slate-600 text-xs space-y-1">
                                    <p className="font-bold text-slate-800 flex items-center gap-1.5">
                                        <i className="fa-solid fa-circle-info text-lime-700"></i>
                                        <span>Format yang Didukung (Bisa langsung Copy & Paste dari Excel):</span>
                                    </p>
                                    <p className="font-mono text-[10.5px] text-slate-500 pl-4">
                                        Kolom 1: Rentang Waktu (opsional)<br />
                                        Kolom 2: <strong>TVR</strong> (angka rating)<br />
                                        Kolom 3: <strong>SHARE (%)</strong> (angka pangsa pemirsa)<br />
                                        Kolom 4: <strong>UNIT</strong> (Segmen tayangan / Iklan)
                                    </p>
                                </div>

                                <div>
                                    <div className="flex items-center justify-between mb-1.5">
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">
                                            Area Tempel Data Teks:
                                        </label>
                                        <button 
                                            type="button"
                                            onClick={() => {
                                                const sampleText = `00:00 - 01:00\t2.4\t12.8\tSegmen 1\n01:00 - 02:00\t2.7\t14.2\tSegmen 1\n02:00 - 03:00\t3.1\t16.5\tSegmen 1\n03:00 - 04:00\t1.8\t9.1\tBreak Iklan 1\n04:00 - 05:00\t3.4\t17.8\tSegmen 2\n05:00 - 06:00\t3.7\t18.9\tSegmen 2\n06:00 - 07:00\t3.5\t17.4\tSegmen 2\n07:00 - 08:00\t1.9\t9.5\tBreak Iklan 2\n08:00 - 09:00\t3.6\t18.2\tSegmen 3\n09:00 - 10:00\t3.2\t16.0\tSegmen 3`;
                                                setPastedRatingText(sampleText);
                                                notify("Contoh data rating Nielsen dimuat!");
                                            }}
                                            className="text-[10px] font-bold text-lime-700 hover:text-lime-900 bg-limePill px-2 py-0.5 rounded-md hover:underline"
                                        >
                                            + Gunakan Contoh Data Rating
                                        </button>
                                    </div>
                                    <textarea 
                                        value={pastedRatingText}
                                        onChange={(e) => setPastedRatingText(e.target.value)}
                                        rows={8}
                                        placeholder={"Tempel data Excel di sini...\nContoh:\n00:00 - 01:00\t2.4\t12.8\tSegmen 1\n01:00 - 02:00\t2.7\t14.2\tSegmen 1"}
                                        className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl p-3 text-xs font-mono font-medium text-slate-800 outline-none focus:bg-white focus:border-slate-400 resize-y leading-relaxed shadow-inner"
                                    />
                                </div>
                            </div>

                            <div className="flex items-center justify-end gap-2.5 pt-2 border-t border-slate-100">
                                <button 
                                    type="button"
                                    onClick={() => setShowRatingModal(false)}
                                    className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-all"
                                >
                                    Batal
                                </button>
                                <button 
                                    type="button"
                                    onClick={() => parseAndApplyRatingData(pastedRatingText)}
                                    className="px-5 py-2.5 rounded-xl text-xs font-black bg-neon text-obsidian hover:bg-neon-dark transition-all shadow-md active:scale-95 flex items-center gap-1.5"
                                >
                                    <i className="fa-solid fa-check text-xs"></i>
                                    <span>Terapkan Data Rating & Buka Grafik</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col bg-[#f8fafc]">
                    
                    {/* TOAST NOTIFIKASI */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-[70] bg-obsidian text-neon px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 font-extrabold text-xs border border-slate-700 animate-bounce">
                            <i className="fa-solid fa-circle-check"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* ======================================================== */}
                    {/* TOP NAVBAR                                               */}
                    {/* ======================================================== */}
                    <header className="h-16 px-6 flex items-center justify-between border-b border-slate-200/80 bg-white/70 backdrop-blur-md sticky top-0 z-40">
                        
                        {/* Kiri: Icon Bulat Hitam + 3 Tombol Sesuai Attachment 2 */}
                        <div className="flex items-center gap-2.5">
                            <button className="w-9 h-9 rounded-full bg-obsidian text-neon flex items-center justify-center font-black text-sm shadow-sm hover:scale-105 transition-all">
                                <i className="fa-solid fa-bolt"></i>
                            </button>
                            
                            {/* Pill 3 Tombol Icon (Attachment 2) */}
                            <div className="flex items-center bg-white border border-slate-200/90 rounded-full px-3.5 py-1.5 gap-3.5 shadow-sm text-slate-700">
                                <button 
                                    onClick={handleBack}
                                    className="hover:text-slate-900 transition-colors p-1 flex items-center justify-center"
                                    title="Back / Kembali"
                                >
                                    <i className="fa-solid fa-reply text-xs"></i>
                                </button>
                                <button 
                                    onClick={handleReset}
                                    className="hover:text-slate-900 transition-colors p-1 flex items-center justify-center"
                                    title="Reset Data & Posisi Layout"
                                >
                                    <i className="fa-solid fa-rotate-left text-xs"></i>
                                </button>
                                <button 
                                    onClick={handleUndo}
                                    className={`transition-colors p-1 flex items-center justify-center ${
                                        historyStack.length > 0 ? 'text-slate-700 hover:text-slate-900' : 'text-slate-300 cursor-default'
                                    }`}
                                    title="Undo"
                                >
                                    <i className="fa-solid fa-share text-xs"></i>
                                </button>
                            </div>

                            {/* Tombol Cepat Reset Posisi Box (Muncul otomatis saat box digeser) */}
                            {isAnyBoxMoved && (
                                <button 
                                    onClick={resetAllPositions}
                                    className="text-[10px] font-black text-amber-800 bg-amber-100 hover:bg-amber-200 border border-amber-300 px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5 shadow-sm active:scale-95 animate-fadeIn"
                                    title="Kembalikan semua box yang digeser ke posisi semula"
                                >
                                    <i className="fa-solid fa-arrows-rotate text-[9px]"></i>
                                    <span>{t("resetBoxPositions")}</span>
                                </button>
                            )}
                        </div>

                        {/* Tengah: Persis Seperti Attachment 1 (Ultra Simple & Bersih Tanpa Box Border) */}
                        <div className="relative">
                            <div 
                                onClick={() => setShowFileMenu(!showFileMenu)}
                                className="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity select-none py-1 px-2 rounded-lg"
                                title="Klik untuk membuka file atau melihat riwayat"
                            >
                                <i className="fa-regular fa-file-lines text-indigo-600 text-base"></i>
                                <span className="font-black text-xs sm:text-sm tracking-tight text-slate-900">
                                    {uploadedFileName}
                                </span>
                                <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                            </div>

                            {/* DROPDOWN MENU POPOVER: LOKASI FOLDER & FILE SEBELUMNYA */}
                            {showFileMenu && (
                                <div className="absolute top-12 left-1/2 -translate-x-1/2 w-80 sm:w-96 bg-white rounded-2xl shadow-2xl border border-slate-200 p-4 z-50 animate-in fade-in zoom-in-95">
                                    <div className="pb-3 border-b border-slate-100">
                                        <div className="flex items-center justify-between text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">
                                            <span>LOKASI FOLDER FILE:</span>
                                            <button 
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    navigator.clipboard.writeText(fileFolderPath);
                                                    notify("Path folder disalin ke clipboard!");
                                                }}
                                                className="text-blue-600 hover:underline flex items-center gap-1"
                                            >
                                                <i className="fa-regular fa-copy text-[9px]"></i> Salin Path
                                            </button>
                                        </div>
                                        <div className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 flex items-center gap-2">
                                            <i className="fa-solid fa-folder-open text-amber-500 text-sm shrink-0"></i>
                                            <span className="text-xs font-mono font-bold text-slate-700 break-all select-all">
                                                {fileFolderPath}
                                            </span>
                                        </div>
                                    </div>

                                    <div className="py-3 border-b border-slate-100">
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setShowFileMenu(false);
                                                excelInputRef.current.click();
                                            }}
                                            className="w-full py-2 px-3 rounded-xl bg-slate-900 hover:bg-black text-white text-xs font-bold flex items-center justify-center gap-2 transition-all shadow-sm"
                                        >
                                            <i className="fa-solid fa-folder-plus text-neon text-xs"></i>
                                            <span>Buka File Lain (.xlsx / .csv / video)</span>
                                        </button>
                                    </div>

                                    <div className="pt-3">
                                        <div className="flex items-center justify-between text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-2">
                                            <span>RIWAYAT / FILE SEBELUMNYA:</span>
                                            <div className="flex items-center gap-2">
                                                <span className="text-slate-400 font-normal">{recentFiles.length} file</span>
                                                {recentFiles.length > 0 && (
                                                    <>
                                                        <span className="text-slate-300">•</span>
                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                if (confirm("Apakah Anda yakin ingin menghapus seluruh riwayat file?")) {
                                                                    setRecentFiles([]);
                                                                    localStorage.setItem('mbm_recentFiles', JSON.stringify([]));
                                                                    notify("Seluruh riwayat file berhasil dikosongkan!");
                                                                }
                                                            }}
                                                            className="text-red-500 hover:text-red-700 hover:underline font-bold text-[9px] normal-case"
                                                            title="Kosongkan seluruh riwayat"
                                                        >
                                                            Hapus Semua
                                                        </button>
                                                    </>
                                                )}
                                            </div>
                                        </div>

                                        <div className="space-y-1.5 max-h-56 overflow-y-auto custom-scroll pr-1">
                                            {recentFiles.length === 0 ? (
                                                <div className="py-6 text-center text-slate-400 text-xs font-medium bg-slate-50 rounded-xl border border-dashed border-slate-200">
                                                    Belum ada riwayat file tersimpan.
                                                </div>
                                            ) : (
                                                recentFiles.map((file, idx) => (
                                                    <div 
                                                        key={idx}
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setUploadedFileName(file.name);
                                                            setFileFolderPath(file.folder || "C:\\Users\\MNC Channel\\Downloads");
                                                            setShowFileMenu(false);
                                                            notify(`Beralih ke file: ${file.name}`);
                                                        }}
                                                        className={`p-2.5 rounded-xl border flex items-center justify-between cursor-pointer transition-all group ${
                                                            uploadedFileName === file.name 
                                                                ? 'bg-[#f4fce3] border-limeBorder text-limeText font-bold' 
                                                                : 'bg-[#f8fafc] hover:bg-slate-100 border-slate-200 text-slate-700 font-medium'
                                                        }`}
                                                    >
                                                        <div className="truncate text-left pr-2 flex-1 min-w-0">
                                                            <p className="text-xs truncate font-bold text-slate-800">{file.name}</p>
                                                            <p className="text-[9px] font-mono text-slate-400 truncate">{file.folder}</p>
                                                        </div>
                                                        <div className="flex items-center gap-1.5 shrink-0">
                                                            {uploadedFileName === file.name && (
                                                                <span className="text-[9px] font-black uppercase text-obsidian bg-neon px-1.5 py-0.5 rounded shrink-0">
                                                                    Aktif
                                                                </span>
                                                            )}
                                                            <button 
                                                                onClick={(e) => handleDeleteRecentFile(idx, file, e)}
                                                                className="w-7 h-7 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 flex items-center justify-center transition-all"
                                                                title={`Hapus "${file.name}" dari riwayat`}
                                                            >
                                                                <i className="fa-solid fa-trash-can text-xs"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                    <div className="pt-3 mt-2 border-t border-slate-100 text-center">
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setShowFileMenu(false);
                                            }}
                                            className="text-[11px] font-bold text-slate-400 hover:text-slate-600"
                                        >
                                            Tutup Menu
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Kanan: Hanya Pilihan Export Excel & Export CSV */}
                        <div className="flex items-center gap-2.5">
                            <input 
                                type="file" 
                                ref={excelInputRef} 
                                onChange={handleExcelUpload} 
                                accept=".xlsx, .xls, .csv" 
                                className="hidden" 
                            />

                            {/* Tombol Export Excel (Warna Hijau Neon Template) */}
                            <button 
                                onClick={exportToExcelSystem} 
                                className="flex items-center justify-center bg-neon hover:bg-neon-dark text-obsidian text-xs font-black px-4 py-2 rounded-xl transition-all shadow-md active:scale-95"
                                title="Download File Excel (.xlsx) Sheet: Hasil_MBM"
                            >
                                <span>Export Excel</span>
                            </button>

                            {/* Tombol Export CSV */}
                            <button 
                                onClick={exportToCSVSystem} 
                                className="flex items-center justify-center bg-obsidian hover:bg-black text-white text-xs font-black px-4 py-2 rounded-xl transition-all shadow-md active:scale-95 border border-slate-700"
                                title="Download File CSV"
                            >
                                <span>Export CSV</span>
                            </button>

                            {/* Tombol Toggle Bahasa (ID / EN) */}
                            <div className="flex items-center bg-slate-100 border border-slate-200/90 rounded-xl p-0.5 shadow-inner ml-1" title={lang === "id" ? "Pilih Bahasa / Select Language" : "Select Language / Pilih Bahasa"}>
                                <button 
                                    type="button"
                                    onClick={() => {
                                        if (lang !== "id") {
                                            setLang("id");
                                            localStorage.setItem("mbm_app_lang", "id");
                                            notify("Bahasa diubah ke Bahasa Indonesia 🇮🇩");
                                        }
                                    }}
                                    className={`px-2.5 py-1 rounded-lg text-xs font-black transition-all flex items-center gap-1.5 ${
                                        lang === "id" 
                                            ? "bg-obsidian text-neon shadow-sm" 
                                            : "text-slate-500 hover:text-slate-800"
                                    }`}
                                    title="Ganti ke Bahasa Indonesia"
                                >
                                    <span>🇮🇩</span>
                                    <span>ID</span>
                                </button>
                                <button 
                                    type="button"
                                    onClick={() => {
                                        if (lang !== "en") {
                                            setLang("en");
                                            localStorage.setItem("mbm_app_lang", "en");
                                            notify("Language switched to English 🇬🇧");
                                        }
                                    }}
                                    className={`px-2.5 py-1 rounded-lg text-xs font-black transition-all flex items-center gap-1.5 ${
                                        lang === "en" 
                                            ? "bg-obsidian text-neon shadow-sm" 
                                            : "text-slate-500 hover:text-slate-800"
                                    }`}
                                    title="Switch to English"
                                >
                                    <span>🇬🇧</span>
                                    <span>EN</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* ======================================================== */}
                    {/* WORKSPACE AREA: TATA LETAK ALA YOUTUBE                   */}
                    {/* KIRI: VIDEO PREVIEW + BOX TOOLS DI BAWAHNYA (ATTACHMENT 1)*/}
                    {/* KANAN: DAFTAR TABEL MBM (ATTACHMENT 2)                   */}
                    {/* ======================================================== */}
                    <div className="max-w-[1750px] w-full mx-auto px-6 py-6 flex-1 grid grid-cols-12 gap-6 items-start">
                        
                        {/* ===================================================== */}
                        {/* KOLOM KIRI (7 Kolom): VIDEO PREVIEW + ATTACHMENT 1 DI BAWAH */}
                        {/* ===================================================== */}
                        <div className="col-span-12 lg:col-span-7 flex flex-col gap-6">
                            
                            {/* 1. AREA PREVIEW VIDEO UTAMA */}
                            {isPreviewVisible ? (
                                <div 
                                    style={{
                                        transform: `translate3d(${boxPositions.preview.x}px, ${boxPositions.preview.y}px, 0)`,
                                        zIndex: zIndices.preview
                                    }}
                                    onMouseDown={() => bringToFront('preview')}
                                    className="bg-white rounded-3xl border border-slate-200/90 shadow-[0_10px_35px_rgba(0,0,0,0.04)] p-6 sm:p-7 flex flex-col gap-4 relative overflow-hidden transition-shadow"
                                >
                                    
                                    {/* Mac OS Window Dots & Action Buttons (Drag Handle) */}
                                    <div 
                                        onMouseDown={(e) => handleStartDrag('preview', e)}
                                        onTouchStart={(e) => handleStartDrag('preview', e)}
                                        className="flex items-center justify-between pb-2 border-b border-slate-100 cursor-grab active:cursor-grabbing select-none"
                                        title="Klik & tahan di sini untuk menggeser box Preview (Drag)"
                                    >
                                        <div className="window-dots">
                                            <div className="window-dot"></div>
                                            <div className="window-dot"></div>
                                            <div className="window-dot"></div>
                                        </div>


                                        <div className="flex items-center gap-1.5 text-slate-400 text-xs">
                                            <button 
                                                onClick={() => {
                                                    handleResetPreview();
                                                    resetBoxPosition('preview');
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-slate-100 hover:text-slate-800 flex items-center justify-center transition-all"
                                                title="Reset pemutaran video & kembalikan posisi awal"
                                            >
                                                <i className="fa-solid fa-rotate-left"></i>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    setIsPreviewCollapsed(!isPreviewCollapsed);
                                                    notify(isPreviewCollapsed ? "Area Preview Video diperluas" : "Area Preview Video diminimalkan");
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-slate-100 hover:text-slate-800 flex items-center justify-center transition-all"
                                                title={isPreviewCollapsed ? "Perbesar Preview Video" : "Kecilkan / Minimize Preview Video"}
                                            >
                                                <i className={`fa-solid ${isPreviewCollapsed ? 'fa-plus' : 'fa-minus'}`}></i>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    setIsPreviewVisible(false);
                                                    notify("Area Preview Video disembunyikan. Klik tombol di atas untuk membuka kembali.");
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-red-50 hover:text-red-500 flex items-center justify-center transition-all"
                                                title="Tutup / Sembunyikan Area Preview Video"
                                            >
                                                <i className="fa-solid fa-xmark"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Jika Diminimalkan */}
                                    {isPreviewCollapsed ? (
                                        <div 
                                            onClick={() => setIsPreviewCollapsed(false)}
