                                                title="Reset total seluruh proyek, video, & cache ke default kosong"
                                            >
                                                <i className="fa-solid fa-rotate-left text-[9px]"></i>
                                                <span>Reset Total Semua Proyek (Default Kosong)</span>
                                            </button>
                                        </div>
                                    </div>

                                    {/* SEKSI 2: LOKASI FOLDER FILE */}
                                    <div className="py-2.5 border-b border-slate-100">
                                        <div className="flex items-center justify-between text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1">
                                            <span>LOKASI FOLDER FILE:</span>
                                            <button 
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    navigator.clipboard.writeText(fileFolderPath);
                                                    notify("Path folder disalin ke clipboard!");
                                                }}
                                                className="text-blue-600 hover:underline flex items-center gap-1"
                                            >
                                                <i className="fa-regular fa-copy text-[9px]"></i> Salin Path
                                            </button>
                                        </div>
                                        <div className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 flex items-center gap-2">
                                            <i className="fa-solid fa-folder-open text-amber-500 text-sm shrink-0"></i>
                                            <span className="text-xs font-mono font-bold text-slate-700 break-all select-all">
                                                {fileFolderPath}
                                            </span>
                                        </div>
                                    </div>

                                    {/* SEKSI 3: AKSI BUKA FILE / YOUTUBE */}
                                    <div className="py-2.5 border-b border-slate-100">
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setShowFileMenu(false);
                                                excelInputRef.current.click();
                                            }}
                                            className="w-full py-2 px-3 rounded-xl bg-slate-900 hover:bg-black text-white text-xs font-bold flex items-center justify-center gap-2 transition-all shadow-sm cursor-pointer"
                                        >
                                            <i className="fa-solid fa-folder-plus text-neon text-xs"></i>
                                            <span>Buka File Lain (.xlsx / .csv / video)</span>
                                        </button>
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setShowFileMenu(false);
                                                setShowUrlInputModal(true);
                                            }}
                                            className="w-full mt-2 py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold flex items-center justify-center gap-2 transition-all border border-slate-200 shadow-xs cursor-pointer"
                                        >
                                            <i className="fa-brands fa-youtube text-red-600 text-sm"></i>
                                            <span>Monitoring Link YouTube / Video URL</span>
                                        </button>
                                    </div>

                                    {/* SEKSI 4: RIWAYAT FILE */}
                                    <div className="pt-2.5">
                                        <div className="flex items-center justify-between text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-2">
                                            <span>RIWAYAT / FILE SEBELUMNYA:</span>
                                            <div className="flex items-center gap-2">
                                                <span className="text-slate-400 font-normal">{recentFiles.length} file</span>
                                                {recentFiles.length > 0 && (
                                                    <>
                                                        <span className="text-slate-300">•</span>
                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                if (confirm("Apakah Anda yakin ingin menghapus seluruh riwayat file?")) {
                                                                    setRecentFiles([]);
                                                                    localStorage.setItem('mbm_recentFiles', JSON.stringify([]));
                                                                    notify("Seluruh riwayat file berhasil dikosongkan!");
                                                                }
                                                            }}
                                                            className="text-red-500 hover:text-red-700 hover:underline font-bold text-[9px] normal-case"
                                                            title="Kosongkan seluruh riwayat"
                                                        >
                                                            Hapus Semua
                                                        </button>
                                                    </>
                                                )}
                                            </div>
                                        </div>

                                        <div className="space-y-1.5 max-h-56 overflow-y-auto custom-scroll pr-1">
                                            {recentFiles.length === 0 ? (
                                                <div className="py-6 text-center text-slate-400 text-xs font-medium bg-slate-50 rounded-xl border border-dashed border-slate-200">
                                                    Belum ada riwayat file tersimpan.
                                                </div>
                                            ) : (
                                                recentFiles.map((file, idx) => (
                                                    <div 
                                                        key={idx}
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setUploadedFileName(file.name);
                                                            setFileFolderPath(file.folder || "C:\\Users\\MNC Channel\\Downloads");
                                                            setShowFileMenu(false);
                                                            notify(`Beralih ke file: ${file.name}`);
                                                        }}
                                                        className={`p-2.5 rounded-xl border flex items-center justify-between cursor-pointer transition-all group ${
                                                            uploadedFileName === file.name 
                                                                ? 'bg-[#f4fce3] border-limeBorder text-limeText font-bold' 
                                                                : 'bg-[#f8fafc] hover:bg-slate-100 border-slate-200 text-slate-700 font-medium'
                                                        }`}
                                                    >
                                                        <div className="truncate text-left pr-2 flex-1 min-w-0">
                                                            <p className="text-xs truncate font-bold text-slate-800">{file.name}</p>
                                                            <p className="text-[9px] font-mono text-slate-400 truncate">{file.folder}</p>
                                                        </div>
                                                        <div className="flex items-center gap-1.5 shrink-0">
                                                            {uploadedFileName === file.name && (
                                                                <span className="text-[9px] font-black uppercase text-obsidian bg-neon px-1.5 py-0.5 rounded shrink-0">
                                                                    Aktif
                                                                </span>
                                                            )}
                                                            <button 
                                                                onClick={(e) => handleDeleteRecentFile(idx, file, e)}
                                                                className="w-7 h-7 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 flex items-center justify-center transition-all"
                                                                title={`Hapus "${file.name}" dari riwayat`}
                                                            >
                                                                <i className="fa-solid fa-trash-can text-xs"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                    <div className="pt-3 mt-2 border-t border-slate-100 text-center">
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setShowFileMenu(false);
                                            }}
                                            className="text-[11px] font-bold text-slate-400 hover:text-slate-600"
                                        >
                                            Tutup Menu
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Kanan: Hanya Pilihan Export Excel & Export CSV */}
                        <div className="flex items-center gap-2.5">
                            <input 
                                type="file" 
                                ref={excelInputRef} 
                                onChange={handleExcelUpload} 
                                accept=".xlsx, .xls, .csv" 
                                className="hidden" 
                            />

                            {/* Tombol Export Excel (Warna Hijau Neon Template) */}
                            <button 
                                onClick={exportToExcelSystem} 
                                className="flex items-center justify-center bg-neon hover:bg-neon-dark text-obsidian text-xs font-black px-4 py-2 rounded-xl transition-all shadow-md active:scale-95"
                                title="Download File Excel (.xlsx) Sheet: Hasil_MBM"
                            >
                                <span>Export Excel</span>
                            </button>

                            {/* Tombol Export CSV */}
                            <button 
                                onClick={exportToCSVSystem} 
                                className="flex items-center justify-center bg-obsidian hover:bg-black text-white text-xs font-black px-4 py-2 rounded-xl transition-all shadow-md active:scale-95 border border-slate-700"
                                title="Download File CSV"
                            >
                                <span>Export CSV</span>
                            </button>
                            {deferredInstallPrompt && !isAppInstalled && (
                                <button 
                                    onClick={handleInstallPwa} 
                                    className="flex items-center gap-1.5 bg-neon hover:bg-neon-dark text-obsidian text-xs font-black px-3.5 py-2 rounded-xl transition-all shadow-md active:scale-95 border border-neon-dark"
                                    title="Install MBM Studio Pro sebagai aplikasi desktop di komputer Anda"
                                >
                                    <i className="fa-solid fa-download text-xs"></i>
                                    <span>Install App</span>
                                </button>
                            )}
                            <button style={{ display: 'none' }}>
                            </button>

                            {/* Tombol Toggle Bahasa (ID / EN) */}
                            <div className="flex items-center bg-slate-100 border border-slate-200/90 rounded-xl p-0.5 shadow-inner ml-1" title={lang === "id" ? "Pilih Bahasa / Select Language" : "Select Language / Pilih Bahasa"}>
                                <button 
                                    type="button"
                                    onClick={() => {
                                        if (lang !== "id") {
                                            setLang("id");
                                            localStorage.setItem("mbm_app_lang", "id");
                                            notify("Bahasa diubah ke Bahasa Indonesia");
                                        }
                                    }}
                                    className={`px-3 py-1 rounded-lg text-xs font-black transition-all flex items-center justify-center ${
                                        lang === "id" 
                                            ? "bg-obsidian text-neon shadow-sm" 
                                            : "text-slate-500 hover:text-slate-800"
                                    }`}
                                    title="Ganti ke Bahasa Indonesia"
                                >
                                    
                                    <span>ID</span>
                                </button>
                                <button 
                                    type="button"
                                    onClick={() => {
                                        if (lang !== "en") {
                                            setLang("en");
                                            localStorage.setItem("mbm_app_lang", "en");
                                            notify("Language switched to English");
                                        }
                                    }}
                                    className={`px-3 py-1 rounded-lg text-xs font-black transition-all flex items-center justify-center ${
                                        lang === "en" 
                                            ? "bg-obsidian text-neon shadow-sm" 
                                            : "text-slate-500 hover:text-slate-800"
                                    }`}
                                    title="Switch to English"
                                >
                                    
                                    <span>EN</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* ======================================================== */}
                    {/* WORKSPACE AREA: TATA LETAK ALA YOUTUBE                   */}
                    {/* KIRI: VIDEO PREVIEW + BOX TOOLS DI BAWAHNYA (ATTACHMENT 1)*/}
                    {/* KANAN: DAFTAR TABEL MBM (ATTACHMENT 2)                   */}
                    {/* ======================================================== */}
                    <div className="max-w-[1750px] w-full mx-auto px-6 py-6 flex-1 grid grid-cols-12 gap-6 items-start">
                        
                        {/* ===================================================== */}
                        {/* KOLOM KIRI (7 Kolom): VIDEO PREVIEW + ATTACHMENT 1 DI BAWAH */}
                        {/* ===================================================== */}
                        <div className="col-span-12 lg:col-span-7 flex flex-col gap-6">
                            
                            {/* 1. AREA PREVIEW VIDEO UTAMA */}
                            {isPreviewVisible ? (
                                <div 
                                    style={{
                                        transform: `translate3d(${boxPositions.preview.x}px, ${boxPositions.preview.y}px, 0)`,
                                        zIndex: zIndices.preview
                                    }}
                                    onMouseDown={() => bringToFront('preview')}
                                    className="bg-white rounded-3xl border border-slate-200/90 shadow-[0_10px_35px_rgba(0,0,0,0.04)] p-6 sm:p-7 flex flex-col gap-4 relative overflow-hidden transition-shadow"
                                >
                                    
                                    {/* Mac OS Window Dots & Action Buttons (Drag Handle) */}
                                    <div 
                                        onMouseDown={(e) => handleStartDrag('preview', e)}
                                        onTouchStart={(e) => handleStartDrag('preview', e)}
                                        className="flex items-center justify-between pb-2 border-b border-slate-100 cursor-grab active:cursor-grabbing select-none"
                                        title="Klik & tahan di sini untuk menggeser box Preview (Drag)"
                                    >
                                        <div className="window-dots">
                                            <div className="window-dot"></div>
                                            <div className="window-dot"></div>
                                            <div className="window-dot"></div>
                                        </div>


                                        <div className="flex items-center gap-1.5 text-slate-400 text-xs">
                                            <button 
                                                onClick={() => {
                                                    handleResetPreview();
                                                    resetBoxPosition('preview');
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-slate-100 hover:text-slate-800 flex items-center justify-center transition-all"
                                                title="Reset pemutaran video & kembalikan posisi awal"
                                            >
                                                <i className="fa-solid fa-rotate-left"></i>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    setIsPreviewCollapsed(!isPreviewCollapsed);
                                                    notify(isPreviewCollapsed ? "Area Preview Video diperluas" : "Area Preview Video diminimalkan");
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-slate-100 hover:text-slate-800 flex items-center justify-center transition-all"
                                                title={isPreviewCollapsed ? "Perbesar Preview Video" : "Kecilkan / Minimize Preview Video"}
                                            >
                                                <i className={`fa-solid ${isPreviewCollapsed ? 'fa-plus' : 'fa-minus'}`}></i>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    setIsPreviewVisible(false);
                                                    notify("Area Preview Video disembunyikan. Klik tombol di atas untuk membuka kembali.");
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-red-50 hover:text-red-500 flex items-center justify-center transition-all"
                                                title="Tutup / Sembunyikan Area Preview Video"
                                            >
                                                <i className="fa-solid fa-xmark"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Jika Diminimalkan */}
                                    {isPreviewCollapsed ? (
                                        <div 
                                            onClick={() => setIsPreviewCollapsed(false)}
                                            className="py-1 flex items-center justify-between text-xs font-bold text-slate-500 cursor-pointer hover:text-slate-800 transition-colors"
                                        >
                                            <div className="flex items-center gap-2">
                                                <span className="w-2.5 h-2.5 rounded-full bg-neon animate-pulse"></span>
                                                <span className="font-extrabold text-slate-700">Preview: {uploadedFileName || "Belum Ada File Dipilih"}</span>
                                                <span className="text-slate-300">•</span>
                                                <span className="font-mono text-slate-600">{formatTime(currentTime)} / {formatTime(videoDuration)}</span>
                                            </div>
                                            <span className="text-blue-600 text-[11px] font-black hover:underline flex items-center gap-1">
                                                <span>Buka Layar Video</span>
                                                <i className="fa-solid fa-chevron-down text-[9px]"></i>
                                            </span>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="space-y-1">
                                                <h2 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight break-all" title={uploadedFileName || "Belum Ada File Dipilih"}>
                                                    {uploadedFileName || "Belum Ada File Dipilih (Default Kosong)"}
                                                </h2>
                                                <p className="text-xs sm:text-sm font-semibold text-slate-500">
                                                    {videoFile ? `File Video: ${videoFile.name} • Total Durasi: ${formatTime(videoDuration)}` : (videoUrl ? `Video URL • Durasi: ${formatTime(videoDuration)}` : 'Area Preview Video Utama (Belum ada file video yang dimuat)')}
                                                </p>
                                            </div>

                                            <div className="w-full flex items-center justify-between px-1 pt-1">
                                                <div className="flex items-center gap-2">
                                                    <span className="w-2.5 h-2.5 rounded-full bg-neon animate-pulse"></span>
                                                    <span className="text-xs font-black uppercase tracking-wider text-slate-700">
                                                        AREA PREVIEW VIDEO
                                                    </span>
                                                </div>
                                                <div className="font-mono text-xs font-extrabold text-slate-600 bg-slate-100 px-3 py-1 rounded-lg">
                                                    {formatTime(currentTime)} / {formatTime(videoDuration)}
                                                </div>
                                            </div>

                                            {/* Video Canvas Box 16:9 Aspect Ratio (atau Mode Fullscreen Zoom jika isVideoZoomed) */}
                                            <div 
                                                ref={playerContainerRef}
                                                className={
                                                    isVideoZoomed 
                                                        ? "fixed inset-0 z-50 bg-black flex flex-col items-center justify-center overflow-hidden animate-fadeIn select-none"
                                                        : "w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl relative border-2 border-slate-900 flex items-center justify-center group"
                                                }
                                            >
                                                {videoUrl ? (
                                                    <>
                                                        {youtubeId ? (
                                                            <div className="w-full h-full relative bg-black flex flex-col items-center justify-center">
                                                                <iframe
                                                                    id="yt-player-iframe"
                                                                    src={`https://www.youtube.com/embed/${youtubeId}?enablejsapi=1&autoplay=0&rel=0&modestbranding=1&playsinline=1`}
                                                                    className="w-full h-full border-0 select-auto flex-1"
                                                                    referrerPolicy="strict-origin-when-cross-origin"
                                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                                                    allowFullScreen
                                                                />

                                                                {/* Banner Info Khusus jika dibuka via file:// lokal */}
                                                                {window.location.protocol === 'file:' && (
                                                                    <div className="absolute top-12 left-1/2 -translate-x-1/2 z-20 bg-slate-950/90 border border-amber-500/60 text-slate-200 text-[11px] font-medium px-4 py-2 rounded-2xl shadow-2xl backdrop-blur-md flex items-center gap-2.5 max-w-[92%] animate-in fade-in">
                                                                        <i className="fa-solid fa-triangle-exclamation text-amber-400 text-sm shrink-0"></i>
                                                                        <div className="flex-1">
                                                                            <span className="font-bold text-amber-300">Info File Lokal:</span> Jika YouTube menampilkan <em>Error 153</em>, gunakan file <code>Jalankan_Server_Lokal.bat</code> atau publish ke <strong>GitHub Pages</strong>. AI tetap dapat menganalisis video ini normal!
                                                                        </div>
                                                                        <a
                                                                            href={`https://www.youtube.com/watch?v=` + youtubeId}
                                                                            target="_blank"
                                                                            rel="noopener noreferrer"
                                                                            className="bg-red-600 hover:bg-red-700 text-white font-bold text-[10px] px-2.5 py-1.5 rounded-xl shrink-0 transition-all flex items-center gap-1 shadow-sm"
                                                                        >
                                                                            <span>Tonton di YouTube</span>
                                                                            <i className="fa-solid fa-arrow-up-right-from-square text-[8px]"></i>
                                                                        </a>
                                                                    </div>
                                                                )}

                                                                {/* Pintasan Buka Tab Baru */}
                                                                <div className="absolute bottom-2 right-3 z-20 pointer-events-auto opacity-75 hover:opacity-100 transition-opacity">
                                                                    <a
                                                                        href={`https://www.youtube.com/watch?v=` + youtubeId}
                                                                        target="_blank"
                                                                        rel="noopener noreferrer"
                                                                        className="bg-obsidian/90 hover:bg-red-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg border border-slate-700 flex items-center gap-1.5 shadow-md"
                                                                        title="Buka langsung di YouTube"
                                                                    >
                                                                        <i className="fa-brands fa-youtube text-red-400"></i>
                                                                        <span>Buka di YouTube</span>
                                                                        <i className="fa-solid fa-arrow-up-right-from-square text-[8px]"></i>
                                                                    </a>
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            <video 
                                                                ref={videoRef}
                                                                src={videoUrl} 
                                                                controls 
                                                                className="w-full h-full object-contain"
                                                                onDoubleClick={toggleFullscreen}
                                                                onLoadedMetadata={(e) => setVideoDuration(e.target.duration)}
                                                                onTimeUpdate={(e) => setCurrentTime(e.target.currentTime)}
                                                                onPlay={() => setIsPlaying(true)}
                                                                onPause={() => setIsPlaying(false)}
                                                            />
                                                        )}

                                                        {/* KOTAK-KOTAK MASKING (MERAH: ABAIKAN) & FOKUS (HIJAU: LOWER THIRD / HEADLINE) */}
                                                        {showMasks && masks.map(mask => {
                                                            const isFocus = mask.mode === 'focus';
                                                            return (
                                                                <div
                                                                    key={mask.id}
                                                                    style={{
                                                                        left: `${mask.x}%`,
                                                                        top: `${mask.y}%`,
                                                                        width: `${mask.width}%`,
                                                                        height: `${mask.height}%`
                                                                    }}
                                                                    onMouseDown={(e) => startDragMask(mask.id, e)}
                                                                    onTouchStart={(e) => startDragMask(mask.id, e)}
                                                                    className={`absolute z-30 rounded-xl cursor-move select-none flex flex-col justify-between p-1.5 transition-colors group/mask pointer-events-auto border-2 ${
                                                                        isFocus
                                                                            ? 'bg-emerald-600/30 hover:bg-emerald-600/40 border-emerald-400 shadow-[0_0_18px_rgba(16,185,129,0.4)] backdrop-blur-[0.5px]'
                                                                            : 'bg-red-600/40 hover:bg-red-600/50 border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.35)] backdrop-blur-[0.5px]'
                                                                    }`}
                                                                    title={`Tarik & geser untuk memindahkan. Tarik sudut kanan bawah untuk ubah ukuran (${mask.name})`}
                                                                >
                                                                    {/* Header Kotak Mask: Label & Hapus */}
                                                                    <div className="flex items-center justify-between text-[10px] font-black text-white px-0.5 pointer-events-auto gap-1">
                                                                        <span className={`truncate max-w-[130px] px-2 py-0.5 rounded-md text-[9px] uppercase tracking-wider flex items-center gap-1 shadow-sm border ${
                                                                            isFocus 
                                                                                ? 'bg-emerald-950/90 text-emerald-100 border-emerald-600/80' 
                                                                                : 'bg-red-950/90 text-red-100 border-red-700/80'
                                                                        }`}>
                                                                            <i className={`fa-solid text-[8px] ${isFocus ? 'fa-crosshairs text-emerald-300' : 'fa-ban text-red-300'}`}></i>
                                                                            <span>{mask.name}</span>
                                                                        </span>
                                                                        <div className="flex items-center gap-1 shrink-0">
                                                                            {/* Tombol Cepat Toggle Mode (Hijau Fokus ⟷ Merah Penutup) */}
                                                                            <button
                                                                                onClick={(e) => {
                                                                                    e.stopPropagation();
                                                                                    toggleMaskMode(mask.id);
                                                                                }}
                                                                                className={`px-1.5 py-0.5 rounded text-[8px] font-black transition-all border shadow-sm ${
                                                                                    isFocus 
                                                                                        ? 'bg-emerald-900 hover:bg-red-700 text-emerald-200 hover:text-white border-emerald-600' 
                                                                                        : 'bg-red-900 hover:bg-emerald-700 text-red-200 hover:text-white border-red-600'
                                                                                }`}
                                                                                title={isFocus ? "Ubah jadi Penutup Merah (Diabaikan)" : "Ubah jadi Pusat Fokus Hijau (Headline)"}
                                                                            >
                                                                                {isFocus ? '🟢 Fokus' : '🔴 Tutup'}
                                                                            </button>
                                                                            <button
                                                                                onClick={(e) => {
                                                                                    e.stopPropagation();
                                                                                    deleteMask(mask.id);
                                                                                }}
                                                                                className={`w-4 h-4 rounded-full flex items-center justify-center text-[8px] transition-all border shadow-sm ${
                                                                                    isFocus
                                                                                        ? 'bg-emerald-950 hover:bg-emerald-600 text-emerald-200 hover:text-white border-emerald-700'
                                                                                        : 'bg-red-950 hover:bg-red-600 text-red-200 hover:text-white border-red-700'
                                                                                }`}
                                                                                title="Hapus kotak ini"
                                                                            >
                                                                                <i className="fa-solid fa-xmark"></i>
                                                                            </button>
                                                                        </div>
                                                                    </div>

                                                                    {/* Tengah: Indikator Area */}
                                                                    <div className={`text-center text-[10px] font-black uppercase tracking-widest pointer-events-none drop-shadow ${
                                                                        isFocus ? 'text-emerald-100' : 'text-white/80'
                                                                    }`}>
                                                                        {isFocus ? 'PUSAT FOKUS / HEADLINE' : 'DIABAIKAN'}
                                                                    </div>

                                                                    {/* Sudut Kanan Bawah: Ukuran % & Resize Handle */}
                                                                    <div className="flex items-center justify-between pt-1">
                                                                        <span className="text-[8px] font-mono text-white/80 font-bold px-1 pointer-events-none">
                                                                            {Math.round(mask.width)}% × {Math.round(mask.height)}%
                                                                        </span>
                                                                        <div
                                                                            onMouseDown={(e) => startResizeMask(mask.id, e)}
                                                                            onTouchStart={(e) => startResizeMask(mask.id, e)}
                                                                            className={`resize-handle w-4 h-4 rounded-md cursor-nwse-resize flex items-center justify-center text-[8px] shadow-sm pointer-events-auto transition-colors ${
                                                                                isFocus
                                                                                    ? 'bg-emerald-500 hover:bg-white text-white hover:text-emerald-700'
                                                                                    : 'bg-red-500 hover:bg-white text-white hover:text-red-600'
                                                                            }`}
                                                                            title="Tarik untuk mengubah ukuran kotak (Resize)"
                                                                        >
                                                                            <i className="fa-solid fa-up-right-and-down-left-from-center rotate-90 text-[7px]"></i>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}

                                                        {/* KONTROL OVERLAY SAAT MODE NORMAL (Nav Bar Fleksibel & Anti-Tabrakan) */}
                                                        {!isVideoZoomed && (
                                                            <div className="absolute top-2.5 sm:top-3 left-2.5 sm:left-3 right-2.5 sm:right-3 z-30 flex items-center justify-between gap-1.5 sm:gap-2 flex-wrap pointer-events-none">
                                                                {/* Kiri: TC Badge */}
                                                                <div className="bg-obsidian/90 backdrop-blur-md text-neon font-mono text-[11px] sm:text-xs px-2.5 py-1 sm:py-1.5 rounded-xl border border-slate-700 font-bold pointer-events-auto shadow-md shrink-0 flex items-center gap-1.5">
                                                                    <span className="w-1.5 h-1.5 rounded-full bg-neon animate-pulse"></span>
                                                                    <span>TC: {formatTime(currentTime)} / {formatTime(videoDuration)}</span>
                                                                </div>

                                                                {/* Kanan: Cluster Tombol Aksi (Auto-Wrap & Responsif) */}
                                                                <div className="flex items-center gap-1 sm:gap-1.5 flex-wrap justify-end pointer-events-auto">
                                                                    {/* Tombol Toggle Grafik Rating (TVR & Share) */}
                                                                    <button 
                                                                        onClick={() => {
                                                                            setShowRatingChart(!showRatingChart);
                                                                            notify(showRatingChart ? "Grafik rating ditutup" : "Grafik rating TVR & Share dibuka!");
                                                                        }}
                                                                        className={`text-[10px] sm:text-[11px] px-2 sm:px-2.5 py-1 rounded-xl border font-bold transition-all shadow-md flex items-center gap-1 active:scale-95 ${
                                                                            showRatingChart 
                                                                                ? 'bg-neon text-obsidian border-neon shadow-neon/20 font-black' 
                                                                                : 'bg-obsidian/85 hover:bg-slate-800 text-slate-300 border-slate-700'
                                                                        }`}
                                                                        title="Tampilkan atau sembunyikan grafik performa rating TV (TVR & Share)"
                                                                    >
                                                                        <i className={`fa-solid fa-chart-line text-[10px] ${showRatingChart ? 'text-obsidian' : 'text-neon'}`}></i>
                                                                        <span>Grafik Rating {showRatingChart ? "ON" : "OFF"}</span>
                                                                    </button>

                                                                    {/* Tombol Toggle Masking & Fokus Area Layar */}
                                                                    <button 
                                                                        onClick={() => {
                                                                            setShowMasks(!showMasks);
                                                                            notify(showMasks ? "Area layar (penutup & fokus) disembunyikan" : "Area layar (penutup & fokus) ditampilkan");
                                                                        }}
                                                                        className={`text-[10px] sm:text-[11px] px-2 sm:px-2.5 py-1 rounded-xl border font-bold transition-all shadow-md flex items-center gap-1 active:scale-95 ${
                                                                            showMasks 
                                                                                ? 'bg-slate-900 hover:bg-black text-white border-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.3)] ring-1 ring-emerald-400' 
                                                                                : 'bg-obsidian/85 hover:bg-slate-800 text-slate-300 border-slate-700'
                                                                        }`}
                                                                        title={showMasks ? "Sembunyikan kotak penutup & fokus" : "Tampilkan kotak penutup & fokus"}
                                                                    >
                                                                        <i className="fa-solid fa-vector-square text-[10px] text-emerald-400"></i>
                                                                        <span>Area ({masks.length}) {showMasks ? "ON" : "OFF"}</span>
                                                                    </button>

                                                                    {/* Tombol Layar Penuh Studio (Video + Floating MBM) */}
                                                                    <button 
                                                                        onClick={toggleFullscreen}
                                                                        className="bg-obsidian/85 hover:bg-neon hover:text-obsidian text-white text-[10px] sm:text-[11px] px-2 sm:px-2.5 py-1 rounded-xl border border-slate-700 font-bold transition-all shadow-md flex items-center gap-1 active:scale-95 group/fsbtn"
                                                                        title="Layar Penuh Studio: Video + Tabel MBM Mengambang (F / Double Click)"
                                                                    >
                                                                        <i className="fa-solid fa-expand text-neon group-hover/fsbtn:text-obsidian transition-colors text-[10px]"></i>
                                                                        <span className="hidden xs:inline sm:inline">{t("fullscreen")}</span>
                                                                    </button>

                                                                    <button 
                                                                        onClick={() => setShowUrlInputModal(true)}
                                                                        className="bg-obsidian/85 hover:bg-neon hover:text-obsidian text-white text-[10px] sm:text-[11px] px-2 sm:px-2.5 py-1 rounded-xl border border-slate-700 font-bold transition-all shadow-md flex items-center gap-1 active:scale-95 group/urlbtn"
                                                                        title="Ganti atau masukkan link YouTube / Video URL lain"
                                                                    >
                                                                        <i className="fa-brands fa-youtube text-red-500 group-hover/urlbtn:text-obsidian transition-colors text-[10px]"></i>
                                                                        <span className="hidden sm:inline">Ganti Link</span>
                                                                    </button>

                                                                    <button 
                                                                        onClick={handleRemoveVideo}
                                                                        className="bg-obsidian/85 hover:bg-red-600 text-white text-[10px] sm:text-[11px] px-2 sm:px-2.5 py-1 rounded-xl border border-slate-700 font-bold transition-all shadow-md flex items-center gap-1 active:scale-95 group/del"
                                                                        title="Hapus / Keluarkan video ini dari pemutar"
                                                                    >
                                                                        <i className="fa-solid fa-trash-can text-red-400 group-hover/del:text-white transition-colors text-[10px]"></i>
                                                                        <span className="hidden sm:inline">{t("removeVideo")}</span>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* KONTROL OVERLAY TOP BAR SAAT MODE ZOOM */}
                                                        {isVideoZoomed && (
                                                            <div className="absolute top-4 left-4 right-4 flex items-center justify-between z-40 pointer-events-none">
                                                                {/* Kiri: Judul File & Timecode */}
                                                                <div className="flex items-center gap-3 pointer-events-auto">
                                                                    <div className="bg-obsidian/90 backdrop-blur-md border border-slate-700/80 rounded-2xl px-4 py-2 flex items-center gap-2.5 shadow-2xl text-white">
                                                                        <span className="w-2.5 h-2.5 rounded-full bg-neon animate-pulse"></span>
                                                                        <span className="font-black text-xs sm:text-sm tracking-tight truncate max-w-xs sm:max-w-md">
                                                                            {uploadedFileName}
                                                                        </span>
                                                                        <span className="text-slate-500 font-mono text-xs">•</span>
                                                                        <span className="font-mono text-xs font-bold text-neon bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800">
                                                                            TC: {formatTime(currentTime)} / {formatTime(videoDuration)}
                                                                        </span>
                                                                    </div>
                                                                </div>

                                                                {/* Kanan: Tombol Masking, Buka/Tutup MBM & Keluar Zoom */}
                                                                <div className="flex items-center gap-2.5 pointer-events-auto">
                                                                    {/* Tombol Toggle Grafik Rating di Layar Penuh */}
                                                                    <button 
                                                                        onClick={() => {
                                                                            setShowRatingChart(!showRatingChart);
                                                                            notify(showRatingChart ? "Grafik rating ditutup" : "Grafik rating dibuka!");
                                                                        }}
                                                                        className={`px-3.5 py-2 rounded-2xl text-xs font-black transition-all shadow-xl flex items-center gap-1.5 border ${
                                                                            showRatingChart 
                                                                                ? 'bg-neon text-obsidian border-neon shadow-neon/20 ring-1 ring-neon-dark font-black' 
                                                                                : 'bg-obsidian/90 hover:bg-slate-800 text-slate-300 border-slate-700'
                                                                        }`}
                                                                        title="Tampilkan / Sembunyikan Grafik Performa Rating"
                                                                    >
                                                                        <i className={`fa-solid fa-chart-line text-xs ${showRatingChart ? 'text-obsidian' : 'text-neon'}`}></i>
                                                                        <span>Grafik Rating</span>
                                                                    </button>

                                                                    <button 
                                                                        onClick={() => {
                                                                            setShowMasks(!showMasks);
                                                                            notify(showMasks ? "Area layar (penutup & fokus) disembunyikan" : "Area layar (penutup & fokus) ditampilkan");
                                                                        }}
                                                                        className={`px-3.5 py-2 rounded-2xl text-xs font-black transition-all shadow-xl flex items-center gap-1.5 border ${
                                                                            showMasks 
                                                                                ? 'bg-slate-900 text-white border-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.3)] ring-1 ring-emerald-400' 
                                                                                : 'bg-obsidian/90 hover:bg-slate-800 text-slate-300 border-slate-700'
                                                                        }`}
                                                                        title="Tampilkan / Sembunyikan Kotak Penutup & Fokus di Layar Penuh"
                                                                    >
                                                                        <i className="fa-solid fa-vector-square text-xs text-emerald-400"></i>
                                                                        <span>Area ({masks.length}) {showMasks ? 'ON' : 'OFF'}</span>
                                                                    </button>

                                                                    {mbmRows.length > 0 && (
                                                                        <button 
                                                                            onClick={() => setShowFloatingMbm(!showFloatingMbm)}
                                                                            className={`px-4 py-2 rounded-2xl text-xs font-black transition-all shadow-xl flex items-center gap-2 border ${
                                                                                showFloatingMbm 
                                                                                    ? 'bg-neon text-obsidian border-neon shadow-neon/20 hover:bg-neon-dark scale-[1.02]' 
                                                                                    : 'bg-obsidian/90 hover:bg-slate-800 text-white border-slate-700'
                                                                            }`}
                                                                            title="Buka / Tutup Panel Floating MBM di sebelah kanan"
                                                                        >
                                                                            <i className="fa-solid fa-list-check text-sm"></i>
                                                                            <span>{showFloatingMbm ? t("hideMbm") : t("showMbm")}</span>
                                                                            <span className={`text-[10px] px-1.5 py-0.5 rounded-md font-mono ${showFloatingMbm ? 'bg-black text-neon' : 'bg-slate-800 text-slate-300'}`}>
                                                                                {filteredRows.length}
                                                                            </span>
                                                                        </button>
                                                                    )}

                                                                    {/* Toggle Bahasa di Layar Penuh Zoom (Dinonaktifkan) */}
                                                                    <button 
                                                                        type="button"
                                                                        onClick={() => {
                                                                            const next = lang === "id" ? "en" : "id";
                                                                            setLang(next);
                                                                            localStorage.setItem("mbm_app_lang", next);
                                                                            notify(next === "en" ? "Language: English 🇬🇧" : "Bahasa: Indonesia 🇮🇩");
                                                                        }}
                                                                        style={{ display: 'none' }}
                                                                        className="hidden"
                                                                        title={lang === "id" ? "Switch to English (Bahasa)" : "Ganti ke Bahasa Indonesia"}
                                                                    >
                                                                        <i className="fa-solid fa-globe text-neon text-xs"></i>
                                                                        <span>{lang === "id" ? "ID" : "EN"}</span>
                                                                    </button>
                                                                    <button 
                                                                        onClick={toggleFullscreen}
                                                                        className="bg-obsidian/90 hover:bg-red-600 text-white hover:text-white px-4 py-2 rounded-2xl text-xs font-black border border-slate-700 hover:border-red-500 transition-all shadow-xl flex items-center gap-2 active:scale-95"
                                                                        title="Keluar dari Layar Penuh Zoom (Tekan Esc)"
                                                                    >
                                                                        <i className="fa-solid fa-compress text-sm"></i>
                                                                        <span className="hidden sm:inline">Keluar Zoom</span>
                                                                        <kbd className="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-300">Esc</kbd>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* FLOATING MBM PANEL DI DALAM FRAME VIDEO (DAPAT DI-DRAG KESANA KEMARI & DI-RESIZE UKURANNYA) */}
                                                        {isVideoZoomed && showFloatingMbm && mbmRows.length > 0 && (
                                                            <div 
                                                                style={{
                                                                    width: `${floatingMbmSize.width}px`,
                                                                    height: `${floatingMbmSize.height}px`,
                                                                    maxWidth: '92vw',
                                                                    maxHeight: 'calc(100vh - 120px)',
                                                                    transform: `translate3d(${boxPositions.floatingMbm?.x || 0}px, ${boxPositions.floatingMbm?.y || 0}px, 0)`
                                                                }}
                                                                className="absolute right-4 sm:right-6 top-16 z-40 flex flex-col rounded-3xl overflow-hidden shadow-2xl transition-[opacity,background-color,border-color,box-shadow] duration-200 pointer-events-auto border border-white/15 bg-slate-950/40 backdrop-blur-md opacity-40 hover:opacity-100 hover:bg-slate-950/95 hover:border-slate-700/80 hover:shadow-[0_25px_60px_rgba(0,0,0,0.9)] group/mbm select-none"
                                                            >
                                                                
                                                                {/* Floating Panel Header Bar (Drag Handle untuk Menggeser Box) */}
                                                                <div 
                                                                    onMouseDown={(e) => handleStartDrag('floatingMbm', e)}
                                                                    onTouchStart={(e) => handleStartDrag('floatingMbm', e)}
                                                                    className="p-3.5 px-4 border-b border-white/10 flex items-center justify-between bg-slate-900/50 group-hover/mbm:bg-slate-900/90 transition-colors cursor-grab active:cursor-grabbing select-none"
                                                                    title="Klik & tahan di sini untuk menggeser panel MBM (Drag ke mana saja)"
                                                                >
                                                                    <div className="flex items-center gap-2.5">
                                                                        <div className="flex items-center text-slate-400 group-hover/mbm:text-neon transition-colors" title="Drag Handle">
                                                                            <i className="fa-solid fa-grip-vertical text-xs"></i>
                                                                        </div>
                                                                        <div>
                                                                            <div className="flex items-center gap-2">
                                                                                <span className="w-2.5 h-2.5 rounded-full bg-neon animate-pulse"></span>
                                                                                <h3 className="font-black text-sm text-white tracking-tight">
                                                                                    Tabel Minute-by-Minute
                                                                                </h3>
                                                                            </div>
                                                                            <p className="text-[11px] text-slate-300 font-semibold mt-0.5">
                                                                                {filteredRows.length} {t("mbmSubtitle")}
                                                                            </p>
                                                                        </div>
                                                                    </div>

                                                                    <div className="flex items-center gap-1.5">
                                                                        {(boxPositions.floatingMbm?.x !== 0 || boxPositions.floatingMbm?.y !== 0) && (
                                                                            <button 
                                                                                onClick={() => {
                                                                                    resetBoxPosition('floatingMbm');
                                                                                    notify("Posisi panel MBM dikembalikan!");
                                                                                }}
                                                                                className="w-7 h-7 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 flex items-center justify-center transition-all text-xs"
                                                                                title="Kembalikan posisi panel ke samping kanan"
                                                                            >
                                                                                <i className="fa-solid fa-rotate-left text-[11px]"></i>
                                                                            </button>
                                                                        )}
                                                                        <button 
                                                                            onClick={() => {
                                                                                const next = floatingMbmSize.height <= 300 
                                                                                    ? { width: 440, height: 380 } 
                                                                                    : (floatingMbmSize.height <= 420 ? { width: 480, height: 520 } : { width: 380, height: 260 });
                                                                                setFloatingMbmSize(next);
                                                                                localStorage.setItem('mbm_floating_size_v2', JSON.stringify(next));
                                                                                notify(`Tinggi panel MBM: ${next.height}px`);
                                                                            }}
                                                                            className="w-7 h-7 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 flex items-center justify-center transition-all text-xs"
                                                                            title="Ubah Tinggi Cepat Panel MBM (Pendek / Sedang / Panjang)"
                                                                        >
                                                                            <i className="fa-solid fa-arrows-up-down text-[11px]"></i>
                                                                        </button>
                                                                        <button 
                                                                            onClick={addManualRow}
                                                                            className="p-1.5 px-2.5 rounded-xl bg-neon text-obsidian hover:bg-neon-dark text-[11px] font-black transition-all shadow-sm flex items-center gap-1 active:scale-95"
                                                                            title="Tambah Baris Adegan Baru"
                                                                        >
                                                                            <i className="fa-solid fa-plus text-[10px]"></i>
                                                                            <span>{t("addQuick")}</span>
                                                                        </button>
                                                                        <button 
                                                                            onClick={() => setShowFloatingMbm(false)}
                                                                            className="w-7 h-7 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 flex items-center justify-center transition-all text-xs"
                                                                            title="Sembunyikan Panel MBM"
                                                                        >
                                                                            <i className="fa-solid fa-xmark"></i>
                                                                        </button>
                                                                    </div>
                                                                </div>

                                                                {/* Search Bar di Floating Panel */}
                                                                <div className="p-2.5 px-3 bg-slate-900/30 group-hover/mbm:bg-slate-900/80 border-b border-white/10 transition-colors">
                                                                    <div className="relative w-full">
                                                                        <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                                                        <input 
                                                                            type="text"
                                                                            value={searchTerm}
                                                                            onChange={(e) => setSearchTerm(e.target.value)}
                                                                            placeholder={t("searchPlaceholder")}
                                                                            className="w-full bg-slate-800/60 focus:bg-slate-800 border border-white/10 rounded-xl pl-8 pr-3 py-1.5 text-xs text-white placeholder-slate-400 font-bold outline-none focus:border-neon transition-colors"
                                                                        />
                                                                        {searchTerm && (
                                                                            <button onClick={() => setSearchTerm("")} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">
                                                                                <i className="fa-solid fa-circle-xmark"></i>
                                                                            </button>
                                                                        )}
                                                                    </div>
                                                                </div>

                                                                {/* HEADER TABEL MBM GELAP */}
                                                                <div className="grid grid-cols-12 bg-black/60 group-hover/mbm:bg-black/90 text-neon py-2 px-3.5 text-xs font-black tracking-wide border-b border-white/10 shrink-0 transition-colors">
                                                                    <div className="col-span-5 flex items-center">
                                                                        <span className="text-[11px] font-black text-neon">{t("timeRange")}</span>
                                                                    </div>
                                                                    <div className="col-span-7 flex items-center justify-between">
                                                                        <span className="text-[11px] font-black text-white">{t("sceneDescription")}</span>
                                                                    </div>
                                                                </div>

                                                                {/* DAFTAR BARIS MBM SCROLLABLE */}
                                                                <div className="divide-y divide-white/5 overflow-y-auto custom-scroll flex-1 bg-slate-950/40 group-hover/mbm:bg-slate-950/90 transition-colors">
                                                                    {filteredRows.length === 0 ? (
                                                                        searchTerm.trim() ? (
                                                                            <div className="text-center py-10 text-slate-400 text-xs font-bold">
                                                                                Tidak ada adegan yang cocok.
                                                                            </div>
                                                                        ) : (
                                                                            <div className="text-center py-10 px-4 text-slate-400 text-xs font-medium space-y-1.5">
                                                                                <i className="fa-solid fa-film text-xl text-slate-500 mb-1 block"></i>
                                                                                <p className="font-bold text-slate-200">Belum ada segmen</p>
                                                                                <p className="text-[10px] text-slate-400">Klik + Tambah Cepat untuk baris baru</p>
                                                                            </div>
                                                                        )
                                                                    ) : (
                                                                        filteredRows.map((row, idx) => {
                                                                            const parts = row.rentangWaktu.split('-');
                                                                            let isActiveSegment = false;
                                                                            if (parts.length === 2) {
                                                                                const start = parseTimeToSeconds(parts[0]);
                                                                                const end = parseTimeToSeconds(parts[1]);
                                                                                isActiveSegment = currentTime >= start && currentTime < end;
                                                                            }

                                                                            return (
                                                                                <div 
                                                                                    key={row.id}
                                                                                    className={`grid grid-cols-12 py-3 px-3 transition-all group/row items-start gap-2.5 ${
                                                                                        isActiveSegment
