                                                                notify(includeAudioDialog ? "Transkrip dialog suara dinonaktifkan (hanya visual)" : "Transkrip dialog suara diaktifkan (visual + audio)!");
                                                            }}
                                                            className={`text-[10px] font-black px-3 py-1.5 rounded-xl border transition-all flex items-center gap-1.5 shadow-sm active:scale-95 ${
                                                                includeAudioDialog
                                                                    ? 'bg-obsidian text-neon border-obsidian ring-1 ring-neon/40 shadow-sm'
                                                                    : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'
                                                            }`}
                                                            title="Aktifkan atau nonaktifkan pendeteksian dialog/suara oleh AI Gemini"
                                                        >
                                                            <span>{includeAudioDialog ? 'DIALOG AKTIF' : 'VISUAL SAJA'}</span>
                                                        </button>
                                                    </div>

                                                    <p className="text-[10.5px] text-slate-600 leading-relaxed pl-1">
                                                        AI Gemini akan <strong>mendengarkan percakapan audio</strong> dari tayangan dan menyusun kutipan narasumber/tokoh yang berbicara tepat di bawah deskripsi visual adegan.
                                                    </p>

                                                    {/* Status Audio & Opsi File Terpisah */}
                                                    <div className="flex items-center justify-between pt-1 border-t border-limeBorder/60">
                                                        <div className="text-[10px] text-slate-600 font-medium">
                                                            <span className="truncate max-w-[200px]">
                                                                {audioFile ? `Audio Terpisah: ${audioFile.name}` : (videoFile ? 'Audio bawaan dari video siap digunakan' : 'Menunggu video / file audio')}
                                                            </span>
                                                        </div>
                                                        <div className="flex items-center gap-1.5">
                                                            {audioFile && (
                                                                <button
                                                                    type="button"
                                                                    onClick={() => {
                                                                        setAudioFile(null);
                                                                        notify("Audio terpisah dilepas, kembali ke audio bawaan video.");
                                                                    }}
                                                                    className="text-[9px] text-red-500 hover:underline font-bold"
                                                                >
                                                                    Lepas
                                                                </button>
                                                            )}
                                                            <button
                                                                type="button"
                                                                onClick={() => audioInputRef.current?.click()}
                                                                className="text-[10px] text-slate-800 hover:text-black font-bold bg-white hover:bg-lime-50 border border-slate-200 hover:border-limeBorder rounded-lg px-2.5 py-1 transition-all"
                                                                title="Unggah audio MP3/WAV terpisah jika video berukuran sangat besar"
                                                            >
                                                                {audioFile ? 'Ganti File Audio' : '+ Audio Terpisah (Opsional)'}
                                                            </button>
                                                            <input
                                                                type="file"
                                                                ref={audioInputRef}
                                                                onChange={(e) => {
                                                                    const f = e.target.files?.[0];
                                                                    if (f) {
                                                                        setAudioFile(f);
                                                                        notify(`File audio "${f.name}" berhasil dipilih!`);
                                                                    }
                                                                }}
                                                                accept="audio/*"
                                                                className="hidden"
                                                            />
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* KECEPATAN & ARSITEKTUR GENERATE MBM */}
                                                <div className="bg-[#f4fce3]/60 border border-limeBorder rounded-2xl p-3.5 space-y-2.5">
                                                    <div className="flex items-center justify-between">
                                                        <div>
                                                            <span className="text-[11px] font-black text-slate-900 uppercase tracking-wider block">
                                                                KECEPATAN GENERATE MBM
                                                            </span>
                                                            <span className="text-[10px] text-slate-600 font-medium">
                                                                Solusi Monitoring Cepat Pengganti Proses Manual
                                                            </span>
                                                        </div>
                                                        <span className="text-[9px] font-black uppercase tracking-wider text-obsidian bg-limeBorder px-2.5 py-0.5 rounded-full flex items-center gap-1.5">
                                                            <span className="w-1.5 h-1.5 rounded-full bg-lime-700 animate-pulse"></span>
                                                            {generationSpeedMode === 'turbo' ? 'Mode Kilat (5–10s)' : 'Audio Paralel (15–25s)'}
                                                        </span>
                                                    </div>

                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                        <button
                                                            type="button"
                                                            onClick={() => {
                                                                setGenerationSpeedMode('turbo');
                                                                localStorage.setItem('mbm_speed_mode', 'turbo');
                                                                notify("Mode Kilat Turbo aktif: Seluruh tayangan dianalisis sekaligus (5–10 detik)!");
                                                            }}
                                                            className={`p-3 rounded-xl border text-left transition-all flex flex-col justify-between gap-1.5 active:scale-95 ${
                                                                generationSpeedMode === 'turbo'
                                                                    ? 'bg-obsidian text-white border-obsidian ring-2 ring-neon shadow-md scale-[1.01]'
                                                                    : 'bg-white hover:bg-[#f4fce3]/50 text-slate-700 border-slate-200 hover:border-limeBorder'
                                                            }`}
                                                        >
                                                            <div className="flex items-center justify-between">
                                                                <span className={`text-xs font-black ${generationSpeedMode === 'turbo' ? 'text-neon' : 'text-slate-900'}`}>
                                                                    Mode Kilat Turbo
                                                                </span>
                                                                <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-md ${
                                                                    generationSpeedMode === 'turbo' ? 'bg-neon text-obsidian' : 'bg-limePill text-limeText'
                                                                }`}>
                                                                    Rekomendasi
                                                                </span>
                                                            </div>
                                                            <p className={`text-[10px] leading-tight ${generationSpeedMode === 'turbo' ? 'text-slate-300' : 'text-slate-500'}`}>
                                                                <strong>5–10 Detik Selesai:</strong> Multi-frame single pass. Mengirim semua menit sekaligus dalam 1 panggilan AI. Sangat cepat & efisien.
                                                            </p>
                                                        </button>

                                                        <button
                                                            type="button"
                                                            onClick={() => {
                                                                setGenerationSpeedMode('parallel');
                                                                localStorage.setItem('mbm_speed_mode', 'parallel');
                                                                notify("Mode Audio Paralel aktif: 4 Worker serentak mendengarkan percakapan!");
                                                            }}
                                                            className={`p-3 rounded-xl border text-left transition-all flex flex-col justify-between gap-1.5 active:scale-95 ${
                                                                generationSpeedMode === 'parallel'
                                                                    ? 'bg-obsidian text-white border-obsidian ring-2 ring-neon shadow-md scale-[1.01]'
                                                                    : 'bg-white hover:bg-[#f4fce3]/50 text-slate-700 border-slate-200 hover:border-limeBorder'
                                                            }`}
                                                        >
                                                            <div className="flex items-center justify-between">
                                                                <span className={`text-xs font-black ${generationSpeedMode === 'parallel' ? 'text-neon' : 'text-slate-900'}`}>
                                                                    Audio Paralel (4x)
                                                                </span>
                                                                <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-md ${
                                                                    generationSpeedMode === 'parallel' ? 'bg-neon text-obsidian' : 'bg-slate-100 text-slate-600'
                                                                }`}>
                                                                    15–25 Detik
                                                                </span>
                                                            </div>
                                                            <p className={`text-[10px] leading-tight ${generationSpeedMode === 'parallel' ? 'text-slate-300' : 'text-slate-500'}`}>
                                                                <strong>15–25 Detik:</strong> 4 Worker paralel serentak mendengarkan cuplikan audio untuk transkrip dialog suara langsung dari tayangan.
                                                            </p>
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* Pilihan Interval MBM: 1 Menit, 5 Menit, 10 Menit, 30 Menit, 1 Jam */}
                                                <div className="space-y-1.5">
                                                    <div className="flex items-center justify-between">
                                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">INTERVAL MBM</label>
                                                        <span className="text-[10px] font-bold text-slate-500">
                                                            Terpilih: {intervalOptions.find(o => o.value === intervalMinutes)?.desc || `${intervalMinutes}m`}
                                                        </span>
                                                    </div>

                                                        {intervalOptions.map((opt) => (
                                                            <button
                                                                key={opt.value}
                                                                onClick={() => setIntervalMinutes(opt.value)}
                                                                className={`py-2.5 rounded-xl text-xs font-black transition-all border ${
                                                                    intervalMinutes === opt.value 
                                                                        ? 'bg-obsidian text-neon border-obsidian shadow-sm scale-[1.02]' 
                                                                        : 'bg-[#f8fafc] text-slate-600 border-slate-200 hover:bg-slate-100'
                                                                }`}
                                                                title={opt.desc}
                                                            >
                                                                {opt.label}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* Pilihan Model & Fitur Gemini Rekomendasi (Tombol Rekomendasi) */}
                                                <div className="space-y-2.5 pt-2 border-t border-slate-100">
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center gap-1.5">
                                                            <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">
                                                                FITUR & MODEL AI GEMINI
                                                            </label>
                                                            <span className="text-[9px] font-bold text-slate-400">• Pilih Tombol Rekomendasi</span>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            {apiKey && apiKey.trim().length >= 8 ? (
                                                                <span className="text-[9px] font-black uppercase tracking-wider text-obsidian bg-neon px-2.5 py-0.5 rounded-full flex items-center gap-1.5 shadow-sm">
                                                                    <span className="w-1.5 h-1.5 rounded-full bg-obsidian-dark animate-pulse"></span>
                                                                    AI Aktif
                                                                </span>
                                                            ) : (
                                                                <span className="text-[9px] font-black uppercase tracking-wider text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full">
                                                                    Mode Demo
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>

                                                    {/* GRID BUTTON REKOMENDASI FITUR GEMINI (Sesuai Permintaan User) */}
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                        {geminiModelOptions.map((opt) => (
                                                            <button
                                                                key={opt.id}
                                                                type="button"
                                                                onClick={() => {
                                                                    setSelectedModel(opt.id);
                                                                    localStorage.setItem('mbm_model', opt.id);
                                                                    notify(`Model ${opt.name} dipilih`);
                                                                }}
                                                                className={`p-3 rounded-2xl text-left transition-all border flex flex-col justify-between gap-1.5 ${
                                                                    selectedModel === opt.id
                                                                        ? 'bg-obsidian text-white border-obsidian shadow-md ring-2 ring-neon/60 scale-[1.01]'
                                                                        : 'bg-[#f8fafc] hover:bg-slate-100 border-slate-200 text-slate-700'
                                                                }`}
                                                            >
                                                                <div className="flex items-center justify-between gap-1 w-full">
                                                                    <span className={`text-xs font-black tracking-tight ${selectedModel === opt.id ? 'text-neon' : 'text-slate-900'}`}>
                                                                        {opt.name}
                                                                    </span>
                                                                    <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-md ${
                                                                        selectedModel === opt.id 
                                                                            ? 'bg-neon text-obsidian' 
                                                                            : opt.isRecommended ? 'bg-limePill text-limeText border border-limeBorder' : 'bg-slate-200 text-slate-600'
                                                                    }`}>
                                                                        {opt.badge}
                                                                    </span>
                                                                </div>
                                                                <p className={`text-[10px] leading-tight line-clamp-2 ${selectedModel === opt.id ? 'text-slate-300' : 'text-slate-500'}`}>
                                                                    {opt.desc}
                                                                </p>
                                                            </button>
                                                        ))}
                                                    </div>

                                                    {/* Tombol Deteksi Otomatis & Status Model Aktif */}
                                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 pt-1">
                                                        <button
                                                            type="button"
                                                            onClick={handleCheckAvailableModels}
                                                            disabled={isCheckingModels || !apiKey}
                                                            className={`text-[10px] font-black flex items-center gap-1.5 py-1.5 px-3 rounded-xl border transition-all ${
                                                                apiKey 
                                                                    ? 'text-slate-900 bg-[#f4fce3] hover:bg-[#eaf9cc] border-limeBorder hover:border-lime-400 shadow-sm active:scale-95' 
                                                                    : 'text-slate-400 border-slate-200 bg-slate-50 cursor-not-allowed'
                                                            }`}
                                                            title="Panggil ModelService.ListModels untuk mendeteksi semua model yang aktif di API Key Anda"
                                                        >
                                                            {isCheckingModels && (
                                                                <i className="fa-solid fa-spinner animate-spin text-[10px]"></i>
                                                            )}
                                                            <span>{isCheckingModels ? 'Mengecek Model...' : 'Deteksi Model API Key Otomatis'}</span>
                                                        </button>

                                                        <div className="text-[10px] text-slate-500 font-medium flex items-center gap-1">
                                                            <span>Model Terpilih:</span>
                                                            <span className="font-mono font-bold text-obsidian bg-slate-100 px-2 py-0.5 rounded-md border border-slate-200">
                                                                {selectedModel}
                                                            </span>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Gemini API Key */}
                                                <div className="space-y-1.5">
