                                                            type="button"
                                                            onClick={() => addMask('logo')}
                                                            className="p-2 rounded-xl bg-white hover:bg-red-50/80 border border-red-200 text-slate-800 hover:text-red-900 text-[10.5px] font-bold transition-all shadow-sm flex items-center gap-1.5 hover:border-red-300 active:scale-95 text-left"
                                                            title="Tutup area Logo stasiun TV dan Jam di kiri atas layar"
                                                        >
                                                            <div className="w-4 h-4 rounded bg-red-100 text-red-600 flex items-center justify-center shrink-0 text-[9px]">
                                                                <i className="fa-solid fa-tv"></i>
                                                            </div>
                                                            <span className="font-black text-xs truncate">Logo / Jam TV</span>
                                                        </button>

                                                        <button
                                                            type="button"
                                                            onClick={() => addMask('qrcode')}
                                                            className="p-2 rounded-xl bg-white hover:bg-red-50/80 border border-red-200 text-slate-800 hover:text-red-900 text-[10.5px] font-bold transition-all shadow-sm flex items-center gap-1.5 hover:border-red-300 active:scale-95 text-left"
                                                            title="Tutup area QR Code di kanan bawah layar"
                                                        >
                                                            <div className="w-4 h-4 rounded bg-red-100 text-red-600 flex items-center justify-center shrink-0 text-[9px]">
                                                                <i className="fa-solid fa-qrcode"></i>
                                                            </div>
                                                            <span className="font-black text-xs truncate">QR Code</span>
                                                        </button>

                                                        <button
                                                            type="button"
                                                            onClick={() => addMask('promo')}
                                                            className="p-2 rounded-xl bg-white hover:bg-red-50/80 border border-red-200 text-slate-800 hover:text-red-900 text-[10.5px] font-bold transition-all shadow-sm flex items-center gap-1.5 hover:border-red-300 active:scale-95 text-left"
                                                            title="Tutup promo program / tayang nanti di kanan atas layar"
                                                        >
                                                            <div className="w-4 h-4 rounded bg-red-100 text-red-600 flex items-center justify-center shrink-0 text-[9px]">
                                                                <i className="fa-solid fa-bullhorn"></i>
                                                            </div>
                                                            <span className="font-black text-xs truncate">Promo Program</span>
                                                        </button>

                                                        <button
                                                            type="button"
                                                            onClick={() => addMask('custom', 'exclusion')}
                                                            className="p-2 rounded-xl bg-white hover:bg-red-50/80 border border-red-200 text-slate-800 hover:text-red-900 text-[10.5px] font-bold transition-all shadow-sm flex items-center gap-1.5 hover:border-red-300 active:scale-95 text-left"
                                                            title="Tambahkan kotak penutup merah bebas"
                                                        >
                                                            <div className="w-4 h-4 rounded bg-red-100 text-red-600 flex items-center justify-center shrink-0 text-[9px]">
                                                                <i className="fa-solid fa-plus"></i>
                                                            </div>
                                                            <span className="font-black text-xs truncate">+ Kotak Merah</span>
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* AKSI RESET & HAPUS */}
                                                <div className="pt-2 border-t border-slate-200 flex items-center justify-between gap-2 flex-wrap">
                                                    <button
                                                        type="button"
                                                        onClick={resetMasksToDefault}
                                                        className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-[10px] font-bold transition-all shadow-sm flex items-center gap-1.5 active:scale-95"
                                                        title="Kembalikan konfigurasi area layar ke preset standar (Lower Third Fokus + QR & Logo Penutup)"
                                                    >
                                                        <i className="fa-solid fa-rotate-left text-slate-600 text-[9px]"></i>
                                                        <span>Reset Preset Standar (Fokus + Penutup)</span>
                                                    </button>

                                                    {masks.length > 0 && (
                                                        <button
                                                            type="button"
                                                            onClick={clearAllMasks}
                                                            className="text-[10px] font-bold text-red-600 hover:text-red-800 hover:underline flex items-center gap-1 transition-colors"
                                                            title="Hapus semua kotak area layar"
                                                        >
                                                            <i className="fa-solid fa-trash-can text-[9px]"></i>
                                                            <span>Hapus Semua ({masks.length})</span>
                                                        </button>
                                                    )}
                                                </div>

                                                {/* Daftar Kotak yang Sedang Aktif */}
                                                <div className="pt-2 border-t border-slate-200">
                                                    <div className="flex items-center justify-between mb-2">
                                                        <span className="text-[10px] font-extrabold text-slate-800 uppercase tracking-wider">
                                                            DAFTAR KOTAK AKTIF ({masks.length})
                                                        </span>
                                                        <span className="text-[10px] font-medium text-slate-500">
                                                            🟢 {masks.filter(m => m.mode === 'focus').length} Fokus • 🔴 {masks.filter(m => m.mode !== 'focus').length} Penutup
                                                        </span>
                                                    </div>

                                                    {masks.length === 0 ? (
                                                        <div className="p-3 rounded-xl bg-white border border-dashed border-slate-300 text-center text-[11px] text-slate-500 font-medium">
                                                            Belum ada kotak area aktif. Klik tombol preset di atas untuk menambahkan.
                                                        </div>
                                                    ) : (
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                            {masks.map((mask) => {
                                                                const isFocus = mask.mode === 'focus';
                                                                return (
                                                                    <div
                                                                        key={mask.id}
                                                                        className={`border rounded-xl p-2.5 px-3 flex items-center justify-between shadow-sm transition-colors ${
                                                                            isFocus 
                                                                                ? 'bg-emerald-50/60 border-emerald-200 hover:border-emerald-400' 
                                                                                : 'bg-red-50/60 border-red-200 hover:border-red-400'
                                                                        }`}
                                                                    >
                                                                        <div className="flex items-center gap-2 overflow-hidden">
                                                                            <span className={`w-3 h-3 rounded-full shrink-0 ${isFocus ? 'bg-emerald-500' : 'bg-red-500'}`}></span>
                                                                            <div className="truncate">
                                                                                <span className="font-black text-xs text-slate-900 block truncate">
                                                                                    {mask.name}
                                                                                </span>
                                                                                <span className={`text-[9px] font-bold uppercase tracking-wider ${isFocus ? 'text-emerald-700' : 'text-red-700'}`}>
                                                                                    {isFocus ? '🟢 Pusat Fokus (Headline)' : '🔴 Penutup (Diabaikan)'}
                                                                                </span>
                                                                            </div>
                                                                        </div>
                                                                        <div className="flex items-center gap-1.5 shrink-0 ml-2">
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => toggleMaskMode(mask.id)}
                                                                                className={`px-2 py-1 rounded-lg text-[9px] font-black border transition-all ${
                                                                                    isFocus 
                                                                                        ? 'bg-white hover:bg-red-50 text-slate-700 border-slate-300' 
                                                                                        : 'bg-white hover:bg-emerald-50 text-slate-700 border-slate-300'
                                                                                }`}
                                                                                title="Ganti tipe antara Fokus Hijau atau Penutup Merah"
                                                                            >
                                                                                {isFocus ? 'Ubah 🔴' : 'Ubah 🟢'}
                                                                            </button>
                                                                            <button
                                                                                type="button"
                                                                                onClick={() => deleteMask(mask.id)}
                                                                                className="w-6 h-6 rounded-lg bg-white hover:bg-red-600 text-slate-400 hover:text-white border border-slate-200 hover:border-red-600 flex items-center justify-center transition-all text-xs"
                                                                                title="Hapus kotak ini"
                                                                            >
                                                                                <i className="fa-solid fa-xmark"></i>
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>


                                        </>
                                    )}

                                </div>
                            ) : (
                                <button 
                                    onClick={() => {
                                        setIsToolsVisible(true);
                                        setIsToolsCollapsed(false);
                                        notify("Box Settingan dibuka kembali");
                                    }}
                                    className="w-full py-4 px-6 rounded-2xl border-2 border-dashed border-slate-300 hover:border-slate-400 bg-white/80 hover:bg-white text-slate-600 hover:text-slate-900 text-xs font-black flex items-center justify-center gap-2.5 transition-all shadow-sm group"
                                >
                                    <i className="fa-solid fa-sliders text-blue-600 group-hover:scale-110 transition-transform"></i>
                                    <span>Buka Kembali Box Settingan & Parameter</span>
                                </button>
                            )}

                        </div>

                        {/* ===================================================== */}
                        {/* KOLOM KANAN (5 Kolom): ATTACHMENT 2 - DAFTAR TABEL MBM*/}
                        {/* (SEPERTI YOUTUBE PLAYLIST / CHAPTERS DI SEBELAH KANAN) */}
                        {/* ===================================================== */}
                        <div className="col-span-12 lg:col-span-5 flex flex-col gap-6 sticky top-20">
                            {isMbmVisible ? (
                                <div 
                                    style={{
                                        transform: `translate3d(${boxPositions.mbm.x}px, ${boxPositions.mbm.y}px, 0)`,
                                        zIndex: zIndices.mbm
                                    }}
                                    onMouseDown={() => bringToFront('mbm')}
                                    className="bg-white rounded-3xl border border-slate-200/90 shadow-[0_10px_35px_rgba(0,0,0,0.04)] p-6 sm:p-7 flex flex-col gap-4 relative overflow-hidden transition-shadow"
                                >
                                    
                                    {/* Watermark samar di kanan bawah */}
                                    <div className="absolute right-4 bottom-2 text-2xl font-black text-slate-200/60 select-none pointer-events-none tracking-wider">
                                        {watermarkText}
                                    </div>

                                    {/* Mac OS Window Dots & Action Buttons (Drag Handle) */}
                                    <div 
                                        onMouseDown={(e) => handleStartDrag('mbm', e)}
                                        onTouchStart={(e) => handleStartDrag('mbm', e)}
                                        className="flex items-center justify-between pb-2 border-b border-slate-100 cursor-grab active:cursor-grabbing select-none"
                                        title="Klik & tahan di sini untuk menggeser box Tabel MBM (Drag)"
                                    >
                                        <div className="window-dots">
                                            <div className="window-dot"></div>
                                            <div className="window-dot"></div>
                                            <div className="window-dot"></div>
                                        </div>


                                        <div className="flex items-center gap-1.5 text-slate-400 text-xs">
                                            <button 
                                                onClick={() => {
                                                    resetBoxPosition('mbm');
                                                    notify("Posisi Box Tabel MBM dikembalikan ke awal!");
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-slate-100 hover:text-slate-800 flex items-center justify-center transition-all"
                                                title="Kembalikan posisi awal box Tabel MBM"
                                            >
                                                <i className="fa-solid fa-rotate-left"></i>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    setIsMbmCollapsed(!isMbmCollapsed);
                                                    notify(isMbmCollapsed ? "Tabel MBM diperluas" : "Tabel MBM diminimalkan");
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-slate-100 hover:text-slate-800 flex items-center justify-center transition-all"
                                                title={isMbmCollapsed ? "Perbesar Tabel MBM" : "Kecilkan / Minimize Tabel MBM"}
                                            >
                                                <i className={`fa-solid ${isMbmCollapsed ? 'fa-plus' : 'fa-minus'}`}></i>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    setIsMbmVisible(false);
                                                    notify("Daftar Tabel MBM disembunyikan. Klik tombol untuk membuka kembali.");
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-red-50 hover:text-red-500 flex items-center justify-center transition-all"
                                                title="Tutup / Sembunyikan Tabel MBM"
                                            >
                                                <i className="fa-solid fa-xmark"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Jika Diminimalkan */}
                                    {isMbmCollapsed ? (
                                        <div 
                                            onClick={() => setIsMbmCollapsed(false)}
                                            className="py-1 flex items-center justify-between text-xs font-bold text-slate-500 cursor-pointer hover:text-slate-800 transition-colors"
                                        >
                                            <div className="flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-blue-600"></span>
                                                <span>Hasil MBM: {filteredRows.length} Segmen Terdata</span>
                                            </div>
                                            <span className="text-blue-600 text-[11px] font-black hover:underline flex items-center gap-1">
                                                <span>Buka Penuh Tabel</span>
                                                <i className="fa-solid fa-chevron-down text-[9px]"></i>
                                            </span>
                                        </div>
                                    ) : (
                                        <>
                                            {/* Header Judul Box Kanan */}
                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <div>
                                        <h3 className="font-black text-lg text-slate-900 tracking-tight">
                                            <span>{t("mbmResult")}</span>
                                        </h3>
                                        <p className="text-xs text-slate-400 font-semibold mt-0.5 flex items-center gap-2 flex-wrap">
                                            <span>{t("totalSegments")}: {filteredRows.length}</span>
                                            {lastGenerationDuration && (
                                                <span className="text-[10px] font-mono text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200 font-bold flex items-center gap-1 shadow-sm" title="Durasi pengerjaan proses generate AI terakhir hingga 100% selesai">
                                                    <i className="fa-solid fa-stopwatch text-emerald-600 text-[10px]"></i>
                                                    <span>{lastGenerationDuration.formattedTime} ({lastGenerationDuration.formattedTimer})</span>
                                                </span>
                                            )}
                                        </p>
                                    </div>

                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={handleGenerateMBM}
                                            disabled={isGenerating}
                                            className="bg-neon hover:bg-neon-dark text-obsidian text-xs font-black px-4 py-2 rounded-xl transition-all shadow-sm flex items-center gap-2 active:scale-95"
                                            title={generationSpeedMode === 'turbo' ? "Generate MBM Kilat (5–10 detik)" : "Generate MBM Audio Paralel (15–25 detik)"}
                                        >
                                            {isGenerating ? (
                                                <i className="fa-solid fa-spinner animate-spin text-xs"></i>
                                            ) : (
                                                null
                                            )}
                                            <span>{generationSpeedMode === "turbo" ? t("generateAiTurbo") : t("generateAiParallel")}</span>
                                        </button>
                                    </div>
                                </div>

                                {/* TOOLBAR PENCARIAN & AKSI MBM (Persis Header Attachment 2) */}
                                <div className="flex flex-col sm:flex-row items-center justify-between gap-2.5">
                                    <div className="relative w-full sm:flex-1">
                                        <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                        <input 
                                            type="text"
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            placeholder={t("searchPlaceholderFull")}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-800 font-bold outline-none focus:bg-white focus:border-slate-400"
                                        />
                                    </div>

                                    <div className="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
                                        <button 
                                            onClick={() => setShowRatingModal(true)}
                                            className="bg-[#f4fce3] hover:bg-[#eaf9cc] text-slate-900 border border-limeBorder text-[11px] font-black px-3.5 py-2 rounded-xl transition-all shadow-sm shrink-0 active:scale-95 flex items-center justify-center"
                                            title="Tempel atau impor data TVR, Share, dan Unit dari Excel Nielsen"
                                        >
                                            
                                            <span>{t("pasteNielsen")}</span>
                                        </button>

                                        <button 
                                            onClick={addManualRow}
                                            className="bg-obsidian hover:bg-black text-neon text-[11px] font-black px-3.5 py-2 rounded-xl transition-all shadow-sm shrink-0 active:scale-95 flex items-center gap-1.5"
                                            title="Tambah baris segmen adegan baru secara manual"
                                        >
                                            <i className="fa-solid fa-plus text-[10px]"></i>
                                            <span>{t("addSegment")}</span>
                                        </button>
                                    </div>
                                </div>

                                {/* TABEL MBM PERSIS ATTACHMENT 2 DENGAN BADGE RATING LENGKAP */}
                                <div className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm bg-white">
                                    
                                    {/* Header Tabel MBM Gelap */}
                                    <div className="grid grid-cols-12 bg-obsidian text-white py-3 px-3.5 text-xs font-black tracking-wide border-b border-slate-800">
                                        <div className="col-span-5 flex items-center justify-between text-neon pr-2">
                                            <span className="text-[11px]">Rentang Waktu & Rating</span>
                                            <button 
                                                onClick={() => setIsAutoScrollMbm(!isAutoScrollMbm)}
                                                className={`text-[9px] font-bold px-1.5 py-0.5 rounded transition-all ${
                                                    isAutoScrollMbm ? 'bg-neon/20 text-neon' : 'bg-slate-800 text-slate-400'
                                                }`}
                                                title="Auto-scroll tabel mengikuti video yang sedang berjalan"
                                            >
                                                Auto-Scroll: {isAutoScrollMbm ? 'ON' : 'OFF'}
                                            </button>
                                        </div>
                                        <div className="col-span-7 flex items-center justify-between">
                                            <span className="text-[11px]">Deskripsi Adegan & Dialog</span>
                                        </div>
                                    </div>

                                    {/* Daftar Baris Adegan MBM (Scrollable seperti Playlist YouTube) */}
                                    <div ref={mbmListRef} className="divide-y divide-slate-100 max-h-[600px] overflow-y-auto custom-scroll">
                                        {filteredRows.length === 0 ? (
                                            searchTerm.trim() ? (
                                                <div className="text-center py-12 text-slate-400 text-xs font-bold">
                                                    Tidak ada adegan yang cocok dengan pencarian "{searchTerm}".
                                                </div>
                                            ) : (
                                                <div className="text-center py-12 px-4 text-slate-400 text-xs font-medium space-y-2">
                                                    <div className="w-12 h-12 mx-auto rounded-2xl bg-slate-100 flex items-center justify-center text-slate-400 text-lg mb-2">
                                                        <i className="fa-solid fa-film"></i>
                                                    </div>
                                                    <p className="font-bold text-slate-700 text-sm">Belum ada data segmen MBM</p>
                                                    <p className="text-[11px] text-slate-400 max-w-sm mx-auto leading-relaxed">
                                                        Unggah video lokal atau masukkan link YouTube, lalu klik <strong>Generate AI</strong> untuk menganalisis adegan otomatis, atau klik <strong>+ Tambah Baris MBM</strong> untuk membuat baris manual.
                                                    </p>
                                                </div>
                                            )
                                        ) : (
                                            filteredRows.map((row, idx) => {
                                                const isRowActive = row.id === activeRowId;
                                                return (
                                                    <div 
                                                        key={row.id}
                                                        ref={(el) => { if (el) rowRefs.current[row.id] = el; }}
                                                        className={`grid grid-cols-12 py-3 px-3 transition-all group items-start gap-2.5 ${
                                                            isRowActive 
                                                                ? 'bg-[#f4fce3] border-l-4 border-neon shadow-md ring-1 ring-limeBorder scale-[1.008]' 
                                                                : 'hover:bg-slate-50'
                                                        }`}
                                                    >
                                                        {/* Kolom Rentang Waktu + Metrik TVR/Share/Unit + Tombol Play Segmen */}
                                                        <div className="col-span-5 space-y-1.5">
                                                            <div className="flex items-center gap-1.5 flex-wrap">
                                                                <span className={`w-4 h-4 rounded font-black text-[9px] flex items-center justify-center shrink-0 ${
                                                                    isRowActive ? 'bg-neon text-obsidian shadow-sm' : 'bg-slate-100 text-slate-500'
                                                                }`}>
                                                                    {idx + 1}
                                                                </span>
                                                                <input 
                                                                    type="text"
                                                                    value={row.rentangWaktu}
                                                                    onChange={(e) => updateRow(row.id, 'rentangWaktu', e.target.value)}
                                                                    className="font-mono text-[11px] font-black text-slate-800 bg-transparent border-b border-transparent focus:border-slate-400 outline-none w-24"
                                                                />
                                                                {isRowActive && (
                                                                    <span className="text-[8px] font-black uppercase text-obsidian bg-neon px-1.5 py-0.5 rounded-full flex items-center gap-1 shadow-sm animate-pulse">
                                                                        <span className="w-1.5 h-1.5 rounded-full bg-obsidian-dark"></span>
                                                                        Sedang Tayang
                                                                    </span>
                                                                )}
                                                            </div>

                                                            {/* Rating Badges: TVR, Share, Unit (Hanya jika ada data rating) */}
                                                            {(row.tvr !== undefined || row.share !== undefined || row.unit !== undefined) && (
                                                                <div className="flex items-center gap-1 flex-wrap">
                                                                    {row.tvr !== undefined && row.tvr !== null && row.tvr !== "" && (
                                                                        <span 
                                                                            className="text-[9px] font-black px-1.5 py-0.5 rounded bg-limePill text-limeText border border-limeBorder font-mono shadow-xs cursor-pointer hover:scale-105 transition-transform"
                                                                            title="TVR (Rating Point) - Klik untuk edit"
                                                                            onClick={() => setEditingRow({ ...row, index: idx + 1 })}
                                                                        >
                                                                            TVR {row.tvr}
                                                                        </span>
                                                                    )}
                                                                    {row.share !== undefined && row.share !== null && row.share !== "" && (
                                                                        <span 
                                                                            className="text-[9px] font-black px-1.5 py-0.5 rounded bg-sky-50 text-sky-700 border border-sky-200 font-mono shadow-xs cursor-pointer hover:scale-105 transition-transform"
                                                                            title="Audience Share (%) - Klik untuk edit"
                                                                            onClick={() => setEditingRow({ ...row, index: idx + 1 })}
                                                                        >
                                                                            Sh: {row.share}%
                                                                        </span>
                                                                    )}
                                                                    {row.unit !== undefined && row.unit !== null && row.unit !== "" && (
                                                                        <span 
                                                                            className={`text-[8.5px] font-extrabold px-1.5 py-0.5 rounded border shadow-xs cursor-pointer hover:scale-105 transition-transform truncate max-w-[85px] ${
                                                                                String(row.unit).toLowerCase().includes('iklan') || String(row.unit).toLowerCase().includes('break') || String(row.unit).toLowerCase().includes('ads')
                                                                                    ? 'bg-amber-100 text-amber-900 border-amber-300'
                                                                                    : 'bg-slate-100 text-slate-700 border-slate-200'
                                                                            }`}
                                                                            title={`Unit: ${row.unit} - Klik untuk edit`}
                                                                            onClick={() => setEditingRow({ ...row, index: idx + 1 })}
                                                                        >
                                                                            {row.unit}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            )}

                                                            {/* Tangkapan Monitoring: Pacing & Emosi Adegan (Selalu Tampil Mandiri) */}
                                                            {(() => { 
                                                                const a = detectRowAnalytics(row, idx); 
                                                                return (
                                                                    <div className="flex items-center gap-1 flex-wrap">
                                                                        <span 
                                                                            className={"text-[8.5px] font-extrabold px-1.5 py-0.5 rounded border shadow-xs cursor-pointer hover:scale-105 transition-transform " + (a.pacing === "Cepat" ? "bg-amber-500/20 text-amber-800 border-amber-400/50" : a.pacing === "Lambat" ? "bg-purple-500/15 text-purple-800 border-purple-400/50" : "bg-slate-100 text-slate-700 border-slate-300")} 
                                                                            title={"Pacing: " + a.pacing + " - Klik untuk edit"} 
                                                                            onClick={() => setEditingRow({ ...row, ...a, index: idx + 1 })}
                                                                        >
                                                                            {a.pacing === "Cepat" ? "⚡ Cepat" : a.pacing === "Lambat" ? "⏳ Lambat" : "⏱️ Sedang"}
                                                                        </span>
                                                                        <span 
                                                                            className={"text-[8.5px] font-extrabold px-1.5 py-0.5 rounded border shadow-xs cursor-pointer hover:scale-105 transition-transform " + (a.emosi === "Konflik" ? "bg-red-500/15 text-red-800 border-red-400/50" : a.emosi === "Sedih" ? "bg-blue-500/15 text-blue-800 border-blue-400/50" : a.emosi === "Happy" ? "bg-emerald-500/15 text-emerald-800 border-emerald-400/50" : a.emosi === "Tegang" ? "bg-orange-500/15 text-orange-800 border-orange-400/50" : "bg-slate-100 text-slate-700 border-slate-300")} 
                                                                            title={"Emosi: " + a.emosi + " - Klik untuk edit"} 
                                                                            onClick={() => setEditingRow({ ...row, ...a, index: idx + 1 })}
                                                                        >
                                                                            {a.emosi === "Konflik" ? "😡 Konflik" : a.emosi === "Sedih" ? "😢 Sedih" : a.emosi === "Happy" ? "😊 Ceria" : a.emosi === "Tegang" ? "😱 Tegang" : "ℹ️ Netral"}
                                                                        </span>
                                                                    </div>
                                                                ); 
                                                            })()}
                                                            
                                                            {/* Tombol Play Segmen Berwarna Neon Khas Attachment 2 */}
                                                            <button 
                                                                onClick={() => seekToRow(row.rentangWaktu)}
                                                                className="text-[10px] font-black text-obsidian bg-neon hover:bg-neon-dark px-2.5 py-1 rounded-md flex items-center gap-1 shadow-sm transition-all active:scale-95"
                                                                title="Putar video preview pada segmen ini"
                                                            >
                                                                <i className="fa-solid fa-play text-[8px]"></i>
                                                                <span>Play Segmen</span>
                                                            </button>
                                                        </div>

                                                    {/* Kolom Deskripsi Adegan */}
                                                    <div className="col-span-7 flex items-start gap-1.5">
                                                        <textarea 
                                                            value={row.deskripsi}
                                                            onChange={(e) => updateRow(row.id, 'deskripsi', e.target.value)}
                                                            rows={Math.max(3, Math.min(10, (row.deskripsi.split('\n').length || 1) + 1))}
                                                            className="w-full text-[11px] font-medium text-slate-800 bg-transparent border border-transparent hover:border-slate-200 focus:border-blue-500 focus:bg-white rounded-lg p-1.5 outline-none resize-y leading-relaxed transition-all whitespace-pre-wrap"
                                                        />
                                                        <div className="flex items-center gap-0.5 opacity-70 group-hover:opacity-100 transition-opacity shrink-0 pt-0.5">
                                                            <button 
                                                                onClick={() => setEditingRow({ ...row, index: idx + 1 })}
                                                                className="text-slate-400 hover:text-blue-600 p-1 rounded hover:bg-blue-50 transition-colors"
                                                                title="Menu Edit adegan ini"
                                                            >
                                                                <i className="fa-solid fa-pen-to-square text-[11px]"></i>
                                                            </button>
                                                            <button 
                                                                onClick={() => deleteRow(row.id)}
                                                                className="text-slate-400 hover:text-red-500 p-1 rounded hover:bg-red-50 transition-colors"
                                                                title="Hapus baris ini"
                                                            >
                                                                <i className="fa-solid fa-trash-can text-[11px]"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                                );
                                            })
                                        )}
                                    </div>

                                </div>

                                        </>
                                    )}

                                </div>
                            ) : (
                                <button 
                                    onClick={() => {
                                        setIsMbmVisible(true);
                                        setIsMbmCollapsed(false);
                                        notify("Daftar Tabel MBM dibuka kembali");
                                    }}
                                    className="w-full py-4 px-6 rounded-2xl border-2 border-dashed border-slate-300 hover:border-slate-400 bg-white/80 hover:bg-white text-slate-600 hover:text-slate-900 text-xs font-black flex items-center justify-center gap-2.5 transition-all shadow-sm group"
                                >
                                    <i className="fa-solid fa-list-check text-blue-600 group-hover:scale-110 transition-transform"></i>
                                    <span>Buka Kembali Daftar Tabel MBM</span>
                                </button>
                            )}

                        </div>

                    </div>

                    {/* ======================================================== */}
                    {/* MODAL AKTIVASI GEMINI API KEY                           */}
                    {/* ======================================================== */}
                    {showApiKeyModal && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fadeIn">
                            <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 space-y-4">
                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <div className="flex items-center gap-2.5">
                                        <div className="w-8 h-8 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center text-sm font-black">
                                            <i className="fa-solid fa-key"></i>
                                        </div>
                                        <div>
                                            <h3 className="font-black text-base text-slate-900">Aktifkan Analisis AI Video Nyata</h3>
                                            <p className="text-[11px] font-semibold text-slate-400">Google Gemini Multimodal Vision</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setShowApiKeyModal(false)}
                                        className="text-slate-400 hover:text-slate-700 p-1 text-sm rounded-lg hover:bg-slate-100 transition-colors"
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-3 text-xs leading-relaxed text-slate-600">
                                    <p>
                                        Saat ini sistem belum memiliki <strong className="text-slate-900">Google Gemini API Key</strong>.
                                    </p>
                                    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3.5 space-y-1.5 text-amber-900">
                                        <div className="font-extrabold flex items-center gap-1.5">
                                            <i className="fa-solid fa-circle-info text-amber-600"></i>
                                            <span>Kenapa Video Berbeda Hasilnya Sama di Demo?</span>
                                        </div>
                                        <p className="text-[11px] leading-normal text-amber-800">
                                            Tanpa API Key, tombol <em>Generate</em> hanya menjalankan <strong>simulasi template layout</strong>. Untuk memproses gambar visual, tokoh, dialog, dan chyron dari video <span className="font-mono font-bold">{uploadedFileName}</span> secara otomatis, AI membutuhkan API Key Gemini.
                                        </p>
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            Masukkan Gemini API Key Anda:
                                        </label>
                                        <input 
                                            type="text"
                                            value={tempApiKey}
                                            onChange={(e) => setTempApiKey(e.target.value)}
                                            placeholder="Tempel API Key di sini (AIzaSy...)"
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-mono font-bold text-slate-800 outline-none focus:bg-white focus:border-slate-400 shadow-inner"
                                        />
                                        <div className="flex items-center justify-between mt-1 px-1">
                                            <span className="text-[10px] text-slate-400">Belum punya API Key?</span>
                                            <a 
                                                href="https://aistudio.google.com/app/apikey" 
                                                target="_blank" 
                                                rel="noreferrer"
                                                className="text-[10px] font-bold text-blue-600 hover:underline"
                                            >
                                                Ambil Gratis di Google AI Studio &rarr;
                                            </a>
                                        </div>
                                    </div>

                                    {/* Rekomendasi Fitur/Model Gemini di Modal */}
                                    <div className="space-y-1.5 pt-1">
                                        <div className="flex items-center justify-between">
                                            <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">
                                                REKOMENDASI MODEL GEMINI:
                                            </label>
                                            <span className="text-[9px] font-mono text-emerald-600 font-bold">Terpilih: {selectedModel}</span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-1.5">
                                            {geminiModelOptions.map((opt) => (
                                                <button
                                                    key={opt.id}
                                                    type="button"
                                                    onClick={() => {
                                                        setSelectedModel(opt.id);
                                                        localStorage.setItem('mbm_model', opt.id);
                                                    }}
                                                    className={`p-2 rounded-xl text-left border text-xs font-bold transition-all flex flex-col justify-between ${
                                                        selectedModel === opt.id
                                                            ? 'bg-obsidian text-neon border-obsidian shadow-sm ring-1 ring-neon/50'
                                                            : 'bg-[#f8fafc] text-slate-700 border-slate-200 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    <div className="flex items-center justify-between text-[11px] w-full">
                                                        <span>{opt.name}</span>
                                                        <span className={`text-[8px] px-1 py-0.2 rounded font-black ${
                                                            selectedModel === opt.id ? 'bg-neon text-obsidian' : 'bg-slate-200 text-slate-600'
                                                        }`}>
                                                            {opt.badge}
                                                        </span>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex flex-col sm:flex-row items-center justify-between gap-2 pt-3 border-t border-slate-100">
                                    <button 
                                        onClick={() => {
                                            setShowApiKeyModal(false);
                                            runGenerate(false); // Jalankan demo
                                        }}
                                        className="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-all text-center"
                                    >
                                        Jalankan Demo Saja
                                    </button>
                                    <button 
                                        onClick={() => {
                                            if (!tempApiKey || tempApiKey.trim().length < 8) {
                                                alert("Harap masukkan API Key Gemini yang valid terlebih dahulu!");
                                                return;
                                            }
                                            setApiKey(tempApiKey.trim());
                                            localStorage.setItem('mbm_apiKey', tempApiKey.trim());
                                            setShowApiKeyModal(false);
                                            runGenerate(true);
                                        }}
                                        className="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs font-black bg-obsidian text-neon hover:bg-black transition-all shadow-md active:scale-95 flex items-center justify-center gap-1.5"
                                    >
                                        <i className="fa-solid fa-wand-magic-sparkles text-xs"></i>
                                        <span>Simpan & Analisis AI Sekarang</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ======================================================== */}
                    {/* MODAL INPUT LINK YOUTUBE / STREAMING VIDEO               */}
                    {/* ======================================================== */}
                    {showUrlInputModal && (
                        <div 
                            onClick={() => setShowUrlInputModal(false)}
                            className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 animate-in fade-in"
                        >
                            <div 
                                onClick={(e) => e.stopPropagation()}
                                className="w-full max-w-lg bg-white rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-4 animate-in zoom-in-95 text-left"
                            >
                                {/* Header Modal */}
                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <div className="flex items-center gap-2.5">
                                        <div className="w-10 h-10 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center shadow-xs">
                                            <i className="fa-brands fa-youtube text-xl"></i>
                                        </div>
                                        <div>
                                            <h3 className="text-sm font-black text-slate-900 flex items-center gap-2">
                                                <span>Monitoring Link YouTube / Video URL</span>
                                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                            </h3>
                                            <p className="text-[11px] font-medium text-slate-500">
                                                Ganti atau masukkan link YouTube publik / direct video (.mp4)
                                            </p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setShowUrlInputModal(false)}
                                        className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center transition-all cursor-pointer"
                                        title="Tutup (Klik di luar pop-up juga menutup)"
                                    >
                                        <i className="fa-solid fa-xmark text-sm"></i>
                                    </button>
                                </div>

                                {/* Form Input URL */}
                                <div className="space-y-2">
                                    <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">
                                        MASUKKAN / TEMPEL LINK VIDEO:
                                    </label>
                                    <div className="flex gap-2">
                                        <div className="relative flex-1">
                                            <i className="fa-solid fa-link absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                            <input
                                                type="text"
                                                value={inputVideoUrl}
                                                onChange={(e) => setInputVideoUrl(e.target.value)}
                                                onKeyDown={(e) => {
                                                    if (e.key === 'Enter') {
                                                        handleLoadVideoUrl();
                                                    }
                                                }}
                                                placeholder="Contoh: https://www.youtube.com/watch?v=..."
                                                autoFocus
                                                className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-slate-900 placeholder-slate-400 font-mono font-bold focus:bg-white focus:border-slate-400 outline-none shadow-inner"
                                            />
                                        </div>
                                        <button
                                            type="button"
                                            onClick={() => handleLoadVideoUrl()}
                                            className="px-5 py-2.5 bg-neon hover:bg-neon-dark text-obsidian font-black text-xs rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-1.5 shrink-0 cursor-pointer"
                                        >
                                            <i className="fa-solid fa-play text-xs"></i>
                                            <span>Muat Video</span>
                                        </button>
                                    </div>
                                    <p className="text-[11px] text-slate-500 leading-normal">
                                        💡 Sistem otomatis mendeteksi judul video, mengambil snapshot visual resolusi tinggi, dan menyinkronkan timecode dengan baris MBM di sebelah kanan.
                                    </p>
                                </div>

                                {/* Quick Presets / Pilihan Contoh Link */}
                                <div className="pt-3 border-t border-slate-100 space-y-2">
                                    <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">
                                        PINTASAN CEPAT CONTOH LINK:
                                    </span>
                                    <div className="flex flex-col gap-1.5">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                const sample = "https://www.youtube.com/watch?v=Rp4ck6C_O5s";
                                                setInputVideoUrl(sample);
                                                handleLoadVideoUrl(sample);
                                            }}
                                            className="p-2.5 rounded-xl bg-slate-50 hover:bg-red-50/70 border border-slate-200 hover:border-red-200 transition-all flex items-center justify-between text-left group cursor-pointer"
                                        >
                                            <div className="flex items-center gap-2.5 min-w-0">
                                                <i className="fa-brands fa-youtube text-red-600 text-sm shrink-0"></i>
                                                <div className="min-w-0">
                                                    <p className="text-xs font-bold text-slate-800 group-hover:text-red-700 truncate">
                                                        Otomotif TV - OMOWAY OMO-X Smart Long Range
                                                    </p>
                                                    <p className="text-[10px] font-mono text-slate-400 truncate">
                                                        https://www.youtube.com/watch?v=Rp4ck6C_O5s
                                                    </p>
                                                </div>
                                            </div>
                                            <span className="text-[10px] font-bold text-slate-500 bg-white px-2 py-0.5 rounded border border-slate-200 shrink-0 ml-2">
                                                Muat
                                            </span>
                                        </button>

                                        <button
                                            type="button"
                                            onClick={() => {
                                                const sample = "https://www.youtube.com/watch?v=68686sA53j4";
                                                setInputVideoUrl(sample);
                                                handleLoadVideoUrl(sample);
                                            }}
                                            className="p-2.5 rounded-xl bg-slate-50 hover:bg-red-50/70 border border-slate-200 hover:border-red-200 transition-all flex items-center justify-between text-left group cursor-pointer"
                                        >
                                            <div className="flex items-center gap-2.5 min-w-0">
                                                <i className="fa-brands fa-youtube text-red-600 text-sm shrink-0"></i>
                                                <div className="min-w-0">
                                                    <p className="text-xs font-bold text-slate-800 group-hover:text-red-700 truncate">
                                                        Otomotif TV - Indomobil e-Motor QT Pro
                                                    </p>
                                                    <p className="text-[10px] font-mono text-slate-400 truncate">
                                                        https://www.youtube.com/watch?v=68686sA53j4
                                                    </p>
                                                </div>
                                            </div>
                                            <span className="text-[10px] font-bold text-slate-500 bg-white px-2 py-0.5 rounded border border-slate-200 shrink-0 ml-2">
                                                Muat
                                            </span>
                                        </button>
                                    </div>
                                </div>

                                {/* Footer Modal */}
                                <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                                    <span className="text-[10px] text-slate-400">
                                        Klik di luar kotak pop-up untuk menutup
                                    </span>
                                    <button
                                        type="button"
                                        onClick={() => setShowUrlInputModal(false)}
                                        className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-all cursor-pointer"
                                    >
                                        Tutup
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ======================================================== */}
                    {/* MODAL MENU EDIT BARIS MBM                              */}
                    {/* ======================================================== */}
                    {!isVideoZoomed && renderEditRowModal()}
                    {/* Modal Tempel Data Nielsen Rating */}
                    {!isVideoZoomed && renderRatingModal()}

                    {/* DYNAMIC ISLAND PROJECT SWITCHER (5 PROJECT SLOTS) */}
                    {!isVideoZoomed && (
                        <div className="fixed bottom-5 sm:bottom-6 left-1/2 -translate-x-1/2 z-40 flex items-center bg-obsidian/95 text-white p-1.5 px-3 rounded-full shadow-2xl border border-white/15 backdrop-blur-xl gap-2 select-none animate-fadeIn">
                            <div className="flex items-center gap-1.5 pr-2.5 border-r border-white/15 text-[10px] font-black uppercase text-neon tracking-wider">
                                <span className="w-2 h-2 rounded-full bg-neon animate-pulse"></span>
                                <span>PROYEK</span>
                            </div>
                            <div className="flex items-center gap-1.5">
                                {projects.map((proj) => {
                                    const isActive = activeProjectId === proj.id;
                                    const count = proj.id === activeProjectId ? mbmRows.length : (proj.rowCount || 0);
                                    return (
                                        <button
                                            key={proj.id}
                                            type="button"
                                            onClick={() => handleSwitchProject(proj.id)}
                                            className={`px-3 py-1 rounded-full text-xs font-bold transition-all flex items-center gap-1.5 ${
                                                isActive
                                                    ? 'bg-neon text-obsidian font-black shadow-[0_0_12px_rgba(204,255,0,0.5)] scale-105'
                                                    : 'hover:bg-white/10 text-slate-300 hover:text-white'
                                            }`}
                                            title={`Beralih ke ${proj.name}`}
                                        >
                                            <span>{proj.name}</span>
                                            <span className={`text-[9px] font-black px-1.5 py-0.2 rounded-full ${
                                                isActive ? 'bg-obsidian/20 text-obsidian' : 'bg-white/10 text-slate-400'
                                            }`}>
                                                {count}
                                            </span>
                                        </button>
                                    );
                                })}
                                {projects.length < MAX_PROJECTS && (
                                    <button
                                        type="button"
                                        onClick={handleAddNewProject}
                                        className="w-6 h-6 rounded-full bg-white/10 hover:bg-neon hover:text-obsidian text-slate-300 flex items-center justify-center text-xs font-bold transition-all ml-0.5"
                                        title="Tambah Proyek Baru (Maksimal 5)"
                                    >
                                        <i className="fa-solid fa-plus text-[10px]"></i>
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ padding: '40px', fontFamily: 'sans-serif', textAlign: 'center', backgroundColor: '#0f172a', color: '#fff', minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                            <div style={{ maxWidth: '600px', backgroundColor: '#1e293b', padding: '30px', borderRadius: '20px', border: '1px solid #334155' }}>
                                <h2 style={{ color: '#ef4444', fontSize: '20px', fontWeight: 'bold', marginBottom: '10px' }}>Terjadi Kendala Tampilan</h2>
                                <p style={{ fontSize: '13px', color: '#94a3b8', marginBottom: '20px' }}>
                                    {this.state.error?.message || "Terjadi kesalahan sistem saat memuat komponen."}
                                </p>
                                <button 
                                    onClick={() => {
                                        localStorage.clear();
                                        window.location.reload();
                                    }}
                                    style={{ backgroundColor: '#ccff00', color: '#000', fontWeight: 'bold', padding: '10px 20px', borderRadius: '12px', border: 'none', cursor: 'pointer', fontSize: '12px' }}
                                >
                                    Bersihkan Cache & Refresh Halaman
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
