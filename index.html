                                            className="py-1 flex items-center justify-between text-xs font-bold text-slate-500 cursor-pointer hover:text-slate-800 transition-colors"
                                        >
                                            <div className="flex items-center gap-2">
                                                <span className="w-2.5 h-2.5 rounded-full bg-neon animate-pulse"></span>
                                                <span className="font-extrabold text-slate-700">Preview: {uploadedFileName}</span>
                                                <span className="text-slate-300">•</span>
                                                <span className="font-mono text-slate-600">{formatTime(currentTime)} / {formatTime(videoDuration)}</span>
                                            </div>
                                            <span className="text-blue-600 text-[11px] font-black hover:underline flex items-center gap-1">
                                                <span>Buka Layar Video</span>
                                                <i className="fa-solid fa-chevron-down text-[9px]"></i>
                                            </span>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="space-y-1">
                                                <h2 className="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight break-all" title={uploadedFileName}>
                                                    {uploadedFileName}
                                                </h2>
                                                <p className="text-xs sm:text-sm font-semibold text-slate-500">
                                                    {videoFile ? `File Video: ${videoFile.name} • Total Durasi: ${formatTime(videoDuration)}` : 'Area Preview Video Utama (Sinkronisasi dengan MBM di sebelah kanan)'}
                                                </p>
                                            </div>

                                            <div className="w-full flex items-center justify-between px-1 pt-1">
                                                <div className="flex items-center gap-2">
                                                    <span className="w-2.5 h-2.5 rounded-full bg-neon animate-pulse"></span>
                                                    <span className="text-xs font-black uppercase tracking-wider text-slate-700">
                                                        AREA PREVIEW VIDEO
                                                    </span>
                                                </div>
                                                <div className="font-mono text-xs font-extrabold text-slate-600 bg-slate-100 px-3 py-1 rounded-lg">
                                                    {formatTime(currentTime)} / {formatTime(videoDuration)}
                                                </div>
                                            </div>

                                            {/* Video Canvas Box 16:9 Aspect Ratio (atau Mode Fullscreen Zoom jika isVideoZoomed) */}
                                            <div 
                                                ref={playerContainerRef}
                                                className={
                                                    isVideoZoomed 
                                                        ? "fixed inset-0 z-50 bg-black flex flex-col items-center justify-center overflow-hidden animate-fadeIn select-none"
                                                        : "w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl relative border-2 border-slate-900 flex items-center justify-center group"
                                                }
                                            >
                                                {videoUrl ? (
                                                    <>
                                                        <video 
                                                            ref={videoRef}
                                                            src={videoUrl} 
                                                            controls 
                                                            className="w-full h-full object-contain"
                                                            onDoubleClick={toggleFullscreen}
                                                            onLoadedMetadata={(e) => setVideoDuration(e.target.duration)}
                                                            onTimeUpdate={(e) => setCurrentTime(e.target.currentTime)}
                                                            onPlay={() => setIsPlaying(true)}
                                                            onPause={() => setIsPlaying(false)}
                                                        />

                                                        {/* KOTAK-KOTAK MASKING PENUTUP MERAH TRANSPARAN (DIABAIKAN) */}
                                                        {showMasks && masks.map(mask => (
                                                            <div
                                                                key={mask.id}
                                                                style={{
                                                                    left: `${mask.x}%`,
                                                                    top: `${mask.y}%`,
                                                                    width: `${mask.width}%`,
                                                                    height: `${mask.height}%`
                                                                }}
                                                                onMouseDown={(e) => startDragMask(mask.id, e)}
                                                                onTouchStart={(e) => startDragMask(mask.id, e)}
                                                                className="absolute z-30 bg-red-600/40 hover:bg-red-600/50 border-2 border-red-500 rounded-xl cursor-move select-none flex flex-col justify-between p-1.5 shadow-[0_0_15px_rgba(239,68,68,0.35)] backdrop-blur-[0.5px] transition-colors group/mask pointer-events-auto"
                                                                title={`Tarik & geser untuk memindahkan. Tarik sudut kanan bawah untuk ubah ukuran (${mask.name})`}
                                                            >
                                                                {/* Header Kotak Mask: Label & Hapus */}
                                                                <div className="flex items-center justify-between text-[10px] font-black text-white px-0.5 pointer-events-auto">
                                                                    <span className="truncate max-w-[130px] bg-red-950/90 text-red-100 border border-red-700/80 px-2 py-0.5 rounded-md text-[9px] uppercase tracking-wider flex items-center gap-1 shadow-sm">
                                                                        <i className="fa-solid fa-ban text-[8px] text-red-300"></i>
                                                                        <span>{mask.name}</span>
                                                                    </span>
                                                                    <button
                                                                        onClick={(e) => {
                                                                            e.stopPropagation();
                                                                            deleteMask(mask.id);
                                                                        }}
                                                                        className="w-4 h-4 rounded-full bg-red-950 hover:bg-red-600 text-red-200 hover:text-white flex items-center justify-center text-[8px] transition-all border border-red-700 shadow-sm"
                                                                        title="Hapus kotak penutup ini"
                                                                    >
                                                                        <i className="fa-solid fa-xmark"></i>
                                                                    </button>
                                                                </div>

                                                                {/* Tengah: Indikator Area */}
                                                                <div className="text-center text-[10px] font-extrabold text-white/80 uppercase tracking-widest pointer-events-none drop-shadow">
                                                                    DIABAIKAN
                                                                </div>

                                                                {/* Sudut Kanan Bawah: Ukuran % & Resize Handle */}
                                                                <div className="flex items-center justify-between pt-1">
                                                                    <span className="text-[8px] font-mono text-white/70 font-bold px-1 pointer-events-none">
                                                                        {Math.round(mask.width)}% × {Math.round(mask.height)}%
                                                                    </span>
                                                                    <div
                                                                        onMouseDown={(e) => startResizeMask(mask.id, e)}
                                                                        onTouchStart={(e) => startResizeMask(mask.id, e)}
                                                                        className="resize-handle w-4 h-4 bg-red-500 hover:bg-white text-white hover:text-red-600 rounded-md cursor-nwse-resize flex items-center justify-center text-[8px] shadow-sm pointer-events-auto transition-colors"
                                                                        title="Tarik untuk mengubah ukuran kotak (Resize)"
                                                                    >
                                                                        <i className="fa-solid fa-up-right-and-down-left-from-center rotate-90 text-[7px]"></i>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))}

                                                        {/* KONTROL OVERLAY SAAT MODE NORMAL */}
                                                        {!isVideoZoomed && (
                                                            <>
                                                                <div className="absolute top-4 left-4 bg-obsidian/85 backdrop-blur-md text-neon font-mono text-xs px-3 py-1.5 rounded-xl border border-slate-700 font-bold pointer-events-none shadow-md">
                                                                    TC: {formatTime(currentTime)} / {formatTime(videoDuration)}
                                                                </div>
                                                                <div className="absolute top-4 right-4 z-20 flex items-center gap-2">
                                                                    {/* Tombol Toggle Grafik Rating (TVR & Share) */}
                                                                    <button 
                                                                        onClick={() => {
                                                                            setShowRatingChart(!showRatingChart);
                                                                            notify(showRatingChart ? "Grafik rating ditutup" : "Grafik rating TVR & Share dibuka!");
                                                                        }}
                                                                        className={`text-xs px-3 py-1.5 rounded-xl border font-bold transition-all shadow-md flex items-center gap-1.5 active:scale-95 ${
                                                                            showRatingChart 
                                                                                ? 'bg-neon text-obsidian border-neon shadow-neon/20 ring-1 ring-neon-dark font-black' 
                                                                                : 'bg-obsidian/85 hover:bg-slate-800 text-slate-300 border-slate-700'
                                                                        }`}
                                                                        title="Tampilkan atau sembunyikan grafik performa rating TV (TVR & Share)"
                                                                    >
                                                                        <i className={`fa-solid fa-chart-line text-xs ${showRatingChart ? 'text-obsidian' : 'text-neon'}`}></i>
                                                                        <span>{t("ratingChart")} {showRatingChart ? "ON" : "OFF"}</span>
                                                                    </button>

                                                                    {/* Tombol Toggle Masking Penutup Layar */}
                                                                    <button 
                                                                        onClick={() => {
                                                                            setShowMasks(!showMasks);
                                                                            notify(showMasks ? "Masking penutup disembunyikan" : "Masking penutup ditampilkan");
                                                                        }}
                                                                        className={`text-xs px-3 py-1.5 rounded-xl border font-bold transition-all shadow-md flex items-center gap-1.5 active:scale-95 ${
                                                                            showMasks 
                                                                                ? 'bg-red-600 hover:bg-red-700 text-white border-red-500 shadow-red-500/25 ring-1 ring-red-400' 
                                                                                : 'bg-obsidian/85 hover:bg-slate-800 text-slate-300 border-slate-700'
                                                                        }`}
                                                                        title={showMasks ? "Sembunyikan kotak penutup masking" : "Tampilkan kotak penutup masking"}
                                                                    >
                                                                        <i className="fa-solid fa-vector-square text-xs text-red-300"></i>
                                                                        <span>{t("masking")} ({masks.length}) {showMasks ? "ON" : "OFF"}</span>
                                                                    </button>

                                                                    {/* Tombol Layar Penuh Studio (Video + Floating MBM) */}
                                                                    <button 
                                                                        onClick={toggleFullscreen}
                                                                        className="bg-obsidian/85 hover:bg-neon hover:text-obsidian text-white text-xs px-3 py-1.5 rounded-xl border border-slate-700 font-bold transition-all shadow-md flex items-center gap-1.5 active:scale-95 group/fsbtn"
                                                                        title="Layar Penuh Studio: Video + Tabel MBM Mengambang (F / Double Click)"
                                                                    >
                                                                        <i className="fa-solid fa-expand text-neon group-hover/fsbtn:text-obsidian transition-colors text-xs"></i>
                                                                        <span>{t("fullscreen")}</span>
                                                                    </button>
                                                                    <button 
                                                                        onClick={handleRemoveVideo}
                                                                        className="bg-obsidian/85 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-xl border border-slate-700 font-bold transition-all shadow-md flex items-center gap-1.5 active:scale-95 group/del"
                                                                        title="Hapus / Keluarkan video ini dari pemutar"
                                                                    >
                                                                        <i className="fa-solid fa-trash-can text-red-400 group-hover/del:text-white transition-colors"></i>
                                                                        <span>{t("removeVideo")}</span>
                                                                    </button>
                                                                </div>
                                                            </>
                                                        )}

                                                        {/* KONTROL OVERLAY TOP BAR SAAT MODE ZOOM */}
                                                        {isVideoZoomed && (
                                                            <div className="absolute top-4 left-4 right-4 flex items-center justify-between z-40 pointer-events-none">
                                                                {/* Kiri: Judul File & Timecode */}
                                                                <div className="flex items-center gap-3 pointer-events-auto">
                                                                    <div className="bg-obsidian/90 backdrop-blur-md border border-slate-700/80 rounded-2xl px-4 py-2 flex items-center gap-2.5 shadow-2xl text-white">
                                                                        <span className="w-2.5 h-2.5 rounded-full bg-neon animate-pulse"></span>
                                                                        <span className="font-black text-xs sm:text-sm tracking-tight truncate max-w-xs sm:max-w-md">
                                                                            {uploadedFileName}
                                                                        </span>
                                                                        <span className="text-slate-500 font-mono text-xs">•</span>
                                                                        <span className="font-mono text-xs font-bold text-neon bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800">
                                                                            TC: {formatTime(currentTime)} / {formatTime(videoDuration)}
                                                                        </span>
                                                                    </div>
                                                                </div>

                                                                {/* Kanan: Tombol Masking, Buka/Tutup MBM & Keluar Zoom */}
                                                                <div className="flex items-center gap-2.5 pointer-events-auto">
                                                                    {/* Tombol Toggle Grafik Rating di Layar Penuh */}
                                                                    <button 
                                                                        onClick={() => {
                                                                            setShowRatingChart(!showRatingChart);
                                                                            notify(showRatingChart ? "Grafik rating ditutup" : "Grafik rating dibuka!");
                                                                        }}
                                                                        className={`px-3.5 py-2 rounded-2xl text-xs font-black transition-all shadow-xl flex items-center gap-1.5 border ${
                                                                            showRatingChart 
                                                                                ? 'bg-neon text-obsidian border-neon shadow-neon/20 ring-1 ring-neon-dark font-black' 
                                                                                : 'bg-obsidian/90 hover:bg-slate-800 text-slate-300 border-slate-700'
                                                                        }`}
                                                                        title="Tampilkan / Sembunyikan Grafik Performa Rating"
                                                                    >
                                                                        <i className={`fa-solid fa-chart-line text-xs ${showRatingChart ? 'text-obsidian' : 'text-neon'}`}></i>
                                                                        <span>Grafik Rating</span>
                                                                    </button>

                                                                    <button 
                                                                        onClick={() => {
                                                                            setShowMasks(!showMasks);
                                                                            notify(showMasks ? "Masking penutup disembunyikan" : "Masking penutup ditampilkan");
                                                                        }}
                                                                        className={`px-3.5 py-2 rounded-2xl text-xs font-black transition-all shadow-xl flex items-center gap-1.5 border ${
                                                                            showMasks 
                                                                                ? 'bg-red-600 text-white border-red-500 shadow-red-500/25 ring-1 ring-red-400' 
                                                                                : 'bg-obsidian/90 hover:bg-slate-800 text-slate-300 border-slate-700'
                                                                        }`}
                                                                        title="Tampilkan / Sembunyikan Kotak Penutup (Masking) di Layar Penuh"
                                                                    >
                                                                        <i className="fa-solid fa-vector-square text-xs text-red-300"></i>
                                                                        <span>Masking ({masks.length}) {showMasks ? 'ON' : 'OFF'}</span>
                                                                    </button>

                                                                    {mbmRows.length > 0 && (
                                                                        <button 
                                                                            onClick={() => setShowFloatingMbm(!showFloatingMbm)}
                                                                            className={`px-4 py-2 rounded-2xl text-xs font-black transition-all shadow-xl flex items-center gap-2 border ${
                                                                                showFloatingMbm 
                                                                                    ? 'bg-neon text-obsidian border-neon shadow-neon/20 hover:bg-neon-dark scale-[1.02]' 
                                                                                    : 'bg-obsidian/90 hover:bg-slate-800 text-white border-slate-700'
                                                                            }`}
                                                                            title="Buka / Tutup Panel Floating MBM di sebelah kanan"
                                                                        >
                                                                            <i className="fa-solid fa-list-check text-sm"></i>
                                                                            <span>{showFloatingMbm ? t("hideMbm") : t("showMbm")}</span>
                                                                            <span className={`text-[10px] px-1.5 py-0.5 rounded-md font-mono ${showFloatingMbm ? 'bg-black text-neon' : 'bg-slate-800 text-slate-300'}`}>
                                                                                {filteredRows.length}
                                                                            </span>
                                                                        </button>
                                                                    )}

                                                                    {/* Toggle Bahasa di Layar Penuh Zoom (Dinonaktifkan) */}
                                                                    <button 
                                                                        type="button"
                                                                        onClick={() => {
                                                                            const next = lang === "id" ? "en" : "id";
                                                                            setLang(next);
                                                                            localStorage.setItem("mbm_app_lang", next);
                                                                            notify(next === "en" ? "Language: English 🇬🇧" : "Bahasa: Indonesia 🇮🇩");
                                                                        }}
                                                                        style={{ display: 'none' }}
                                                                        className="hidden"
                                                                        title={lang === "id" ? "Switch to English (Bahasa)" : "Ganti ke Bahasa Indonesia"}
                                                                    >
                                                                        <i className="fa-solid fa-globe text-neon text-xs"></i>
                                                                        <span>{lang === "id" ? "🇮🇩 ID" : "🇬🇧 EN"}</span>
                                                                    </button>
                                                                    <button 
                                                                        onClick={toggleFullscreen}
                                                                        className="bg-obsidian/90 hover:bg-red-600 text-white hover:text-white px-4 py-2 rounded-2xl text-xs font-black border border-slate-700 hover:border-red-500 transition-all shadow-xl flex items-center gap-2 active:scale-95"
                                                                        title="Keluar dari Layar Penuh Zoom (Tekan Esc)"
                                                                    >
                                                                        <i className="fa-solid fa-compress text-sm"></i>
                                                                        <span className="hidden sm:inline">Keluar Zoom</span>
                                                                        <kbd className="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-300">Esc</kbd>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* FLOATING MBM PANEL DI DALAM FRAME VIDEO (DAPAT DI-DRAG KESANA KEMARI & DI-RESIZE UKURANNYA) */}
                                                        {isVideoZoomed && showFloatingMbm && mbmRows.length > 0 && (
                                                            <div 
                                                                style={{
                                                                    width: `${floatingMbmSize.width}px`,
                                                                    height: `${floatingMbmSize.height}px`,
                                                                    maxWidth: '92vw',
                                                                    maxHeight: 'calc(100vh - 120px)',
                                                                    transform: `translate3d(${boxPositions.floatingMbm?.x || 0}px, ${boxPositions.floatingMbm?.y || 0}px, 0)`
                                                                }}
                                                                className="absolute right-4 sm:right-6 top-16 z-40 flex flex-col rounded-3xl overflow-hidden shadow-2xl transition-[opacity,background-color,border-color,box-shadow] duration-200 pointer-events-auto border border-white/15 bg-slate-950/40 backdrop-blur-md opacity-40 hover:opacity-100 hover:bg-slate-950/95 hover:border-slate-700/80 hover:shadow-[0_25px_60px_rgba(0,0,0,0.9)] group/mbm select-none"
                                                            >
                                                                
                                                                {/* Floating Panel Header Bar (Drag Handle untuk Menggeser Box) */}
                                                                <div 
                                                                    onMouseDown={(e) => handleStartDrag('floatingMbm', e)}
                                                                    onTouchStart={(e) => handleStartDrag('floatingMbm', e)}
                                                                    className="p-3.5 px-4 border-b border-white/10 flex items-center justify-between bg-slate-900/50 group-hover/mbm:bg-slate-900/90 transition-colors cursor-grab active:cursor-grabbing select-none"
                                                                    title="Klik & tahan di sini untuk menggeser panel MBM (Drag ke mana saja)"
                                                                >
                                                                    <div className="flex items-center gap-2.5">
                                                                        <div className="flex items-center text-slate-400 group-hover/mbm:text-neon transition-colors" title="Drag Handle">
                                                                            <i className="fa-solid fa-grip-vertical text-xs"></i>
                                                                        </div>
                                                                        <div>
                                                                            <div className="flex items-center gap-2">
                                                                                <span className="w-2.5 h-2.5 rounded-full bg-neon animate-pulse"></span>
                                                                                <h3 className="font-black text-sm text-white tracking-tight">
                                                                                    Tabel Minute-by-Minute
                                                                                </h3>
                                                                            </div>
                                                                            <p className="text-[11px] text-slate-300 font-semibold mt-0.5">
                                                                                {filteredRows.length} {t("mbmSubtitle")}
                                                                            </p>
                                                                        </div>
                                                                    </div>

                                                                    <div className="flex items-center gap-1.5">
                                                                        {(boxPositions.floatingMbm?.x !== 0 || boxPositions.floatingMbm?.y !== 0) && (
                                                                            <button 
                                                                                onClick={() => {
                                                                                    resetBoxPosition('floatingMbm');
                                                                                    notify("Posisi panel MBM dikembalikan!");
                                                                                }}
                                                                                className="w-7 h-7 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 flex items-center justify-center transition-all text-xs"
                                                                                title="Kembalikan posisi panel ke samping kanan"
                                                                            >
                                                                                <i className="fa-solid fa-rotate-left text-[11px]"></i>
                                                                            </button>
                                                                        )}
                                                                        <button 
                                                                            onClick={() => {
                                                                                const next = floatingMbmSize.height <= 300 
                                                                                    ? { width: 440, height: 380 } 
                                                                                    : (floatingMbmSize.height <= 420 ? { width: 480, height: 520 } : { width: 380, height: 260 });
                                                                                setFloatingMbmSize(next);
                                                                                localStorage.setItem('mbm_floating_size_v2', JSON.stringify(next));
                                                                                notify(`Tinggi panel MBM: ${next.height}px`);
                                                                            }}
                                                                            className="w-7 h-7 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 flex items-center justify-center transition-all text-xs"
                                                                            title="Ubah Tinggi Cepat Panel MBM (Pendek / Sedang / Panjang)"
                                                                        >
                                                                            <i className="fa-solid fa-arrows-up-down text-[11px]"></i>
                                                                        </button>
                                                                        <button 
                                                                            onClick={addManualRow}
                                                                            className="p-1.5 px-2.5 rounded-xl bg-neon text-obsidian hover:bg-neon-dark text-[11px] font-black transition-all shadow-sm flex items-center gap-1 active:scale-95"
                                                                            title="Tambah Baris Adegan Baru"
                                                                        >
                                                                            <i className="fa-solid fa-plus text-[10px]"></i>
                                                                            <span>{t("addQuick")}</span>
                                                                        </button>
                                                                        <button 
                                                                            onClick={() => setShowFloatingMbm(false)}
                                                                            className="w-7 h-7 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 flex items-center justify-center transition-all text-xs"
                                                                            title="Sembunyikan Panel MBM"
                                                                        >
                                                                            <i className="fa-solid fa-xmark"></i>
                                                                        </button>
                                                                    </div>
                                                                </div>

                                                                {/* Search Bar di Floating Panel */}
                                                                <div className="p-2.5 px-3 bg-slate-900/30 group-hover/mbm:bg-slate-900/80 border-b border-white/10 transition-colors">
                                                                    <div className="relative w-full">
                                                                        <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                                                        <input 
                                                                            type="text"
                                                                            value={searchTerm}
                                                                            onChange={(e) => setSearchTerm(e.target.value)}
                                                                            placeholder={t("searchPlaceholder")}
                                                                            className="w-full bg-slate-800/60 focus:bg-slate-800 border border-white/10 rounded-xl pl-8 pr-3 py-1.5 text-xs text-white placeholder-slate-400 font-bold outline-none focus:border-neon transition-colors"
                                                                        />
                                                                        {searchTerm && (
                                                                            <button onClick={() => setSearchTerm("")} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">
                                                                                <i className="fa-solid fa-circle-xmark"></i>
                                                                            </button>
                                                                        )}
                                                                    </div>
                                                                </div>

                                                                {/* HEADER TABEL MBM GELAP */}
                                                                <div className="grid grid-cols-12 bg-black/60 group-hover/mbm:bg-black/90 text-neon py-2 px-3.5 text-xs font-black tracking-wide border-b border-white/10 shrink-0 transition-colors">
                                                                    <div className="col-span-5 flex items-center">
                                                                        <span className="text-[11px] font-black text-neon">{t("timeRange")}</span>
                                                                    </div>
                                                                    <div className="col-span-7 flex items-center justify-between">
                                                                        <span className="text-[11px] font-black text-white">{t("sceneDescription")}</span>
                                                                    </div>
                                                                </div>

                                                                {/* DAFTAR BARIS MBM SCROLLABLE */}
                                                                <div className="divide-y divide-white/5 overflow-y-auto custom-scroll flex-1 bg-slate-950/40 group-hover/mbm:bg-slate-950/90 transition-colors">
                                                                    {filteredRows.length === 0 ? (
                                                                        <div className="text-center py-12 text-slate-400 text-xs font-bold">
                                                                            Tidak ada adegan yang cocok.
                                                                        </div>
                                                                    ) : (
                                                                        filteredRows.map((row, idx) => {
                                                                            const parts = row.rentangWaktu.split('-');
                                                                            let isActiveSegment = false;
                                                                            if (parts.length === 2) {
                                                                                const start = parseTimeToSeconds(parts[0]);
                                                                                const end = parseTimeToSeconds(parts[1]);
                                                                                isActiveSegment = currentTime >= start && currentTime < end;
                                                                            }

                                                                            return (
                                                                                <div 
                                                                                    key={row.id}
                                                                                    className={`grid grid-cols-12 py-3 px-3 transition-all group/row items-start gap-2.5 ${
                                                                                        isActiveSegment 
                                                                                            ? 'bg-neon/15 border-l-4 border-neon shadow-inner' 
                                                                                            : 'hover:bg-white/10'
                                                                                    }`}
                                                                                >
                                                                                    {/* Kolom Rentang Waktu + Tombol Play Segmen */}
                                                                                    <div className="col-span-5 space-y-1.5">
                                                                                        <div className="flex items-center gap-1.5">
                                                                                            <span className={`w-4 h-4 rounded font-black text-[9px] flex items-center justify-center shrink-0 ${
                                                                                                isActiveSegment ? 'bg-neon text-obsidian font-black' : 'bg-white/10 text-slate-300'
                                                                                            }`}>
                                                                                                {idx + 1}
                                                                                            </span>
                                                                                            <span className="font-mono text-[11px] font-black text-neon">
                                                                                                {row.rentangWaktu}
                                                                                            </span>
                                                                                        </div>
                                                                                        
                                                                                        {/* Tombol Play Segmen Neon */}
                                                                                        <button 
                                                                                            onClick={() => seekToRow(row.rentangWaktu)}
                                                                                            className="text-[10px] font-black text-obsidian bg-neon hover:bg-neon-dark px-2.5 py-1 rounded-md flex items-center gap-1 shadow-sm transition-all active:scale-95"
                                                                                            title="Putar video pada segmen ini"
                                                                                        >
                                                                                            <i className="fa-solid fa-play text-[8px]"></i>
                                                                                            <span>{t("playSegment")}</span>
                                                                                        </button>

                                                                                        {/* Rating Badges: TVR, Share, Unit di Mode Fullscreen */}
                                                                                        {(row.tvr !== undefined || row.share !== undefined || row.unit !== undefined) && (
                                                                                            <div className="flex items-center gap-1 flex-wrap pt-0.5">
                                                                                                {row.tvr !== undefined && row.tvr !== null && row.tvr !== "" && (
                                                                                                    <span 
                                                                                                        className="text-[9px] font-black px-1.5 py-0.5 rounded bg-neon/20 text-neon border border-neon/30 font-mono shadow-xs cursor-pointer hover:scale-105 transition-transform"
                                                                                                        title="TVR (Rating Point) - Klik untuk edit"
                                                                                                        onClick={() => setEditingRow({ ...row, index: idx + 1 })}
                                                                                                    >
                                                                                                        TVR {row.tvr}
                                                                                                    </span>
                                                                                                )}
                                                                                                {row.share !== undefined && row.share !== null && row.share !== "" && (
                                                                                                    <span 
                                                                                                        className="text-[9px] font-black px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-400/30 font-mono shadow-xs cursor-pointer hover:scale-105 transition-transform"
                                                                                                        title="Audience Share (%) - Klik untuk edit"
                                                                                                        onClick={() => setEditingRow({ ...row, index: idx + 1 })}
                                                                                                    >
                                                                                                        Sh: {row.share}%
                                                                                                    </span>
                                                                                                )}
                                                                                                {row.unit !== undefined && row.unit !== null && row.unit !== "" && (
                                                                                                    <span 
                                                                                                        className={`text-[8.5px] font-extrabold px-1.5 py-0.5 rounded border shadow-xs cursor-pointer hover:scale-105 transition-transform truncate max-w-[85px] ${
                                                                                                            String(row.unit).toLowerCase().includes('iklan') || String(row.unit).toLowerCase().includes('break') || String(row.unit).toLowerCase().includes('ads')
                                                                                                                ? 'bg-amber-500/25 text-amber-300 border-amber-500/40'
                                                                                                                : 'bg-slate-800 text-slate-300 border-slate-700'
                                                                                                        }`}
                                                                                                        title={`Unit: ${row.unit} - Klik untuk edit`}
                                                                                                        onClick={() => setEditingRow({ ...row, index: idx + 1 })}
                                                                                                    >
                                                                                                        {row.unit}
                                                                                                    </span>
                                                                                                )}
                                                                                            </div>
                                                                                        )}
                                                                                    </div>

                                                                                    {/* Kolom Deskripsi Adegan */}
                                                                                    <div className="col-span-7 flex items-start gap-1.5">
                                                                                        <p className="w-full text-[11px] font-medium text-slate-100 leading-relaxed break-words whitespace-pre-wrap">
                                                                                            {row.deskripsi}
                                                                                        </p>
                                                                                        <div className="flex items-center gap-0.5 opacity-60 group-hover/row:opacity-100 transition-opacity shrink-0 pt-0.5">
                                                                                            <button 
                                                                                                onClick={() => setEditingRow({ ...row, index: idx + 1 })}
                                                                                                className="text-slate-400 hover:text-neon p-1 rounded hover:bg-white/10 transition-colors"
                                                                                                title="Edit adegan ini"
                                                                                            >
                                                                                                <i className="fa-solid fa-pen-to-square text-[11px]"></i>
                                                                                            </button>
                                                                                            <button 
                                                                                                onClick={() => deleteRow(row.id)}
                                                                                                className="text-slate-400 hover:text-red-400 p-1 rounded hover:bg-white/10 transition-colors"
                                                                                                title="Hapus baris ini"
                                                                                            >
                                                                                                <i className="fa-solid fa-trash-can text-[11px]"></i>
                                                                                            </button>
                                                                                        </div>
                                                                                    </div>
                                                                                </div>
                                                                            );
                                                                        })
                                                                    )}
                                                                </div>

                                                                {/* Footer Info Sinkronisasi & Hint Drag */}
                                                                <div className="p-2.5 bg-slate-900/60 group-hover/mbm:bg-slate-900/90 border-t border-white/10 text-center flex items-center justify-between text-[10px] text-slate-400 font-bold px-4 shrink-0 transition-colors">
                                                                    <div className="flex items-center gap-1.5">
                                                                        <i className="fa-solid fa-arrows-up-down-left-right text-neon text-[9px]"></i>
                                                                        <span>Geser header • Tarik sudut untuk ubah ukuran</span>
                                                                    </div>
                                                                    <span className="text-neon font-mono">TC: {formatTime(currentTime)}</span>
                                                                </div>

                                                                {/* Sudut Kiri Bawah: Resize Handle Lebar & Tinggi */}
                                                                <div 
                                                                    onMouseDown={(e) => startResizeFloatingMbm(e, 'bottom-left')}
                                                                    onTouchStart={(e) => startResizeFloatingMbm(e, 'bottom-left')}
                                                                    className="absolute bottom-1 left-1.5 w-6 h-6 rounded-lg bg-black/60 hover:bg-neon text-slate-400 hover:text-obsidian flex items-center justify-center cursor-nesw-resize transition-all z-50 border border-white/15 shadow-sm"
                                                                    title="Tarik sudut ini untuk mengubah lebar dan tinggi panel MBM"
                                                                >
                                                                    <i className="fa-solid fa-up-right-and-down-left-from-center text-[9px] -rotate-45 pointer-events-none"></i>
                                                                </div>

                                                                {/* Sudut Kanan Bawah: Resize Handle Tinggi & Lebar */}
                                                                <div 
                                                                    onMouseDown={(e) => startResizeFloatingMbm(e, 'bottom-right')}
                                                                    onTouchStart={(e) => startResizeFloatingMbm(e, 'bottom-right')}
                                                                    className="absolute bottom-1 right-1.5 w-6 h-6 rounded-lg bg-black/60 hover:bg-neon text-slate-400 hover:text-obsidian flex items-center justify-center cursor-nwse-resize transition-all z-50 border border-white/15 shadow-sm"
                                                                    title="Tarik sudut ini untuk mengubah ukuran panel MBM"
                                                                >
                                                                    <i className="fa-solid fa-up-right-and-down-left-from-center text-[9px] rotate-45 pointer-events-none"></i>
                                                                </div>

                                                                {/* Sisi Kiri: Resize Handle Lebar */}
                                                                <div 
                                                                    onMouseDown={(e) => startResizeFloatingMbm(e, 'left')}
                                                                    onTouchStart={(e) => startResizeFloatingMbm(e, 'left')}
                                                                    className="absolute top-14 bottom-8 left-0 w-2.5 cursor-ew-resize hover:bg-neon/60 transition-colors z-40"
                                                                    title="Tarik sisi ini untuk melebarkan atau menyempitkan panel MBM"
                                                                />

                                                                {/* Sisi Bawah: Resize Handle Tinggi */}
                                                                <div 
                                                                    onMouseDown={(e) => startResizeFloatingMbm(e, 'bottom')}
                                                                    onTouchStart={(e) => startResizeFloatingMbm(e, 'bottom')}
                                                                    className="absolute bottom-0 left-8 right-8 h-2.5 cursor-ns-resize hover:bg-neon/60 transition-colors z-40"
                                                                    title="Tarik sisi ini untuk meninggikan atau memendekkan panel MBM"
                                                                />

                                                            </div>
                                                        )}

                                                        {/* MODAL & TOAST DI DALAM CONTAINER FULLSCREEN AGAR MUNCUL SAAT FULLSCREEN */}
                                                        {isVideoZoomed && renderEditRowModal()}
                                                        {isVideoZoomed && renderRatingModal()}
                                                        {isVideoZoomed && toastMessage && (
                                                            <div className="fixed bottom-6 right-6 z-[110] bg-obsidian text-neon px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 font-extrabold text-xs border border-slate-700 animate-bounce pointer-events-auto">
                                                                <i className="fa-solid fa-circle-check"></i>
                                                                <span>{toastMessage}</span>
                                                            </div>
                                                        )}

                                                        {/* GRAFIK RATING BROADCAST CURVE (TRANSPARAN GELAP SEPERTI MBM, TINGGI 1/2, PANJANG DARI UJUNG KE UJUNG) */}
                                                        {showRatingChart && mbmRows.length > 0 && (() => {
                                                            const chartWidth = 1100;
                                                            const chartHeight = isChartCompact ? 32 : 92;
                                                            const padL = 36;
                                                            const padR = 36;
                                                            const padT = 16;
                                                            const padB = 20;
                                                            const plotW = chartWidth - padL - padR;
                                                            const plotH = chartHeight - padT - padB;

                                                            const maxTvrVal = Math.max(4.0, ...mbmRows.map(r => Number(r.tvr) || 0)) * 1.15;
                                                            const maxShareVal = Math.max(15.0, ...mbmRows.map(r => Number(r.share) || 0)) * 1.15;

                                                            const points = mbmRows.map((r, i) => {
                                                                const parts = (r.rentangWaktu || "").split('-');
                                                                const sStart = parts.length > 0 ? parseTimeToSeconds(parts[0]) : i * 60;
                                                                const sEnd = parts.length > 1 ? parseTimeToSeconds(parts[1]) : (sStart + 60);
                                                                const sMid = (sStart + sEnd) / 2;
                                                                const x = padL + (i / Math.max(1, mbmRows.length - 1)) * plotW;

                                                                const tvrNum = Number(r.tvr) || 0;
                                                                const shareNum = Number(r.share) || 0;
                                                                const yTvr = (padT + plotH) - (tvrNum / maxTvrVal) * plotH;
                                                                const yShare = (padT + plotH) - (shareNum / maxShareVal) * plotH;

                                                                const prevTvr = i > 0 ? (Number(mbmRows[i - 1].tvr) || 0) : null;
                                                                let delta = null;
                                                                let pct = null;
                                                                if (prevTvr !== null && prevTvr > 0) {
                                                                    delta = tvrNum - prevTvr;
                                                                    pct = (delta / prevTvr) * 100;
                                                                }

                                                                return { ...r, sStart, sEnd, sMid, x, yTvr, yShare, tvrNum, shareNum, delta, pct };
                                                            });

                                                            const activeIdx = points.findIndex(p => currentTime >= p.sStart && currentTime < p.sEnd);
                                                            const activePoint = activeIdx !== -1 ? points[activeIdx] : points[0];

                                                            let scrubberX = padL;
                                                            if (activeIdx !== -1) {
                                                                const p = points[activeIdx];
                                                                const segDur = Math.max(1, p.sEnd - p.sStart);
                                                                const segProg = Math.max(0, Math.min(1, (currentTime - p.sStart) / segDur));
                                                                const nextX = activeIdx < points.length - 1 ? points[activeIdx + 1].x : (padL + plotW);
                                                                scrubberX = p.x + segProg * (nextX - p.x);
                                                            } else if (points.length > 0) {
                                                                const totalDur = Math.max(videoDuration || 0, points[points.length - 1].sEnd || 480);
                                                                scrubberX = padL + Math.min(plotW, Math.max(0, (currentTime / totalDur) * plotW));
                                                            }

                                                            const tvrLinePath = getSmoothSvgPath(points, 'yTvr');
                                                            const shareLinePath = getSmoothSvgPath(points, 'yShare');
                                                            const tvrAreaPath = getSmoothAreaPath(points, 'yTvr', padT + plotH);
                                                            const shareAreaPath = getSmoothAreaPath(points, 'yShare', padT + plotH);

                                                            return (
                                                                <div 
                                                                    className="absolute left-2 sm:left-4 right-2 sm:right-4 bottom-12 sm:bottom-14 z-30 pointer-events-auto transition-all duration-200 select-none"
                                                                >
                                                                    <div className={"bg-slate-950/80 hover:bg-slate-950/95 backdrop-blur-md border border-white/15 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.85)] text-white transition-all overflow-hidden group/chart " + (isChartCompact ? "px-2.5 py-1.5" : "p-2 sm:p-2.5")}>
                                                                        {/* Header Bar Ringkas & Transparan */}
                                                                        <div className={"flex items-center justify-between gap-2 transition-all " + (isChartCompact ? "" : "pb-1.5 mb-1 border-b border-white/10")}>
                                                                            <div className="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
                                                                                <button 
                                                                                    type="button"
                                                                                    onClick={() => setShowChartTvr(!showChartTvr)}
                                                                                    className={"flex items-center gap-1.5 text-[11px] font-bold px-2 py-0.5 rounded-lg transition-all " + (showChartTvr ? "bg-neon/15 text-neon border border-neon/40 shadow-sm" : "opacity-40 text-slate-400 border border-transparent")}
                                                                                    title="Klik untuk tampilkan/sembunyikan data TVR (Rating Poin)"
                                                                                >
                                                                                    <span className="w-2.5 h-2.5 rounded-full bg-neon border border-black shadow-[0_0_6px_#ccff00]"></span>
                                                                                    <span>TVR (Rating)</span>
                                                                                </button>

                                                                                <button 
                                                                                    type="button"
                                                                                    onClick={() => setShowChartShare(!showChartShare)}
                                                                                    className={"flex items-center gap-1.5 text-[11px] font-bold px-2 py-0.5 rounded-lg transition-all " + (showChartShare ? "bg-sky-500/15 text-sky-300 border border-sky-400/40 shadow-sm" : "opacity-40 text-slate-400 border border-transparent")}
                                                                                    title="Klik untuk tampilkan/sembunyikan data Share (%)"
                                                                                >
                                                                                    <span className="w-2.5 h-2.5 rounded-full bg-sky-400 border border-black shadow-[0_0_6px_#38bdf8]"></span>
                                                                                    <span>Share (%)</span>
                                                                                </button>

                                                                                {!isChartCompact && (
                                                                                    <button 
                                                                                        type="button"
                                                                                        onClick={() => setShowChartDelta(!showChartDelta)}
                                                                                        className={"flex items-center gap-1 text-[10px] font-bold px-1.5 py-0.5 rounded-lg transition-all " + (showChartDelta ? "bg-emerald-500/15 text-emerald-300 border border-emerald-400/30" : "opacity-40 text-slate-400 border border-transparent")}
                                                                                        title="Tampilkan / sembunyikan badge perbandingan delta naik-turun"
                                                                                    >
                                                                                        <i className="fa-solid fa-arrow-up-right-dots text-[9px]"></i>
                                                                                        <span className="hidden sm:inline">Delta (+/-)</span>
                                                                                    </button>
                                                                                )}

                                                                                <button 
                                                                                    type="button"
                                                                                    onClick={() => setShowRatingModal(true)}
                                                                                    className="text-[10px] font-bold text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/15 px-2 py-0.5 rounded-lg transition-all flex items-center gap-1"
                                                                                    title="Impor / Tempel Data Rating Baru"
                                                                                >
                                                                                    <i className="fa-solid fa-file-import text-[9px] text-neon"></i>
                                                                                    <span className="hidden sm:inline">{t("pasteRating")}</span>
                                                                                </button>
                                                                            </div>

                                                                            {/* Area Tengah: Ketika grafik dilipat (Compact Mode), tetap munculkan angka performanya murni secara realtime & deretan menit tanpa plus/minus */}
                                                                            {isChartCompact && (
                                                                                <div className="flex-1 flex items-center justify-center gap-2 sm:gap-3 px-2 min-w-0 overflow-x-auto no-scrollbar py-0.5">
                                                                                    {/* Live Indicator Menit Aktif Video */}
                                                                                    <div className="flex-shrink-0 flex items-center gap-1.5 px-2.5 py-0.5 rounded-lg bg-white/10 border border-white/20 text-[11px] font-bold text-white shadow-inner">
                                                                                        <span className="w-2 h-2 rounded-full bg-neon animate-pulse shadow-[0_0_8px_#ccff00]"></span>
                                                                                        <span className="text-white/60 text-[10px]">{t("activeMinute")} ({formatTime(currentTime)}):</span>
                                                                                        {showChartTvr && (
                                                                                            <span className="text-neon font-black font-mono">
                                                                                                TVR {activePoint?.tvrNum !== undefined ? activePoint.tvrNum.toFixed(1) : '-'}
                                                                                            </span>
                                                                                        )}
                                                                                        {showChartTvr && showChartShare && <span className="text-white/30">•</span>}
                                                                                        {showChartShare && (
                                                                                            <span className="text-sky-300 font-black font-mono">
                                                                                                Share {activePoint?.shareNum !== undefined ? activePoint.shareNum + '%' : '-'}
                                                                                            </span>
                                                                                        )}
                                                                                        {activePoint?.unit && (
                                                                                            <span className="text-[9px] text-white/50 px-1 py-0.2 bg-white/10 rounded ml-1 border border-white/10">
                                                                                                {activePoint.unit}
                                                                                            </span>
                                                                                        )}
                                                                                    </div>

                                                                                    {/* Separator Divider */}
                                                                                    <div className="h-4 w-px bg-white/15 flex-shrink-0 hidden md:block"></div>

                                                                                    {/* Deretan Angka Performa Menit ke Menit Murni (Tanpa Badge Plus/Minus) */}
                                                                                    <div className="flex items-center gap-1 sm:gap-1.5 flex-nowrap overflow-x-auto no-scrollbar py-0.5">
                                                                                        {points.map((p, idx) => {
                                                                                            const isActive = activeIdx === idx;
                                                                                            return (
                                                                                                <button
                                                                                                    key={p.id || idx}
                                                                                                    type="button"
                                                                                                    onClick={() => {
                                                                                                        if (videoRef && videoRef.current) {
                                                                                                            videoRef.current.currentTime = p.sStart;
                                                                                                            setCurrentTime(p.sStart);
                                                                                                            notify("Lompat ke menit " + formatTime(p.sStart));
                                                                                                        }
                                                                                                    }}
                                                                                                    className={"flex-shrink-0 flex items-center gap-1 px-1.5 py-0.5 rounded-md text-[10px] font-mono transition-all " + (
