                                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">GEMINI API KEY</label>
                                                        <div className="flex items-center gap-2">
                                                            <a 
                                                                href="https://aistudio.google.com/app/apikey" 
                                                                target="_blank" 
                                                                rel="noreferrer"
                                                                className="text-[10px] text-lime-700 hover:text-lime-800 font-bold hover:underline"
                                                                title="Dapatkan Google Gemini API Key gratis"
                                                            >
                                                                Dapatkan Key Gratis
                                                            </a>
                                                            <span className="text-slate-300">•</span>
                                                            <button onClick={() => setShowApiKey(!showApiKey)} className="text-[10px] text-slate-600 hover:text-slate-900 font-bold hover:underline">
                                                                {showApiKey ? 'Tutup' : 'Lihat'}
                                                            </button>
                                                        </div>
                                                    </div>
                                                    <input 
                                                        type={showApiKey ? "text" : "password"}
                                                        value={apiKey}
                                                        onChange={(e) => setApiKey(e.target.value)}
                                                        placeholder="Masukkan API Key (AIzaSy...)"
                                                        className="w-full bg-[#f8fafc] border border-slate-200 rounded-2xl px-4 py-2.5 text-xs text-slate-800 font-mono outline-none focus:bg-white focus:border-slate-400 transition-all shadow-inner"
                                                    />
                                                    <p className="text-[10px] text-slate-400 font-medium">
                                                        API Key tersimpan aman di browser Anda untuk membaca visual video asli saat tombol Generate diklik.
                                                    </p>
                                                </div>
                                            </div>

                                            {/* SEKSI 2: ALAT PENUTUP AREA LAYAR (MASKING / EXCLUSION) */}
                                            <div className="bg-red-50/70 border border-red-200/80 rounded-2xl p-4 sm:p-5 space-y-3.5">
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center gap-2">
                                                        <span className="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
                                                        <div>
                                                            <span className="text-[11px] font-black text-red-950 uppercase tracking-wider block">
                                                                ALAT PENUTUP AREA LAYAR (MASKING / EXCLUSION)
                                                            </span>
                                                            <span className="text-[10px] text-red-700/80 font-medium">
                                                                Abaikan Chyron, Running Text, Logo, Promo & QR Code dari MBM
                                                            </span>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        <button
                                                            type="button"
                                                            onClick={() => {
                                                                setShowMasks(!showMasks);
                                                                notify(showMasks ? "Masking penutup dinonaktifkan" : "Masking penutup diaktifkan");
                                                            }}
                                                            className={`text-[10px] font-black px-3 py-1.5 rounded-xl border transition-all flex items-center gap-1.5 shadow-sm active:scale-95 ${
                                                                showMasks
                                                                    ? 'bg-red-600 text-white border-red-700 shadow-red-500/20'
                                                                    : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'
                                                            }`}
                                                            title="Aktifkan atau nonaktifkan sensor penutup area di layar video"
                                                        >
                                                            <i className={`fa-solid ${showMasks ? 'fa-eye' : 'fa-eye-slash'}`}></i>
                                                            <span>Status: {showMasks ? 'AKTIF (TAMPIL)' : 'NONAKTIF'}</span>
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* Penjelasan Ringkas & Panduan Interaktif */}
                                                <div className="bg-white/90 border border-red-100 rounded-xl p-3 text-[11px] text-slate-700 leading-relaxed shadow-inner space-y-1">
                                                    <p className="flex items-center gap-1.5 font-bold text-red-900">
                                                        <i className="fa-solid fa-circle-info text-red-500 text-xs"></i>
                                                        <span>Cara Kerja Penutup Layar:</span>
                                                    </p>
                                                    <p className="text-slate-600 pl-4 text-[10.5px]">
                                                        Area yang tertutup kotak merah transparan di atas video akan disensor secara otomatis saat AI Gemini Vision memproses gambar. AI tidak akan mencatat teks berita bawah, logo stasiun, maupun QR Code ke dalam tabel MBM.
                                                    </p>
                                                    <p className="text-slate-500 pl-4 text-[10px] italic">
                                                        💡 <strong>Tips:</strong> Klik & seret (drag) kotak merah di layar video untuk memindahkan posisi. Tarik sudut kanan bawah kotak untuk mengubah ukuran.
                                                    </p>
                                                </div>

                                                {/* Tombol Preset Cepat */}
                                                <div className="space-y-1.5">
                                                    <div className="flex items-center justify-between">
                                                        <label className="text-[10px] font-extrabold text-red-950 uppercase tracking-wider">
                                                            TAMBAH KOTAK PENUTUP PRESET & KUSTOM:
                                                        </label>
                                                        <span className="text-[10px] font-bold text-red-600">
                                                            {masks.length} Kotak Aktif
                                                        </span>
                                                    </div>
                                                    
                                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                                        <button
                                                            type="button"
                                                            onClick={() => addMask('chyron')}
                                                            className="p-2.5 rounded-xl bg-white hover:bg-red-50/80 border border-red-200 text-slate-800 hover:text-red-900 text-[11px] font-bold transition-all shadow-sm flex items-center gap-2 hover:border-red-300 active:scale-95 text-left"
                                                            title="Tutup area Chyron / teks informasi berita di kiri bawah layar"
                                                        >
                                                            <div className="w-5 h-5 rounded-lg bg-red-100 text-red-600 flex items-center justify-center shrink-0 text-[10px]">
                                                                <i className="fa-solid fa-align-left"></i>
                                                            </div>
                                                            <span className="font-black text-xs truncate">Chyron Bawah</span>
                                                        </button>

                                                        <button
                                                            type="button"
                                                            onClick={() => addMask('qrcode')}
                                                            className="p-2.5 rounded-xl bg-white hover:bg-red-50/80 border border-red-200 text-slate-800 hover:text-red-900 text-[11px] font-bold transition-all shadow-sm flex items-center gap-2 hover:border-red-300 active:scale-95 text-left"
                                                            title="Tutup area QR Code di kanan bawah layar"
                                                        >
                                                            <div className="w-5 h-5 rounded-lg bg-red-100 text-red-600 flex items-center justify-center shrink-0 text-[10px]">
                                                                <i className="fa-solid fa-qrcode"></i>
                                                            </div>
                                                            <span className="font-black text-xs truncate">QR Code</span>
                                                        </button>

                                                        <button
                                                            type="button"
                                                            onClick={() => addMask('logo')}
                                                            className="p-2.5 rounded-xl bg-white hover:bg-red-50/80 border border-red-200 text-slate-800 hover:text-red-900 text-[11px] font-bold transition-all shadow-sm flex items-center gap-2 hover:border-red-300 active:scale-95 text-left"
                                                            title="Tutup area Logo stasiun TV dan Jam di kiri atas layar"
                                                        >
                                                            <div className="w-5 h-5 rounded-lg bg-red-100 text-red-600 flex items-center justify-center shrink-0 text-[10px]">
                                                                <i className="fa-solid fa-tv"></i>
                                                            </div>
                                                            <span className="font-black text-xs truncate">Logo / Jam TV</span>
                                                        </button>

                                                        <button
                                                            type="button"
                                                            onClick={() => addMask('promo')}
                                                            className="p-2.5 rounded-xl bg-white hover:bg-red-50/80 border border-red-200 text-slate-800 hover:text-red-900 text-[11px] font-bold transition-all shadow-sm flex items-center gap-2 hover:border-red-300 active:scale-95 text-left"
                                                            title="Tutup promo program / tayang nanti di kanan atas layar"
                                                        >
                                                            <div className="w-5 h-5 rounded-lg bg-red-100 text-red-600 flex items-center justify-center shrink-0 text-[10px]">
                                                                <i className="fa-solid fa-bullhorn"></i>
                                                            </div>
                                                            <span className="font-black text-xs truncate">Promo Program</span>
                                                        </button>

                                                        <button
                                                            type="button"
                                                            onClick={() => addMask('custom')}
                                                            className="p-2.5 rounded-xl bg-white hover:bg-red-50/80 border border-red-200 text-slate-800 hover:text-red-900 text-[11px] font-bold transition-all shadow-sm flex items-center gap-2 hover:border-red-300 active:scale-95 text-left"
                                                            title="Tambahkan kotak penutup bebas baru di tengah layar"
                                                        >
                                                            <div className="w-5 h-5 rounded-lg bg-red-100 text-red-600 flex items-center justify-center shrink-0 text-[10px]">
                                                                <i className="fa-solid fa-plus"></i>
                                                            </div>
                                                            <span className="font-black text-xs truncate">+ Kotak Bebas</span>
                                                        </button>

                                                        <button
                                                            type="button"
                                                            onClick={resetMasksToDefault}
                                                            className="p-2.5 rounded-xl bg-red-100/60 hover:bg-red-100 border border-red-300 text-red-900 text-[11px] font-bold transition-all shadow-sm flex items-center gap-2 active:scale-95 text-left"
                                                            title="Kembalikan konfigurasi penutup ke standar (Chyron & QR Code)"
                                                        >
                                                            <div className="w-5 h-5 rounded-lg bg-red-200 text-red-700 flex items-center justify-center shrink-0 text-[10px]">
                                                                <i className="fa-solid fa-rotate-left"></i>
                                                            </div>
                                                            <span className="font-black text-xs truncate">Reset Standar</span>
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* Daftar Kotak Masking yang Sedang Aktif */}
                                                <div className="pt-2 border-t border-red-200/60">
                                                    <div className="flex items-center justify-between mb-2">
                                                        <span className="text-[10px] font-extrabold text-red-950 uppercase tracking-wider">
                                                            DAFTAR PENUTUP AKTIF ({masks.length})
                                                        </span>
                                                        {masks.length > 0 && (
                                                            <button
                                                                type="button"
                                                                onClick={clearAllMasks}
                                                                className="text-[10px] font-bold text-red-600 hover:text-red-800 hover:underline flex items-center gap-1 transition-colors"
                                                                title="Hapus semua kotak penutup"
                                                            >
                                                                <i className="fa-solid fa-trash-can text-[9px]"></i>
                                                                <span>Hapus Semua</span>
                                                            </button>
                                                        )}
                                                    </div>

                                                    {masks.length === 0 ? (
                                                        <div className="p-3 rounded-xl bg-white/70 border border-dashed border-red-200 text-center text-[11px] text-slate-500 font-medium">
                                                            Belum ada kotak penutup aktif. Klik tombol preset di atas untuk menambahkan penutup area.
                                                        </div>
                                                    ) : (
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                            {masks.map((mask) => (
                                                                <div
                                                                    key={mask.id}
                                                                    className="bg-white/95 border border-red-200 rounded-xl p-2.5 px-3 flex items-center justify-between shadow-sm hover:border-red-400 transition-colors"
                                                                >
                                                                    <div className="flex items-center gap-2 overflow-hidden">
                                                                        <span className="w-3.5 h-3.5 rounded bg-red-600/30 border border-red-500 shrink-0"></span>
                                                                        <span className="font-bold text-xs text-slate-800 truncate">
                                                                            {mask.name ? mask.name.replace(/\s*kiri\s*atas\s*/gi, '').trim() : mask.name}
                                                                        </span>
                                                                    </div>
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => deleteMask(mask.id)}
                                                                        className="w-6 h-6 rounded-lg bg-red-50 hover:bg-red-600 text-red-500 hover:text-white flex items-center justify-center transition-all text-xs shrink-0 ml-2"
                                                                        title="Hapus kotak penutup ini"
                                                                    >
                                                                        <i className="fa-solid fa-xmark"></i>
                                                                    </button>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            {/* SEKSI 3: SINOPSIS / RINGKASAN */}
                                            <div className="bg-amber-50/60 border border-amber-200/80 rounded-2xl p-4 sm:p-5 space-y-2.5">
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center gap-2">
                                                        <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                                                        <span className="text-[11px] font-black text-amber-900 uppercase tracking-wider">
                                                            SINOPSIS / RINGKASAN GLOBAL
                                                        </span>
                                                    </div>
                                                    <span className="text-[10px] text-amber-700 font-bold">Diekspor ke Excel</span>
                                                </div>
                                                <textarea 
                                                    value={synopsis}
                                                    onChange={(e) => setSynopsis(e.target.value)}
                                                    rows={7}
                                                    placeholder="Tuliskan atau hasil generate sinopsis global tayangan..."
                                                    className="w-full min-h-[170px] text-[13px] text-slate-800 font-medium leading-relaxed bg-white/95 p-3.5 rounded-xl border border-amber-200/80 outline-none focus:bg-white resize-y shadow-inner transition-all"
                                                />
                                            </div>
                                        </>
                                    )}

                                </div>
                            ) : (
                                <button 
                                    onClick={() => {
                                        setIsToolsVisible(true);
                                        setIsToolsCollapsed(false);
                                        notify("Box Tools dibuka kembali");
                                    }}
                                    className="w-full py-4 px-6 rounded-2xl border-2 border-dashed border-slate-300 hover:border-slate-400 bg-white/80 hover:bg-white text-slate-600 hover:text-slate-900 text-xs font-black flex items-center justify-center gap-2.5 transition-all shadow-sm group"
                                >
                                    <i className="fa-solid fa-sliders text-blue-600 group-hover:scale-110 transition-transform"></i>
                                    <span>Buka Kembali Box Menu & Tools</span>
                                </button>
                            )}

                        </div>

                        {/* ===================================================== */}
                        {/* KOLOM KANAN (5 Kolom): ATTACHMENT 2 - DAFTAR TABEL MBM*/}
                        {/* (SEPERTI YOUTUBE PLAYLIST / CHAPTERS DI SEBELAH KANAN) */}
                        {/* ===================================================== */}
                        <div className="col-span-12 lg:col-span-5 flex flex-col gap-6 sticky top-20">
                            {isMbmVisible ? (
                                <div 
                                    style={{
                                        transform: `translate3d(${boxPositions.mbm.x}px, ${boxPositions.mbm.y}px, 0)`,
                                        zIndex: zIndices.mbm
                                    }}
                                    onMouseDown={() => bringToFront('mbm')}
                                    className="bg-white rounded-3xl border border-slate-200/90 shadow-[0_10px_35px_rgba(0,0,0,0.04)] p-6 sm:p-7 flex flex-col gap-4 relative overflow-hidden transition-shadow"
                                >
                                    
                                    {/* Watermark samar di kanan bawah */}
                                    <div className="absolute right-4 bottom-2 text-2xl font-black text-slate-200/60 select-none pointer-events-none tracking-wider">
                                        {watermarkText}
                                    </div>

                                    {/* Mac OS Window Dots & Action Buttons (Drag Handle) */}
                                    <div 
                                        onMouseDown={(e) => handleStartDrag('mbm', e)}
                                        onTouchStart={(e) => handleStartDrag('mbm', e)}
                                        className="flex items-center justify-between pb-2 border-b border-slate-100 cursor-grab active:cursor-grabbing select-none"
                                        title="Klik & tahan di sini untuk menggeser box Tabel MBM (Drag)"
                                    >
                                        <div className="window-dots">
                                            <div className="window-dot"></div>
                                            <div className="window-dot"></div>
                                            <div className="window-dot"></div>
                                        </div>


                                        <div className="flex items-center gap-1.5 text-slate-400 text-xs">
                                            <button 
                                                onClick={() => {
                                                    resetBoxPosition('mbm');
                                                    notify("Posisi Box Tabel MBM dikembalikan ke awal!");
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-slate-100 hover:text-slate-800 flex items-center justify-center transition-all"
                                                title="Kembalikan posisi awal box Tabel MBM"
                                            >
                                                <i className="fa-solid fa-rotate-left"></i>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    setIsMbmCollapsed(!isMbmCollapsed);
                                                    notify(isMbmCollapsed ? "Tabel MBM diperluas" : "Tabel MBM diminimalkan");
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-slate-100 hover:text-slate-800 flex items-center justify-center transition-all"
                                                title={isMbmCollapsed ? "Perbesar Tabel MBM" : "Kecilkan / Minimize Tabel MBM"}
                                            >
                                                <i className={`fa-solid ${isMbmCollapsed ? 'fa-plus' : 'fa-minus'}`}></i>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    setIsMbmVisible(false);
                                                    notify("Daftar Tabel MBM disembunyikan. Klik tombol untuk membuka kembali.");
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-red-50 hover:text-red-500 flex items-center justify-center transition-all"
                                                title="Tutup / Sembunyikan Tabel MBM"
                                            >
                                                <i className="fa-solid fa-xmark"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Jika Diminimalkan */}
                                    {isMbmCollapsed ? (
                                        <div 
                                            onClick={() => setIsMbmCollapsed(false)}
                                            className="py-1 flex items-center justify-between text-xs font-bold text-slate-500 cursor-pointer hover:text-slate-800 transition-colors"
                                        >
                                            <div className="flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-blue-600"></span>
                                                <span>Hasil MBM: {filteredRows.length} Segmen Terdata</span>
                                            </div>
                                            <span className="text-blue-600 text-[11px] font-black hover:underline flex items-center gap-1">
                                                <span>Buka Penuh Tabel</span>
                                                <i className="fa-solid fa-chevron-down text-[9px]"></i>
                                            </span>
                                        </div>
                                    ) : (
                                        <>
                                            {/* Header Judul Box Kanan */}
                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <div>
                                        <h3 className="font-black text-lg text-slate-900 tracking-tight">
                                            <span>{t("mbmResult")}</span>
                                        </h3>
                                        <p className="text-xs text-slate-400 font-semibold mt-0.5">
                                            {t("totalSegments")}: {filteredRows.length}
                                        </p>
                                    </div>

                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={handleGenerateMBM}
                                            disabled={isGenerating}
                                            className="bg-neon hover:bg-neon-dark text-obsidian text-xs font-black px-4 py-2 rounded-xl transition-all shadow-sm flex items-center gap-2 active:scale-95"
                                            title={generationSpeedMode === 'turbo' ? "Generate MBM Kilat (5–10 detik)" : "Generate MBM Audio Paralel (15–25 detik)"}
                                        >
                                            {isGenerating ? (
                                                <i className="fa-solid fa-spinner animate-spin text-xs"></i>
                                            ) : (
                                                <i className="fa-solid fa-wand-magic-sparkles text-[11px]"></i>
                                            )}
                                            <span>{generationSpeedMode === "turbo" ? t("generateAiTurbo") : t("generateAiParallel")}</span>
                                        </button>
                                    </div>
                                </div>

                                {/* TOOLBAR PENCARIAN & AKSI MBM (Persis Header Attachment 2) */}
                                <div className="flex flex-col sm:flex-row items-center justify-between gap-2.5">
                                    <div className="relative w-full sm:flex-1">
                                        <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                        <input 
                                            type="text"
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            placeholder={t("searchPlaceholderFull")}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-800 font-bold outline-none focus:bg-white focus:border-slate-400"
                                        />
                                    </div>

                                    <div className="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
                                        <button 
                                            onClick={() => setShowRatingModal(true)}
                                            className="bg-[#f4fce3] hover:bg-[#eaf9cc] text-slate-900 border border-limeBorder text-[11px] font-black px-3 py-2 rounded-xl transition-all shadow-sm shrink-0 active:scale-95 flex items-center gap-1.5"
                                            title="Tempel atau impor data TVR, Share, dan Unit dari Excel Nielsen"
                                        >
                                            <i className="fa-solid fa-chart-line text-lime-700 text-[10px]"></i>
                                            <span>{t("pasteNielsen")}</span>
                                        </button>

                                        <button 
                                            onClick={addManualRow}
                                            className="bg-obsidian hover:bg-black text-neon text-[11px] font-black px-3.5 py-2 rounded-xl transition-all shadow-sm shrink-0 active:scale-95 flex items-center gap-1.5"
                                            title="Tambah baris segmen adegan baru secara manual"
                                        >
                                            <i className="fa-solid fa-plus text-[10px]"></i>
                                            <span>{t("addSegment")}</span>
                                        </button>
                                    </div>
                                </div>

                                {/* TABEL MBM PERSIS ATTACHMENT 2 DENGAN BADGE RATING LENGKAP */}
                                <div className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm bg-white">
                                    
                                    {/* Header Tabel MBM Gelap */}
                                    <div className="grid grid-cols-12 bg-obsidian text-white py-3 px-3.5 text-xs font-black tracking-wide border-b border-slate-800">
                                        <div className="col-span-5 flex items-center justify-between text-neon pr-2">
                                            <span className="text-[11px]">Rentang Waktu & Rating</span>
                                            <button 
                                                onClick={() => setIsAutoScrollMbm(!isAutoScrollMbm)}
                                                className={`text-[9px] font-bold px-1.5 py-0.5 rounded transition-all ${
                                                    isAutoScrollMbm ? 'bg-neon/20 text-neon' : 'bg-slate-800 text-slate-400'
                                                }`}
                                                title="Auto-scroll tabel mengikuti video yang sedang berjalan"
                                            >
                                                Auto-Scroll: {isAutoScrollMbm ? 'ON' : 'OFF'}
                                            </button>
                                        </div>
                                        <div className="col-span-7 flex items-center justify-between">
                                            <span className="text-[11px]">Deskripsi Adegan & Dialog</span>
                                        </div>
                                    </div>

                                    {/* Daftar Baris Adegan MBM (Scrollable seperti Playlist YouTube) */}
                                    <div ref={mbmListRef} className="divide-y divide-slate-100 max-h-[600px] overflow-y-auto custom-scroll">
                                        {filteredRows.length === 0 ? (
                                            <div className="text-center py-12 text-slate-400 text-xs font-bold">
                                                Tidak ada adegan yang cocok dengan pencarian "{searchTerm}".
                                            </div>
                                        ) : (
                                            filteredRows.map((row, idx) => {
                                                const isRowActive = row.id === activeRowId;
                                                return (
                                                    <div 
                                                        key={row.id}
                                                        ref={(el) => { if (el) rowRefs.current[row.id] = el; }}
                                                        className={`grid grid-cols-12 py-3 px-3 transition-all group items-start gap-2.5 ${
                                                            isRowActive 
                                                                ? 'bg-[#f4fce3] border-l-4 border-neon shadow-md ring-1 ring-limeBorder scale-[1.008]' 
                                                                : 'hover:bg-slate-50'
                                                        }`}
                                                    >
                                                        {/* Kolom Rentang Waktu + Metrik TVR/Share/Unit + Tombol Play Segmen */}
                                                        <div className="col-span-5 space-y-1.5">
                                                            <div className="flex items-center gap-1.5 flex-wrap">
                                                                <span className={`w-4 h-4 rounded font-black text-[9px] flex items-center justify-center shrink-0 ${
                                                                    isRowActive ? 'bg-neon text-obsidian shadow-sm' : 'bg-slate-100 text-slate-500'
                                                                }`}>
                                                                    {idx + 1}
                                                                </span>
                                                                <input 
                                                                    type="text"
                                                                    value={row.rentangWaktu}
                                                                    onChange={(e) => updateRow(row.id, 'rentangWaktu', e.target.value)}
                                                                    className="font-mono text-[11px] font-black text-slate-800 bg-transparent border-b border-transparent focus:border-slate-400 outline-none w-24"
                                                                />
                                                                {isRowActive && (
                                                                    <span className="text-[8px] font-black uppercase text-obsidian bg-neon px-1.5 py-0.5 rounded-full flex items-center gap-1 shadow-sm animate-pulse">
                                                                        <span className="w-1.5 h-1.5 rounded-full bg-obsidian-dark"></span>
                                                                        Sedang Tayang
                                                                    </span>
                                                                )}
                                                            </div>

                                                            {/* Rating Badges: TVR, Share, Unit */}
                                                            {(row.tvr !== undefined || row.share !== undefined || row.unit !== undefined) && (
                                                                <div className="flex items-center gap-1 flex-wrap">
                                                                    {row.tvr !== undefined && row.tvr !== null && row.tvr !== "" && (
                                                                        <span 
                                                                            className="text-[9px] font-black px-1.5 py-0.5 rounded bg-limePill text-limeText border border-limeBorder font-mono shadow-xs cursor-pointer hover:scale-105 transition-transform"
                                                                            title="TVR (Rating Point) - Klik untuk edit"
                                                                            onClick={() => setEditingRow({ ...row, index: idx + 1 })}
                                                                        >
                                                                            TVR {row.tvr}
                                                                        </span>
                                                                    )}
                                                                    {row.share !== undefined && row.share !== null && row.share !== "" && (
                                                                        <span 
                                                                            className="text-[9px] font-black px-1.5 py-0.5 rounded bg-sky-50 text-sky-700 border border-sky-200 font-mono shadow-xs cursor-pointer hover:scale-105 transition-transform"
                                                                            title="Audience Share (%) - Klik untuk edit"
                                                                            onClick={() => setEditingRow({ ...row, index: idx + 1 })}
                                                                        >
                                                                            Sh: {row.share}%
                                                                        </span>
                                                                    )}
                                                                    {row.unit !== undefined && row.unit !== null && row.unit !== "" && (
                                                                        <span 
                                                                            className={`text-[8.5px] font-extrabold px-1.5 py-0.5 rounded border shadow-xs cursor-pointer hover:scale-105 transition-transform truncate max-w-[85px] ${
                                                                                String(row.unit).toLowerCase().includes('iklan') || String(row.unit).toLowerCase().includes('break') || String(row.unit).toLowerCase().includes('ads')
                                                                                    ? 'bg-amber-100 text-amber-900 border-amber-300'
                                                                                    : 'bg-slate-100 text-slate-700 border-slate-200'
                                                                            }`}
                                                                            title={`Unit: ${row.unit} - Klik untuk edit`}
                                                                            onClick={() => setEditingRow({ ...row, index: idx + 1 })}
                                                                        >
                                                                            {row.unit}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            )}
                                                            
                                                            {/* Tombol Play Segmen Berwarna Neon Khas Attachment 2 */}
                                                            <button 
                                                                onClick={() => seekToRow(row.rentangWaktu)}
                                                                className="text-[10px] font-black text-obsidian bg-neon hover:bg-neon-dark px-2.5 py-1 rounded-md flex items-center gap-1 shadow-sm transition-all active:scale-95"
                                                                title="Putar video preview pada segmen ini"
                                                            >
                                                                <i className="fa-solid fa-play text-[8px]"></i>
                                                                <span>Play Segmen</span>
                                                            </button>
                                                        </div>

                                                    {/* Kolom Deskripsi Adegan */}
                                                    <div className="col-span-7 flex items-start gap-1.5">
                                                        <textarea 
                                                            value={row.deskripsi}
                                                            onChange={(e) => updateRow(row.id, 'deskripsi', e.target.value)}
                                                            rows={Math.max(3, Math.min(10, (row.deskripsi.split('\n').length || 1) + 1))}
                                                            className="w-full text-[11px] font-medium text-slate-800 bg-transparent border border-transparent hover:border-slate-200 focus:border-blue-500 focus:bg-white rounded-lg p-1.5 outline-none resize-y leading-relaxed transition-all whitespace-pre-wrap"
                                                        />
                                                        <div className="flex items-center gap-0.5 opacity-70 group-hover:opacity-100 transition-opacity shrink-0 pt-0.5">
                                                            <button 
                                                                onClick={() => setEditingRow({ ...row, index: idx + 1 })}
                                                                className="text-slate-400 hover:text-blue-600 p-1 rounded hover:bg-blue-50 transition-colors"
                                                                title="Menu Edit adegan ini"
                                                            >
                                                                <i className="fa-solid fa-pen-to-square text-[11px]"></i>
                                                            </button>
                                                            <button 
                                                                onClick={() => deleteRow(row.id)}
                                                                className="text-slate-400 hover:text-red-500 p-1 rounded hover:bg-red-50 transition-colors"
                                                                title="Hapus baris ini"
                                                            >
                                                                <i className="fa-solid fa-trash-can text-[11px]"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                                );
                                            })
                                        )}
                                    </div>

                                </div>

                                        </>
                                    )}

                                </div>
                            ) : (
                                <button 
                                    onClick={() => {
                                        setIsMbmVisible(true);
                                        setIsMbmCollapsed(false);
                                        notify("Daftar Tabel MBM dibuka kembali");
                                    }}
                                    className="w-full py-4 px-6 rounded-2xl border-2 border-dashed border-slate-300 hover:border-slate-400 bg-white/80 hover:bg-white text-slate-600 hover:text-slate-900 text-xs font-black flex items-center justify-center gap-2.5 transition-all shadow-sm group"
                                >
                                    <i className="fa-solid fa-list-check text-blue-600 group-hover:scale-110 transition-transform"></i>
                                    <span>Buka Kembali Daftar Tabel MBM</span>
                                </button>
                            )}

                        </div>

                    </div>

                    {/* ======================================================== */}
                    {/* MODAL AKTIVASI GEMINI API KEY                           */}
                    {/* ======================================================== */}
                    {showApiKeyModal && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fadeIn">
                            <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 space-y-4">
                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <div className="flex items-center gap-2.5">
                                        <div className="w-8 h-8 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center text-sm font-black">
                                            <i className="fa-solid fa-key"></i>
                                        </div>
                                        <div>
                                            <h3 className="font-black text-base text-slate-900">Aktifkan Analisis AI Video Nyata</h3>
                                            <p className="text-[11px] font-semibold text-slate-400">Google Gemini Multimodal Vision</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setShowApiKeyModal(false)}
                                        className="text-slate-400 hover:text-slate-700 p-1 text-sm rounded-lg hover:bg-slate-100 transition-colors"
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-3 text-xs leading-relaxed text-slate-600">
                                    <p>
                                        Saat ini sistem belum memiliki <strong className="text-slate-900">Google Gemini API Key</strong>.
                                    </p>
                                    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3.5 space-y-1.5 text-amber-900">
                                        <div className="font-extrabold flex items-center gap-1.5">
                                            <i className="fa-solid fa-circle-info text-amber-600"></i>
                                            <span>Kenapa Video Berbeda Hasilnya Sama di Demo?</span>
                                        </div>
                                        <p className="text-[11px] leading-normal text-amber-800">
                                            Tanpa API Key, tombol <em>Generate</em> hanya menjalankan <strong>simulasi template layout</strong>. Untuk memproses gambar visual, tokoh, dialog, dan chyron dari video <span className="font-mono font-bold">{uploadedFileName}</span> secara otomatis, AI membutuhkan API Key Gemini.
                                        </p>
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            Masukkan Gemini API Key Anda:
                                        </label>
                                        <input 
                                            type="text"
                                            value={tempApiKey}
                                            onChange={(e) => setTempApiKey(e.target.value)}
                                            placeholder="Tempel API Key di sini (AIzaSy...)"
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-mono font-bold text-slate-800 outline-none focus:bg-white focus:border-slate-400 shadow-inner"
                                        />
                                        <div className="flex items-center justify-between mt-1 px-1">
                                            <span className="text-[10px] text-slate-400">Belum punya API Key?</span>
                                            <a 
                                                href="https://aistudio.google.com/app/apikey" 
                                                target="_blank" 
                                                rel="noreferrer"
                                                className="text-[10px] font-bold text-blue-600 hover:underline"
                                            >
                                                Ambil Gratis di Google AI Studio &rarr;
                                            </a>
                                        </div>
                                    </div>

                                    {/* Rekomendasi Fitur/Model Gemini di Modal */}
                                    <div className="space-y-1.5 pt-1">
                                        <div className="flex items-center justify-between">
                                            <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">
                                                REKOMENDASI MODEL GEMINI:
                                            </label>
                                            <span className="text-[9px] font-mono text-emerald-600 font-bold">Terpilih: {selectedModel}</span>
                                        </div>
                                        <div className="grid grid-cols-2 gap-1.5">
                                            {geminiModelOptions.map((opt) => (
                                                <button
                                                    key={opt.id}
                                                    type="button"
                                                    onClick={() => {
                                                        setSelectedModel(opt.id);
                                                        localStorage.setItem('mbm_model', opt.id);
                                                    }}
                                                    className={`p-2 rounded-xl text-left border text-xs font-bold transition-all flex flex-col justify-between ${
                                                        selectedModel === opt.id
                                                            ? 'bg-obsidian text-neon border-obsidian shadow-sm ring-1 ring-neon/50'
                                                            : 'bg-[#f8fafc] text-slate-700 border-slate-200 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    <div className="flex items-center justify-between text-[11px] w-full">
                                                        <span>{opt.name}</span>
                                                        <span className={`text-[8px] px-1 py-0.2 rounded font-black ${
                                                            selectedModel === opt.id ? 'bg-neon text-obsidian' : 'bg-slate-200 text-slate-600'
                                                        }`}>
                                                            {opt.badge}
                                                        </span>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="flex flex-col sm:flex-row items-center justify-between gap-2 pt-3 border-t border-slate-100">
                                    <button 
                                        onClick={() => {
                                            setShowApiKeyModal(false);
                                            runGenerate(false); // Jalankan demo
                                        }}
                                        className="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-all text-center"
                                    >
                                        Jalankan Demo Saja
                                    </button>
                                    <button 
                                        onClick={() => {
                                            if (!tempApiKey || tempApiKey.trim().length < 8) {
                                                alert("Harap masukkan API Key Gemini yang valid terlebih dahulu!");
                                                return;
                                            }
                                            setApiKey(tempApiKey.trim());
                                            localStorage.setItem('mbm_apiKey', tempApiKey.trim());
                                            setShowApiKeyModal(false);
                                            runGenerate(true);
                                        }}
                                        className="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs font-black bg-obsidian text-neon hover:bg-black transition-all shadow-md active:scale-95 flex items-center justify-center gap-1.5"
                                    >
                                        <i className="fa-solid fa-wand-magic-sparkles text-xs"></i>
                                        <span>Simpan & Analisis AI Sekarang</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ======================================================== */}
                    {/* MODAL MENU EDIT BARIS MBM                              */}
                    {/* ======================================================== */}
                    {!isVideoZoomed && renderEditRowModal()}
                    {false && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fadeIn">
                            <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 space-y-4">
                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <div className="flex items-center gap-2">
                                        <span className="w-6 h-6 rounded-lg bg-blue-100 text-blue-700 font-black text-xs flex items-center justify-center">
                                            #{editingRow.index}
                                        </span>
                                        <h3 className="font-black text-base text-slate-900">Menu Edit Segmen MBM</h3>
                                    </div>
                                    <button 
                                        onClick={() => setEditingRow(null)}
                                        className="text-slate-400 hover:text-slate-700 p-1 text-sm rounded-lg hover:bg-slate-100 transition-colors"
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-3">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                                Rentang Waktu (Timecode)
                                            </label>
                                            <input 
                                                type="text"
                                                value={editingRow.rentangWaktu}
                                                onChange={(e) => setEditingRow({ ...editingRow, rentangWaktu: e.target.value })}
                                                className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-mono font-bold text-slate-800 outline-none focus:bg-white focus:border-slate-400"
                                                placeholder="00:00 - 01:00"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                                Unit / Segmen
                                            </label>
                                            <input 
                                                type="text"
                                                value={editingRow.unit || ""}
                                                onChange={(e) => setEditingRow({ ...editingRow, unit: e.target.value })}
                                                className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-800 outline-none focus:bg-white focus:border-slate-400"
                                                placeholder="Segmen 1 / Break Iklan"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                                TVR (Rating Point)
                                            </label>
                                            <input 
                                                type="number"
                                                step="0.1"
                                                value={editingRow.tvr !== undefined && editingRow.tvr !== null ? editingRow.tvr : ""}
                                                onChange={(e) => setEditingRow({ ...editingRow, tvr: e.target.value })}
                                                className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-mono font-black text-slate-900 outline-none focus:bg-white focus:border-slate-400"
                                                placeholder="2.8"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                                Audience Share (%)
                                            </label>
                                            <input 
                                                type="number"
                                                step="0.1"
                                                value={editingRow.share !== undefined && editingRow.share !== null ? editingRow.share : ""}
                                                onChange={(e) => setEditingRow({ ...editingRow, share: e.target.value })}
                                                className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-mono font-black text-slate-900 outline-none focus:bg-white focus:border-slate-400"
                                                placeholder="14.5"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block mb-1">
                                            Deskripsi Adegan
                                        </label>
                                        <textarea 
                                            value={editingRow.deskripsi}
                                            onChange={(e) => setEditingRow({ ...editingRow, deskripsi: e.target.value })}
                                            rows={5}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl p-3 text-xs font-medium text-slate-800 outline-none focus:bg-white focus:border-slate-400 leading-relaxed resize-y"
                                            placeholder="Tuliskan deskripsi adegan..."
                                        />
                                    </div>
                                </div>

                                <div className="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                                    <button 
                                        onClick={() => setEditingRow(null)}
                                        className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-all"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={() => {
                                            updateRow(editingRow.id, 'rentangWaktu', editingRow.rentangWaktu);
                                            updateRow(editingRow.id, 'deskripsi', editingRow.deskripsi);
                                            updateRow(editingRow.id, 'tvr', editingRow.tvr !== "" && editingRow.tvr !== null ? Number(editingRow.tvr) : null);
                                            updateRow(editingRow.id, 'share', editingRow.share !== "" && editingRow.share !== null ? Number(editingRow.share) : null);
                                            updateRow(editingRow.id, 'unit', editingRow.unit || null);
                                            setEditingRow(null);
                                            notify("Perubahan adegan & rating berhasil disimpan!");
                                        }}
                                        className="px-4 py-2 rounded-xl text-xs font-black bg-obsidian text-neon hover:bg-black transition-all shadow-sm active:scale-95 flex items-center gap-1.5"
                                    >
                                        <span>Simpan Perubahan</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ======================================================== */}
                    {/* MODAL TEMPEL / IMPOR DATA RATING NIELSEN (FITUR C)        */}
                    {/* ======================================================== */}
                    {!isVideoZoomed && renderRatingModal()}
                    {false && (
                        <div className="fixed inset-0 z-[65] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-fadeIn">
                            <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-xl w-full p-6 space-y-4">
                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <div className="flex items-center gap-2.5">
                                        <div className="w-8 h-8 rounded-xl bg-neon text-obsidian flex items-center justify-center text-sm font-black shadow-sm">
                                            <i className="fa-solid fa-chart-line"></i>
                                        </div>
                                        <div>
                                            <h3 className="font-black text-base text-slate-900">Tempel Data Rating Nielsen (TVR, Share, Unit)</h3>
                                            <p className="text-[11px] text-slate-500 font-medium">Salin langsung kolom dari Excel riset, lalu paste di bawah ini.</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setShowRatingModal(false)}
                                        className="text-slate-400 hover:text-slate-700 p-1 text-sm rounded-lg hover:bg-slate-100 transition-colors"
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-3">
                                    <div className="bg-slate-50 border border-slate-200 rounded-2xl p-3 text-slate-600 text-xs space-y-1">
                                        <p className="font-bold text-slate-800 flex items-center gap-1.5">
                                            <i className="fa-solid fa-circle-info text-lime-700"></i>
                                            <span>Format yang Didukung (Bisa langsung Copy & Paste dari Excel):</span>
                                        </p>
                                        <p className="font-mono text-[10.5px] text-slate-500 pl-4">
                                            Kolom 1: Rentang Waktu (opsional)<br />
                                            Kolom 2: <strong>TVR</strong> (angka rating)<br />
                                            Kolom 3: <strong>SHARE (%)</strong> (angka pangsa pemirsa)<br />
                                            Kolom 4: <strong>UNIT</strong> (Segmen tayangan / Iklan)
                                        </p>
                                    </div>

                                    <div>
                                        <div className="flex items-center justify-between mb-1.5">
                                            <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">
                                                Area Tempel Data Teks:
                                            </label>
                                            <button 
                                                type="button"
                                                onClick={() => {
                                                    const sampleText = `00:00 - 01:00\t2.4\t12.8\tSegmen 1\n01:00 - 02:00\t2.7\t14.2\tSegmen 1\n02:00 - 03:00\t3.1\t16.5\tSegmen 1\n03:00 - 04:00\t1.8\t9.1\tBreak Iklan 1\n04:00 - 05:00\t3.4\t17.8\tSegmen 2\n05:00 - 06:00\t3.7\t18.9\tSegmen 2\n06:00 - 07:00\t3.5\t17.4\tSegmen 2\n07:00 - 08:00\t1.9\t9.5\tBreak Iklan 2\n08:00 - 09:00\t3.6\t18.2\tSegmen 3\n09:00 - 10:00\t3.2\t16.0\tSegmen 3`;
                                                    setPastedRatingText(sampleText);
                                                    notify("Contoh data rating Nielsen dimuat!");
                                                }}
                                                className="text-[10px] font-bold text-lime-700 hover:text-lime-900 bg-limePill px-2 py-0.5 rounded-md hover:underline"
                                            >
                                                + Gunakan Contoh Data Rating
                                            </button>
                                        </div>
                                        <textarea 
                                            value={pastedRatingText}
                                            onChange={(e) => setPastedRatingText(e.target.value)}
                                            rows={8}
                                            placeholder={"Tempel data Excel di sini...\nContoh:\n00:00 - 01:00\t2.4\t12.8\tSegmen 1\n01:00 - 02:00\t2.7\t14.2\tSegmen 1"}
                                            className="w-full bg-[#f8fafc] border border-slate-200 rounded-xl p-3 text-xs font-mono font-medium text-slate-800 outline-none focus:bg-white focus:border-slate-400 resize-y leading-relaxed shadow-inner"
                                        />
                                    </div>
                                </div>

                                <div className="flex items-center justify-end gap-2.5 pt-2 border-t border-slate-100">
                                    <button 
                                        onClick={() => setShowRatingModal(false)}
                                        className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition-all"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={() => parseAndApplyRatingData(pastedRatingText)}
                                        className="px-5 py-2.5 rounded-xl text-xs font-black bg-neon text-obsidian hover:bg-neon-dark transition-all shadow-md active:scale-95 flex items-center gap-1.5"
                                    >
                                        <i className="fa-solid fa-check text-xs"></i>
                                        <span>Terapkan Data Rating & Buka Grafik</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
