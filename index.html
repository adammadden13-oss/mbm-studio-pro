                                                                                                            <g transform={"translate(" + p.x + ", " + (p.yTvr - 12) + ")"}>
                                                                                                                <rect 
                                                                                                                    x="-22" 
                                                                                                                    y="-6.5" 
                                                                                                                    width="44" 
                                                                                                                    height="13" 
                                                                                                                    rx="6" 
                                                                                                                    fill={isPositive ? "#064e3b" : "#4c0519"} 
                                                                                                                    stroke={isPositive ? "#10b981" : "#f43f5e"} 
                                                                                                                    strokeWidth="0.8" 
                                                                                                                />
                                                                                                                <text 
                                                                                                                    x="0" 
                                                                                                                    y="2.5" 
                                                                                                                    fill={isPositive ? "#6ee7b7" : "#fda4af"} 
                                                                                                                    fontSize="6.5" 
                                                                                                                    fontWeight="bold" 
                                                                                                                    textAnchor="middle"
                                                                                                                >
                                                                                                                    {(isPositive ? "▲ +" : "▼ -") + Math.abs(p.delta).toFixed(1) + " | " + Math.abs(p.pct).toFixed(0) + "%"}
                                                                                                                </text>
                                                                                                            </g>
                                                                                                        )}
                                                                                                    </>
                                                                                                )}

                                                                                                {/* Sumbu X Label Miring (-22 Derajat) */}
                                                                                                <text 
                                                                                                    transform={"rotate(-22 " + p.x + " " + (padT + plotH + 13) + ")"} 
                                                                                                    x={p.x} 
                                                                                                    y={padT + plotH + 13} 
                                                                                                    fill="#cbd5e1" 
                                                                                                    fontSize="7" 
                                                                                                    fontWeight="600" 
                                                                                                    textAnchor="end"
                                                                                                >
                                                                                                    {p.unit ? p.unit : p.rentangWaktu.split("-")[0].trim()}
                                                                                                </text>
                                                                                            </g>
                                                                                        );
                                                                                    })}

                                                                                    {/* Indikator Scrubber Playhead Sinkron Detik Video */}
                                                                                    <g>
                                                                                        <line 
                                                                                            x1={scrubberX} 
                                                                                            y1={padT - 6} 
                                                                                            x2={scrubberX} 
                                                                                            y2={padT + plotH + 4} 
                                                                                            stroke="#ccff00" 
                                                                                            strokeWidth="1.8" 
                                                                                            strokeDasharray="3,3" 
                                                                                        />
                                                                                        {activePoint && showChartTvr && (
                                                                                            <circle 
                                                                                                cx={scrubberX} 
                                                                                                cy={activePoint.yTvr} 
                                                                                                r="4.5" 
                                                                                                fill="#ccff00" 
                                                                                                stroke="#090d16" 
                                                                                                strokeWidth="2" 
                                                                                            />
                                                                                        )}
                                                                                        <g transform={"translate(" + Math.max(35, Math.min(chartWidth - 35, scrubberX)) + ", " + (padT - 7) + ")"}>
                                                                                            <rect x="-24" y="-8" width="48" height="11" rx="3" fill="#0f172a" stroke="#ccff00" strokeWidth="0.8" />
                                                                                            <text x="0" y="0.5" fill="#ccff00" fontSize="7" fontWeight="bold" fontFamily="monospace" textAnchor="middle">
                                                                                                {formatTime(currentTime)}
                                                                                            </text>
                                                                                        </g>
                                                                                    </g>
                                                                                </svg>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })()}

                                                    </>
                                                ) : (
                                                    <div className="w-full h-full flex flex-col items-center justify-center p-6 bg-gradient-to-b from-slate-900 via-slate-950 to-black select-none">
                                                        {/* Tab Selector: Upload File Lokal vs Monitoring Link YouTube */}
                                                        <div className="flex items-center gap-1.5 p-1 bg-black/60 border border-slate-800 rounded-2xl mb-4 shadow-lg">
                                                            <button
                                                                type="button"
                                                                onClick={() => setVideoSourceTab('local')}
                                                                className={`px-4 py-2 rounded-xl text-xs font-black transition-all flex items-center gap-2 ${
                                                                    videoSourceTab === 'local'
                                                                        ? 'bg-neon text-obsidian shadow-[0_0_15px_rgba(204,255,0,0.35)]'
                                                                        : 'text-slate-400 hover:text-white hover:bg-white/5'
                                                                }`}
                                                            >
                                                                <i className="fa-solid fa-file-video text-xs"></i>
                                                                <span>Upload File Lokal</span>
                                                            </button>
                                                            <button
                                                                type="button"
                                                                onClick={() => setVideoSourceTab('url')}
                                                                className={`px-4 py-2 rounded-xl text-xs font-black transition-all flex items-center gap-2 ${
                                                                    videoSourceTab === 'url'
                                                                        ? 'bg-neon text-obsidian shadow-[0_0_15px_rgba(204,255,0,0.35)]'
                                                                        : 'text-slate-400 hover:text-white hover:bg-white/5'
                                                                }`}
                                                            >
                                                                <i className="fa-brands fa-youtube text-red-500 text-sm"></i>
                                                                <span>Monitoring by Link / YouTube</span>
                                                            </button>
                                                        </div>

                                                        {videoSourceTab === 'local' ? (
                                                            <div 
                                                                onClick={() => fileInputRef.current.click()}
                                                                className="flex flex-col items-center justify-center cursor-pointer group p-4 max-w-md w-full rounded-2xl hover:bg-white/5 transition-all text-center"
                                                            >
                                                                <div className="w-16 h-16 rounded-full bg-obsidian text-neon flex items-center justify-center text-2xl mb-3 shadow-xl border-2 border-slate-800 group-hover:scale-110 group-hover:border-neon transition-all">
                                                                    <i className="fa-solid fa-play ml-1"></i>
                                                                </div>
                                                                <p className="font-black text-sm sm:text-base text-white tracking-tight">
                                                                    Klik di Sini untuk Memilih / Mengunggah Video Lokal
                                                                </p>
                                                                <p className="text-xs text-slate-400 mt-1 max-w-sm">
                                                                    Video akan diputar langsung dan tersinkronisasi otomatis dengan baris MBM di sebelah kanan.
                                                                </p>
                                                                <div className="mt-3 flex items-center gap-2">
                                                                    <span className="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-700">MP4</span>
                                                                    <span className="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-700">MKV</span>
                                                                    <span className="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-700">MOV</span>
                                                                    <span className="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded border border-slate-700">WebM</span>
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            <div className="w-full max-w-lg p-5 bg-slate-900/90 rounded-2xl border border-slate-700/80 shadow-2xl space-y-3.5 text-left animate-in fade-in zoom-in-95">
                                                                <div className="flex items-center justify-between">
                                                                    <div className="flex items-center gap-2 text-white font-black text-xs sm:text-sm">
                                                                        <span className="w-2.5 h-2.5 rounded-full bg-neon animate-pulse"></span>
                                                                        <span>Monitoring Link YouTube / Video URL</span>
                                                                    </div>
                                                                    <span className="text-[10px] font-bold text-slate-400 bg-black/40 px-2 py-0.5 rounded font-mono">
                                                                        Auto-Sync MBM & AI
                                                                    </span>
                                                                </div>

                                                                <p className="text-[11px] text-slate-300 leading-relaxed">
                                                                    Tempel link video publik dari YouTube atau link streaming langsung (.mp4). Gemini AI dapat membaca visual adegan dan dialog percakapan langsung dari link tersebut.
                                                                </p>

                                                                <div className="flex gap-2">
                                                                    <input
                                                                        type="text"
                                                                        value={inputVideoUrl}
                                                                        onChange={(e) => setInputVideoUrl(e.target.value)}
                                                                        onKeyDown={(e) => { if (e.key === 'Enter') handleLoadVideoUrl(); }}
                                                                        placeholder="Contoh: https://www.youtube.com/watch?v=..."
                                                                        className="flex-1 bg-black/70 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-neon font-mono shadow-inner"
                                                                    />
                                                                    <button
                                                                        type="button"
                                                                        onClick={() => handleLoadVideoUrl()}
                                                                        className="px-4 py-2.5 bg-neon hover:bg-neon-dark text-obsidian font-black text-xs rounded-xl shadow-md transition-all active:scale-95 flex items-center gap-1.5 shrink-0"
                                                                    >
                                                                        <i className="fa-solid fa-link text-xs"></i>
                                                                        <span>Muat Link</span>
                                                                    </button>
                                                                </div>

                                                                {/* Quick Sample Link Presets */}
                                                                <div className="pt-2 border-t border-slate-800 flex items-center justify-between gap-2 flex-wrap">
                                                                    <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">
                                                                        Contoh Link Siaran:
                                                                    </span>
                                                                    <div className="flex items-center gap-1.5 flex-wrap">
                                                                        <button
                                                                            type="button"
                                                                            onClick={() => {
                                                                                const sample = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
                                                                                setInputVideoUrl(sample);
                                                                                handleLoadVideoUrl(sample);
                                                                            }}
                                                                            className="text-[10px] font-bold bg-white/5 hover:bg-red-500/20 text-slate-300 hover:text-red-300 border border-white/10 px-2.5 py-1 rounded-lg transition-all flex items-center gap-1"
                                                                        >
                                                                            <i className="fa-brands fa-youtube text-red-500 text-[10px]"></i>
                                                                            <span>Sample YouTube</span>
                                                                        </button>
                                                                        <button
                                                                            type="button"
                                                                            onClick={() => {
                                                                                const sample = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
                                                                                setInputVideoUrl(sample);
                                                                                handleLoadVideoUrl(sample);
                                                                            }}
                                                                            className="text-[10px] font-bold bg-white/5 hover:bg-sky-500/20 text-slate-300 hover:text-sky-300 border border-white/10 px-2.5 py-1 rounded-lg transition-all flex items-center gap-1"
                                                                        >
                                                                            <i className="fa-solid fa-play text-sky-400 text-[9px]"></i>
                                                                            <span>Sample MP4 CDN</span>
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )}

                                                        {isVideoZoomed && (
                                                            <button 
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    setIsVideoZoomed(false);
                                                                }}
                                                                className="mt-6 px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition-all"
                                                            >
                                                                {t("exitZoom")}
                                                            </button>
                                                        )}
                                                    </div>
                                                )}
                                            </div>

                                            {/* GRAFIK RATING SELALU DI DALAM PREVIEW VIDEO SEPERTI ATTACHMENT 3 & 4 */}

                                            {/* VISUAL CHART PERFORMA MENIT (TVR & AUDIENCE SHARE) SINKRONISASI VIDEO */}
                                            {false && (
                                                <div className="bg-slate-950 text-white rounded-3xl border border-slate-800 p-4 sm:p-5 shadow-2xl space-y-4 animate-fadeIn transition-all mt-3">
                                                    {/* Header Grafik Rating & KPI Summary Cards */}
                                                    <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3 border-b border-slate-800/80 pb-3.5">
                                                        <div className="space-y-1">
                                                            <div className="flex items-center gap-2">
                                                                <span className="w-2.5 h-2.5 rounded-full bg-neon animate-pulse"></span>
                                                                <h3 className="font-black text-sm tracking-tight text-white uppercase flex items-center gap-2">
                                                                    <span>Grafik Rating Menit-ke-Menit (TVR & Share)</span>
                                                                    <span className="text-[9px] bg-slate-800 text-slate-300 font-bold px-2 py-0.5 rounded-full lowercase">
                                                                        sinkron playhead video
                                                                    </span>
                                                                </h3>
                                                            </div>
                                                            <p className="text-[11px] text-slate-400 font-medium">
                                                                Garis penanda vertikal bergerak otomatis mengikuti detik video yang sedang diputar. Klik grafik untuk lompat adegan.
                                                            </p>
                                                        </div>

                                                        {/* KPI Badges: Avg TVR, Peak TVR, Avg Share, Peak Share */}
                                                        {ratingStats && (
                                                            <div className="flex items-center gap-2 flex-wrap">
                                                                <div className="bg-slate-900 border border-slate-800 rounded-xl px-2.5 py-1 text-center">
                                                                    <span className="block text-[8px] font-extrabold text-slate-400 uppercase tracking-wider">Avg TVR</span>
                                                                    <span className="font-mono font-black text-xs text-neon">{ratingStats.avgTvr}</span>
                                                                </div>
                                                                <div className="bg-slate-900 border border-slate-800 rounded-xl px-2.5 py-1 text-center">
                                                                    <span className="block text-[8px] font-extrabold text-slate-400 uppercase tracking-wider">Peak TVR</span>
                                                                    <span className="font-mono font-black text-xs text-neon">{ratingStats.peakTvr}</span>
                                                                </div>
                                                                <div className="bg-slate-900 border border-slate-800 rounded-xl px-2.5 py-1 text-center">
                                                                    <span className="block text-[8px] font-extrabold text-slate-400 uppercase tracking-wider">Avg Share</span>
                                                                    <span className="font-mono font-black text-xs text-sky-400">{ratingStats.avgShare}%</span>
                                                                </div>
                                                                <div className="bg-slate-900 border border-slate-800 rounded-xl px-2.5 py-1 text-center">
                                                                    <span className="block text-[8px] font-extrabold text-slate-400 uppercase tracking-wider">Peak Share</span>
                                                                    <span className="font-mono font-black text-xs text-sky-400">{ratingStats.peakShare}%</span>
                                                                </div>
                                                                <button 
                                                                    onClick={() => setShowRatingModal(true)}
                                                                    className="bg-[#f4fce3] hover:bg-[#eaf9cc] text-slate-950 px-3 py-1.5 rounded-xl text-[10px] font-black border border-limeBorder flex items-center gap-1.5 shadow-sm active:scale-95 transition-all"
                                                                    title="Buka form impor atau tempel data rating Nielsen"
                                                                >
                                                                    <span>Tempel Rating Nielsen</span>
                                                                </button>
                                                                <button 
                                                                    type="button"
                                                                    onClick={() => setShowAnalyticsDrawer(!showAnalyticsDrawer)}
                                                                    className={"px-3 py-1.5 rounded-xl text-[10px] font-black border flex items-center gap-1.5 shadow-sm active:scale-95 transition-all " + (showAnalyticsDrawer ? "bg-neon text-obsidian border-neon shadow-[0_0_12px_rgba(204,255,0,0.3)]" : "bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700")}
                                                                    title="Buka / Tutup Panel Analisis Statistik, Tipologi Bentuk Kurva & Emosi"
                                                                >
                                                                    <i className="fa-solid fa-chart-pie text-[10px]"></i>
                                                                    <span>Analisis Statistik</span>
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>

                                                    {/* HUD Live Playhead Detik & Metrik Real-time */}
                                                    {(() => {
                                                        const activeRow = mbmRows.find(r => r.id === activeRowId) || mbmRows[0];
                                                        return (
                                                            <div className="flex items-center justify-between bg-slate-900/90 rounded-xl px-3.5 py-2 border border-slate-800 text-xs">
                                                                <div className="flex items-center gap-2">
                                                                    <span className="w-2 h-2 rounded-full bg-neon animate-pulse"></span>
                                                                    <span className="font-bold text-slate-300">Posisi Playhead:</span>
                                                                    <span className="font-mono font-black text-neon bg-black/60 px-2 py-0.5 rounded border border-slate-800">
                                                                        {formatTime(currentTime)} / {formatTime(videoDuration)}
                                                                    </span>
                                                                    {activeRow && (
                                                                        <span className="text-slate-400 text-[11px] truncate max-w-xs hidden sm:inline">
                                                                            • {activeRow.rentangWaktu} ({activeRow.unit || 'Segmen'})
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                <div className="flex items-center gap-3">
                                                                    <div className="flex items-center gap-1.5">
                                                                        <span className="w-2 h-2 rounded-full bg-neon"></span>
                                                                        <span className="text-[11px] text-slate-400 font-bold">TVR Saat Ini:</span>
                                                                        <span className="font-mono font-black text-neon text-xs">{activeRow?.tvr ?? '-'}</span>
                                                                    </div>
                                                                    <div className="flex items-center gap-1.5">
                                                                        <span className="w-2 h-2 rounded-full bg-sky-400"></span>
                                                                        <span className="text-[11px] text-slate-400 font-bold">Share:</span>
                                                                        <span className="font-mono font-black text-sky-400 text-xs">{activeRow?.share ? `${activeRow.share}%` : '-'}</span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })()}

                                                    {/* SVG Interactive Chart Canvas */}
                                                    {(() => {
                                                        const chartWidth = 1000;
                                                        const chartHeight = 175;
                                                        const padL = 45;
                                                        const padR = 45;
                                                        const padT = 20;
                                                        const padB = 25;
                                                        const plotW = chartWidth - padL - padR;
                                                        const plotH = chartHeight - padT - padB;

                                                        const lastRowEnd = mbmRows.length > 0 
                                                            ? parseTimeToSeconds((mbmRows[mbmRows.length - 1].rentangWaktu || "").split('-')[1]) 
                                                            : 600;
                                                        const totalSec = Math.max(videoDuration || 0, lastRowEnd || 600, 60);

                                                        const maxTvrVal = Math.max(4.0, ...mbmRows.map(r => Number(r.tvr) || 0)) * 1.15;
                                                        const maxShareVal = Math.max(20.0, ...mbmRows.map(r => Number(r.share) || 0)) * 1.15;

                                                        const points = mbmRows.map((r, i) => {
                                                            const parts = (r.rentangWaktu || "").split('-');
                                                            const sStart = parts.length > 0 ? parseTimeToSeconds(parts[0]) : i * 60;
                                                            const sEnd = parts.length > 1 ? parseTimeToSeconds(parts[1]) : (sStart + 60);
                                                            const sMid = (sStart + sEnd) / 2;

                                                            const x = padL + (sMid / totalSec) * plotW;
                                                            const x1 = padL + (sStart / totalSec) * plotW;
                                                            const x2 = padL + (sEnd / totalSec) * plotW;

                                                            const tvrNum = Number(r.tvr) || 0;
                                                            const shareNum = Number(r.share) || 0;

                                                            const yTvr = (padT + plotH) - (tvrNum / maxTvrVal) * plotH;
                                                            const yShare = (padT + plotH) - (shareNum / maxShareVal) * plotH;

                                                            const isAd = String(r.unit || "").toLowerCase().includes("iklan") || 
                                                                         String(r.unit || "").toLowerCase().includes("break") || 
                                                                         String(r.unit || "").toLowerCase().includes("ads");

                                                            return { ...r, sStart, sEnd, sMid, x, x1, x2, yTvr, yShare, isAd };
                                                        });

                                                        const tvrPathD = points.reduce((acc, p, idx) => `${acc} ${idx === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.yTvr.toFixed(1)}`, '');
                                                        const sharePathD = points.reduce((acc, p, idx) => `${acc} ${idx === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.yShare.toFixed(1)}`, '');
                                                        
                                                        const firstX = points[0]?.x || padL;
                                                        const lastX = points[points.length - 1]?.x || (padL + plotW);
                                                        const baseY = padT + plotH;
                                                        const tvrAreaD = points.length > 0 
                                                            ? `${tvrPathD} L ${lastX.toFixed(1)} ${baseY} L ${firstX.toFixed(1)} ${baseY} Z` 
                                                            : '';

                                                        const scrubberX = Math.max(padL, Math.min(padL + plotW, padL + (currentTime / totalSec) * plotW));
                                                        const activePoint = points.find(p => currentTime >= p.sStart && currentTime < p.sEnd) || points[0];

                                                        return (
                                                            <div className="relative select-none">
                                                                <svg 
                                                                    viewBox={`0 0 ${chartWidth} ${chartHeight}`} 
                                                                    className="w-full h-auto bg-slate-900/70 rounded-2xl border border-slate-800/80 cursor-crosshair overflow-visible"
                                                                    onClick={(e) => {
                                                                        const rect = e.currentTarget.getBoundingClientRect();
                                                                        const clickX = e.clientX - rect.left;
                                                                        const scaleX = chartWidth / rect.width;
                                                                        const svgX = clickX * scaleX;
                                                                        const normX = Math.max(0, Math.min(1, (svgX - padL) / plotW));
                                                                        const targetTime = normX * totalSec;
                                                                        if (videoRef.current) {
                                                                            videoRef.current.currentTime = targetTime;
                                                                            setCurrentTime(targetTime);
                                                                            notify(`Melompat ke menit ${formatTime(targetTime)}`);
                                                                        }
                                                                    }}
                                                                >
                                                                    <defs>
                                                                        <linearGradient id="tvrGradient" x1="0" y1="0" x2="0" y2="1">
                                                                            <stop offset="0%" stopColor="#ccff00" stopOpacity="0.4" />
                                                                            <stop offset="100%" stopColor="#ccff00" stopOpacity="0.0" />
                                                                        </linearGradient>
                                                                        <linearGradient id="shareGradient" x1="0" y1="0" x2="0" y2="1">
                                                                            <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.25" />
                                                                            <stop offset="100%" stopColor="#38bdf8" stopOpacity="0.0" />
                                                                        </linearGradient>
                                                                        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
                                                                            <feGaussianBlur stdDeviation="3" result="blur" />
                                                                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                                                        </filter>
                                                                    </defs>

                                                                    {/* Grid Garis Horizontal */}
                                                                    {[0, 0.25, 0.5, 0.75, 1].map((pct, idx) => {
                                                                        const y = padT + plotH * pct;
                                                                        const tvrVal = ((1 - pct) * maxTvrVal).toFixed(1);
                                                                        const shareVal = Math.round((1 - pct) * maxShareVal);
                                                                        return (
                                                                            <g key={idx}>
                                                                                <line x1={padL} y1={y} x2={padL + plotW} y2={y} stroke="#1e293b" strokeDasharray="3,3" />
                                                                                <text x={padL - 8} y={y + 3} fill="#94a3b8" fontSize="9" fontFamily="monospace" textAnchor="end">{tvrVal}</text>
                                                                                <text x={padL + plotW + 8} y={y + 3} fill="#38bdf8" fontSize="9" fontFamily="monospace" textAnchor="start">{shareVal}%</text>
                                                                            </g>
                                                                        );
                                                                    })}

                                                                    {/* Zona Iklan / Commercial Break (Bands Berwarna Amber) */}
                                                                    {points.filter(p => p.isAd).map((p, i) => (
                                                                        <g key={i}>
                                                                            <rect 
                                                                                x={p.x1} 
                                                                                y={padT} 
                                                                                width={Math.max(4, p.x2 - p.x1)} 
                                                                                height={plotH} 
                                                                                fill="rgba(245, 158, 11, 0.12)" 
                                                                                stroke="rgba(245, 158, 11, 0.3)" 
                                                                                strokeDasharray="2,2" 
                                                                            />
                                                                            <text x={(p.x1 + p.x2) / 2} y={padT + 12} fill="#f59e0b" fontSize="8" fontWeight="bold" textAnchor="middle">
                                                                                IKLAN
                                                                            </text>
                                                                        </g>
                                                                    ))}

                                                                    {/* Area Fill di Bawah Garis TVR */}
                                                                    {tvrAreaD && <path d={tvrAreaD} fill="url(#tvrGradient)" />}

                                                                    {/* Garis SHARE (%) Biru Langit */}
                                                                    {sharePathD && (
                                                                        <path 
                                                                            d={sharePathD} 
                                                                            fill="none" 
                                                                            stroke="#38bdf8" 
                                                                            strokeWidth="2" 
                                                                            strokeLinecap="round" 
                                                                            strokeLinejoin="round" 
                                                                        />
                                                                    )}

                                                                    {/* Garis TVR Hijau Neon Berkilau */}
                                                                    {tvrPathD && (
                                                                        <path 
                                                                            d={tvrPathD} 
                                                                            fill="none" 
                                                                            stroke="#ccff00" 
                                                                            strokeWidth="2.8" 
                                                                            strokeLinecap="round" 
                                                                            strokeLinejoin="round" 
                                                                            filter="url(#neonGlow)"
                                                                        />
                                                                    )}

                                                                    {/* Titik Data Poin */}
                                                                    {points.map((p, i) => (
                                                                        <g key={i} className="cursor-pointer group">
                                                                            <circle cx={p.x} cy={p.yTvr} r="3" fill="#ccff00" stroke="#090d16" strokeWidth="1.5" />
                                                                            <circle cx={p.x} cy={p.yShare} r="2.5" fill="#38bdf8" stroke="#090d16" strokeWidth="1" />
                                                                        </g>
                                                                    ))}

                                                                    {/* Ticks Label Waktu X-Axis */}
                                                                    {[0, 0.2, 0.4, 0.6, 0.8, 1].map((pct, idx) => {
                                                                        const x = padL + plotW * pct;
                                                                        const sec = pct * totalSec;
                                                                        return (
                                                                            <g key={idx}>
                                                                                <line x1={x} y1={padT + plotH} x2={x} y2={padT + plotH + 5} stroke="#334155" />
                                                                                <text x={x} y={padT + plotH + 16} fill="#64748b" fontSize="9" fontFamily="monospace" textAnchor="middle">
                                                                                    {formatTime(sec)}
                                                                                </text>
                                                                            </g>
                                                                        );
                                                                    })}

                                                                    {/* GARIS PENANDA VERTIKAL REAL-TIME (DYNAMIC SCRUBBER PLAYHEAD) */}
                                                                    <g>
                                                                        <line 
                                                                            x1={scrubberX} 
                                                                            y1={padT - 4} 
                                                                            x2={scrubberX} 
                                                                            y2={padT + plotH + 6} 
                                                                            stroke="#ccff00" 
                                                                            strokeWidth="2" 
                                                                            strokeDasharray="3,3" 
                                                                        />
                                                                        {activePoint && (
                                                                            <circle 
                                                                                cx={scrubberX} 
                                                                                cy={activePoint.yTvr} 
                                                                                r="6" 
                                                                                fill="#ccff00" 
                                                                                stroke="#090d16" 
                                                                                strokeWidth="2.5"
                                                                                className="animate-pulse"
                                                                            />
                                                                        )}
                                                                        <g transform={`translate(${Math.max(60, Math.min(chartWidth - 60, scrubberX))}, ${padT - 6})`}>
                                                                            <rect x="-42" y="-14" width="84" height="15" rx="4" fill="#0f172a" stroke="#ccff00" strokeWidth="1" />
                                                                            <text x="0" y="-3.5" fill="#ccff00" fontSize="8.5" fontWeight="900" fontFamily="monospace" textAnchor="middle">
                                                                                {formatTime(currentTime)} • {activePoint?.tvr || '-'}
                                                                            </text>
                                                                        </g>
                                                                    </g>
                                                                </svg>

                                                                {/* Keterangan Legenda di Kiri Bawah */}
                                                                <div className="flex items-center justify-between pt-1 px-1 text-[10px] text-slate-400 font-bold">
                                                                    <div className="flex items-center gap-4">
                                                                        <span className="flex items-center gap-1.5 text-neon font-mono">
                                                                            <span className="w-2.5 h-1 bg-neon rounded-full"></span> Garis TVR (Rating Poin)
                                                                        </span>
                                                                        <span className="flex items-center gap-1.5 text-sky-400 font-mono">
                                                                            <span className="w-2.5 h-1 bg-sky-400 rounded-full"></span> Garis SHARE (%)
                                                                        </span>
                                                                        <span className="flex items-center gap-1.5 text-amber-400">
                                                                            <span className="w-2 h-2 bg-amber-500/30 border border-amber-400 rounded"></span> Zona Iklan (Commercial)
                                                                        </span>
                                                                    </div>
                                                                    <span className="italic text-slate-500 hidden sm:inline">
                                                                        💡 Klik titik grafik untuk langsung memutar video di menit tersebut.
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        );
                                                    })()}
                                                </div>
                                            )}

                                            {/* Progress Bar Generator MBM & Tools Timer Waktu Generate (Attachment 2) */}
                                            {isGenerating && (
                                                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 sm:p-5 space-y-3 mt-2 shadow-sm animate-in fade-in">
                                                    <div className="flex flex-wrap justify-between items-center gap-2 text-xs font-black text-slate-700">
                                                        <span className="flex items-center gap-2 text-obsidian min-w-0 flex-1">
                                                            <i className="fa-solid fa-spinner animate-spin text-blue-600 shrink-0 text-sm"></i>
                                                            <span className="truncate">{currentProcessingSegment || "Menganalisis konten video..."}</span>
                                                        </span>
                                                        <div className="flex items-center gap-2 shrink-0">
                                                            {/* Live Stopwatch Timer Badge */}
                                                            <div className="bg-obsidian border border-slate-700 text-neon px-2.5 py-1 rounded-xl text-xs font-mono font-bold flex items-center gap-1.5 shadow-inner" title="Waktu pengerjaan generate yang sedang berjalan">
                                                                <i className="fa-solid fa-stopwatch text-neon animate-pulse text-[11px]"></i>
                                                                <span>⏱️ {formatElapsedTimer(generationElapsedSeconds)}</span>
                                                            </div>
                                                            <span className="bg-obsidian text-neon px-3 py-1 rounded-xl text-xs font-mono font-black shadow-inner">
                                                                {progress}%
                                                            </span>
                                                        </div>
                                                    </div>

                                                    {/* Bar Progres */}
                                                    <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden flex shadow-inner">
                                                        <div className="h-full bg-obsidian transition-all duration-300" style={{ width: `${progress}%` }}></div>
                                                        <div className="h-full bg-neon transition-all duration-300" style={{ width: `${progress * 0.15}%` }}></div>
                                                    </div>

                                                    {/* Keterangan Detail Timer */}
                                                    <div className="flex items-center justify-between text-[11px] text-slate-500 font-semibold pt-0.5">
                                                        <span className="flex items-center gap-1.5">
                                                            <i className="fa-solid fa-clock-rotate-left text-slate-400"></i>
                                                            <span>Waktu berjalan: <strong className="text-slate-800 font-mono font-bold">{formatElapsedHuman(generationElapsedSeconds)}</strong> ({formatElapsedTimer(generationElapsedSeconds)})</span>
                                                        </span>
                                                        <span className="text-slate-400 font-mono">Target: 100% Selesai</span>
                                                    </div>
                                                </div>
                                            )}

                                            {/* Banner Informasi Waktu Penyelesaian Generate (100% Selesai - Attachment 2) */}
                                            {!isGenerating && lastGenerationDuration && (
                                                <div className="bg-emerald-50/90 border border-emerald-200/90 rounded-2xl p-3 sm:px-4 sm:py-2.5 flex items-center justify-between gap-2 mt-2 text-xs text-emerald-900 shadow-sm animate-in fade-in">
                                                    <div className="flex items-center gap-2.5 min-w-0">
                                                        <span className="w-6 h-6 rounded-lg bg-emerald-500 text-white flex items-center justify-center shrink-0 text-xs shadow-sm">
                                                            <i className="fa-solid fa-check font-bold"></i>
                                                        </span>
                                                        <div className="truncate">
                                                            <span className="font-extrabold text-emerald-950">AI Generate Selesai 100%:</span>{' '}
                                                            <span>Total durasi pengerjaan <strong className="font-mono text-emerald-950 bg-emerald-200/60 px-2 py-0.5 rounded-lg border border-emerald-300 font-black">{lastGenerationDuration.formattedTime} ({lastGenerationDuration.formattedTimer})</strong></span>
                                                        </div>
                                                    </div>
                                                    <button
                                                        onClick={() => setLastGenerationDuration(null)}
                                                        className="text-emerald-700 hover:text-emerald-950 text-xs px-2 py-1 rounded-lg hover:bg-emerald-200/50 transition-colors shrink-0"
                                                        title="Tutup banner info waktu"
                                                    >
                                                        <i className="fa-solid fa-xmark"></i>
                                                    </button>
                                                </div>
                                            )}

                                            {/* SINOPSIS / RINGKASAN GLOBAL (ATTACHMENT 1) DIGABUNG TEPAT DI BAWAH PREVIEW VIDEO */}
                                            <div className="bg-amber-50/60 border border-amber-200/80 rounded-2xl p-4 sm:p-5 space-y-2.5 mt-2">
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center gap-2">
                                                        <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                                                        <span className="text-[11px] font-black text-amber-900 uppercase tracking-wider">
                                                            SINOPSIS / RINGKASAN GLOBAL
                                                        </span>
                                                    </div>
                                                    <span className="text-[10px] text-amber-700 font-bold">Diekspor ke Excel</span>
                                                </div>
                                                <textarea 
                                                    value={synopsis}
                                                    onChange={(e) => setSynopsis(e.target.value)}
                                                    rows={6}
                                                    placeholder="Tuliskan atau hasil generate sinopsis global tayangan..."
                                                    className="w-full min-h-[140px] text-[13px] text-slate-800 font-medium leading-relaxed bg-white/95 p-3.5 rounded-xl border border-amber-200/80 outline-none focus:bg-white resize-y shadow-inner transition-all"
                                                />
                                            </div>
                                        </>
                                    )}
                                </div>
                            ) : (
                                <button 
                                    onClick={() => {
                                        setIsPreviewVisible(true);
                                        setIsPreviewCollapsed(false);
                                        notify("Area Preview Video dibuka kembali");
                                    }}
                                    className="w-full py-4 px-6 rounded-2xl border-2 border-dashed border-slate-300 hover:border-slate-400 bg-white/80 hover:bg-white text-slate-600 hover:text-slate-900 text-xs font-black flex items-center justify-center gap-2.5 transition-all shadow-sm group"
                                >
                                    <i className="fa-solid fa-video text-blue-600 group-hover:scale-110 transition-transform"></i>
                                    <span>Buka Kembali Area Preview Video</span>
                                </button>
                            )}

                            {/* ===================================================== */}
                            {/* 2. ATTACHMENT 1: BOX TOOLS MENU DI BAWAH PREVIEW VIDEO*/}
                            {/* ===================================================== */}
                            {isToolsVisible ? (
                                <div 
                                    style={{
                                        transform: `translate3d(${boxPositions.tools.x}px, ${boxPositions.tools.y}px, 0)`,
                                        zIndex: zIndices.tools
                                    }}
                                    onMouseDown={() => bringToFront('tools')}
                                    className="bg-white rounded-3xl border border-slate-200/90 shadow-[0_10px_35px_rgba(0,0,0,0.04)] p-6 sm:p-7 flex flex-col gap-5 transition-shadow"
                                >
                                    
                                    {/* Mac OS Window Dots & Action Buttons (Drag Handle) */}
                                    <div 
                                        onMouseDown={(e) => handleStartDrag('tools', e)}
                                        onTouchStart={(e) => handleStartDrag('tools', e)}
                                        className="flex items-center justify-between pb-2 border-b border-slate-100 cursor-grab active:cursor-grabbing select-none"
                                        title="Klik & tahan di sini untuk menggeser box Settingan (Drag)"
                                    >
                                        <div className="window-dots">
                                            <div className="window-dot"></div>
                                            <div className="window-dot"></div>
                                            <div className="window-dot"></div>
                                        </div>


                                        <div className="flex items-center gap-1.5 text-slate-400 text-xs">
                                            <button 
                                                onClick={() => {
                                                    if (window.confirm("Kembalikan parameter Box Tools (interval 1m, sinopsis, & posisi box) ke default?")) {
                                                        setIntervalMinutes(1);
                                                        setSynopsis(defaultSynopsis);
                                                        resetBoxPosition('tools');
                                                        notify("Parameter formulir & posisi Box Tools berhasil di-reset!");
                                                    }
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-slate-100 hover:text-slate-800 flex items-center justify-center transition-all"
                                                title="Reset parameter Box Settingan & kembalikan posisi awal"
                                            >
                                                <i className="fa-solid fa-rotate-left"></i>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    setIsToolsCollapsed(!isToolsCollapsed);
                                                    notify(isToolsCollapsed ? "Box Settingan diperluas" : "Box Settingan diminimalkan");
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-slate-100 hover:text-slate-800 flex items-center justify-center transition-all"
                                                title={isToolsCollapsed ? "Perbesar Box Settingan" : "Kecilkan / Minimize Box Settingan"}
                                            >
                                                <i className={`fa-solid ${isToolsCollapsed ? 'fa-plus' : 'fa-minus'}`}></i>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    setIsToolsVisible(false);
                                                    notify("Box Settingan ditutup. Klik tombol di bawah video untuk membuka kembali.");
                                                }}
                                                className="w-6 h-6 rounded-lg hover:bg-red-50 hover:text-red-500 flex items-center justify-center transition-all"
                                                title="Tutup / Sembunyikan Box Settingan"
                                            >
                                                <i className="fa-solid fa-xmark"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Jika Diminimalkan */}
                                    {isToolsCollapsed ? (
                                        <div 
                                            onClick={() => setIsToolsCollapsed(false)}
                                            className="py-1 flex items-center justify-between text-xs font-bold text-slate-500 cursor-pointer hover:text-slate-800 transition-colors"
                                        >
                                            <div className="flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                                                <span>File: {uploadedFileName || "Belum Ada File Dipilih"}</span>
                                                <span className="text-slate-300">•</span>
                                                <span>Interval: {intervalMinutes}m</span>
                                            </div>
                                            <span className="text-blue-600 text-[11px] font-black hover:underline flex items-center gap-1">
                                                <span>Buka Penuh</span>
                                                <i className="fa-solid fa-chevron-down text-[9px]"></i>
                                            </span>
                                        </div>
                                    ) : (
                                        <>
                                            {/* Pill Hijau "FILE AKTIF" Sesuai Attachment 1 */}
                                            <div className="bg-limePill border border-limeBorder text-limeText px-4 py-2.5 rounded-xl flex items-center justify-between text-xs font-black tracking-tight">
                                                <div className="flex items-center gap-2">
                                                    <i className="fa-solid fa-file-lines text-[12px]"></i>
                                                    <span className="uppercase text-[11px] tracking-wider font-extrabold text-lime-900">{t("activeFile")}</span>
                                                </div>
                                                <span className="truncate max-w-xs text-[11px] font-bold" title={uploadedFileName || "Belum Ada File Dipilih"}>
                                                    {uploadedFileName || "Belum Ada File Dipilih (Default Kosong)"}
                                                </span>
                                            </div>

                                            {/* SEKSI 1: KONTROL VIDEO & PARAMETER */}
                                            <div className="space-y-4 pt-1">
                                                <div className="flex items-center gap-2">
                                                    <span className="w-2 h-2 rounded-full bg-blue-600"></span>
                                                    <span className="text-[11px] font-extrabold text-slate-500 uppercase tracking-widest">{t("titleSource")}</span>
                                                </div>

                                                {/* Edit Nama Judul / File Langsung */}
                                                <div className="space-y-1.5">
                                                    <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">{t("fileNameLabel")}</label>
                                                    <input 
                                                        type="text"
                                                        value={uploadedFileName}
                                                        onChange={(e) => setUploadedFileName(e.target.value)}
                                                        placeholder="Belum ada file dipilih (default kosong)..."
                                                        className="w-full bg-[#f8fafc] border border-slate-200 rounded-2xl px-4 py-3 text-xs text-slate-800 font-bold outline-none focus:bg-white focus:border-slate-400 transition-all shadow-inner"
                                                    />
                                                </div>

                                                {/* Upload Video Sumber */}
                                                <div className="space-y-1.5">
                                                    <div className="flex items-center justify-between">
                                                        <label className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">{t("uploadVideoLabel")}</label>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-[10px] font-bold text-blue-600">
                                                                {videoFile ? formatTime(videoDuration) : (videoUrl ? (youtubeId ? 'YouTube' : formatTime(videoDuration)) : 'MP4/MKV')}
                                                            </span>
                                                            {(videoUrl || videoFile || (uploadedFileName && uploadedFileName.trim() !== "") || mbmRows.length > 0) && (
                                                                <button 
                                                                    type="button"
                                                                    onClick={handleRemoveVideo}
                                                                    className="text-[10px] text-red-500 hover:text-red-700 font-bold hover:underline flex items-center gap-1 transition-colors cursor-pointer"
                                                                    title="Hapus video & kosongkan seluruh materi pada proyek ini"
                                                                >
                                                                    <i className="fa-solid fa-trash-can text-[9px]"></i>
                                                                    <span>Hapus / Kosongkan</span>
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                    <div 
                                                        onClick={() => fileInputRef.current.click()}
                                                        className="w-full bg-[#f8fafc] border border-slate-200 hover:border-slate-300 rounded-2xl px-4 py-3 flex items-center justify-between cursor-pointer transition-all shadow-inner group"
                                                    >
                                                        <span className="text-xs font-bold text-slate-700 truncate pr-2">
                                                            {videoFile ? videoFile.name : t("selectVideoToPlay")}
                                                        </span>
                                                        <i className="fa-solid fa-folder-open text-slate-400 group-hover:text-slate-700 transition-colors"></i>
                                                    </div>
                                                    <input 
                                                        type="file" 
                                                        ref={fileInputRef} 
                                                        onChange={handleVideoUpload} 
                                                        accept="video/*" 
                                                        className="hidden" 
                                                    />
                                                </div>

                                                {/* Pilihan Transkrip Dialog / Audio Suara (Pilihan 1: Format Terpadu) */}
                                                <div className="bg-[#f4fce3]/60 border border-limeBorder rounded-2xl p-3.5 space-y-2.5">
                                                    <div className="flex items-center justify-between">
                                                        <div>
                                                            <span className="text-[11px] font-black text-slate-900 uppercase tracking-wider block">
                                                                TRANSKRIP OBROLAN & DIALOG SUARA
                                                            </span>
                                                            <span className="text-[10px] text-slate-600 font-medium">
